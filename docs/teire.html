<!DOCTYPE html>
<html lang="ja">
<head>
<base target="_top">
<meta name="robots" content="noindex, nofollow">
<!--
  Hallmark · genre: playful · theme: custom (tuned) · design-system: design.md · designed-as-app
  pre-emit critique: P5 H5 E5 S5 R4 V4

  見た目の決まりは design.md（このフォルダの中）に書いてある。ここはその実装。
  design.md より上に立つのは デジタル庁デザインシステム（DADS）だけ。
  https://design.digital.go.jp/dads/

  守っていること
    ・本文は16px以上。14px未満は使わない（DADSの下限）
    ・文字と背景は4.5:1以上、罫線・押せるものの枠と背景は3:1以上
      （scratchpad の contrast.js で実測ずみ。色を触ったら必ず測り直すこと）
    ・行間は本文150%以上、見出し140%
    ・フォーカスは「黄色＋黒」の二重リング。どの部品でも消さない
    ・押せるものの当たり判定は44px以上
    ・色だけで意味を伝えない（記号・文字・枠の太さを必ず添える）
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!--
  日本語は Noto Sans JP だけ（400/700）。重みを増やすと日本語フォントは一気に重くなるので、
  見出しの強さは太さではなく 大きさ・字間・色 で作る。
  Geist Mono はラテンだけで軽い。数字の桁をそろえる役だけに使う（1ウェイト）。
-->
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&family=Geist+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root {
  /* ===== 色 =====
     色相はすべて 262（当番の青）に寄せてある。色被りの無い灰色は使わない。
     値はすべて sRGB に収まることを確認ずみ。 */
  --paper:        oklch(97.2% 0.006 262);
  --paper-2:      oklch(99.2% 0.003 262);
  --paper-3:      oklch(94.5% 0.010 262);
  --paper-sunken: oklch(92.5% 0.008 262);

  --ink:          oklch(21%   0.014 262);
  --muted:        oklch(46%   0.022 262);

  --rule:         oklch(88%   0.012 262);   /* 飾り。意味を持たない区切り */
  --rule-strong:  oklch(62%   0.030 262);   /* 入力欄・押せるものの枠。3:1以上 */

  --accent:       oklch(48%   0.150 262);   /* 当番 */
  --accent-dark:  oklch(40%   0.150 262);
  --accent-soft:  oklch(95.5% 0.021 262);
  --care:         oklch(45%   0.095 165);   /* 手入れ */
  --care-dark:    oklch(37%   0.079 165);
  --care-soft:    oklch(95.5% 0.026 165);

  --danger:       oklch(50%   0.190 27);
  --danger-dark:  oklch(42%   0.173 27);
  --danger-soft:  oklch(96%   0.019 27);
  --warning:      oklch(48%   0.105 70);
  --warning-soft: oklch(96%   0.030 80);
  --success:      var(--care);
  --success-soft: var(--care-soft);

  /* 手入れの記号。色だけに頼らず、枠の太さと記号そのものでも分かるようにしてある */
  --maru2: var(--care);
  --maru1: var(--accent);
  --batsu: var(--muted);

  /* フォーカスリング（DADS の指定どおり黄＋黒の二重。色は変えない） */
  --focus-inner: oklch(87% 0.170 100);
  --focus-outer: #000000;

  /* ===== 余白 ===== 4pt の名前つきスケール。生の px は書かない */
  --space-3xs: 0.125rem;  --space-2xs: 0.25rem;  --space-xs: 0.5rem;
  --space-sm:  0.75rem;   --space-md:  1rem;     --space-lg: 1.5rem;
  --space-xl:  2.5rem;    --space-2xl: 4rem;     --space-3xl: 6rem;

  /* ===== 文字の大きさ ===== 比率1.25。ただし最小は14px（DADSの下限） */
  --text-xs:   0.875rem;    /* 14px */
  --text-sm:   0.9375rem;   /* 15px */
  --text-base: 1rem;        /* 16px */
  --text-md:   1.25rem;     /* 20px */
  --text-lg:   1.5625rem;   /* 25px */
  --text-xl:   1.953rem;    /* 31px */
  --text-display: clamp(1.75rem, 3vw + 1rem, 2.4414rem);

  --font-body: "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", sans-serif;
  --font-num:  "Geist Mono", ui-monospace, SFMono-Regular, Consolas, monospace;

  /* ===== 動き ===== 2つだけ（press と nudge）。transform と opacity 以外は動かさない */
  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
  --ease-in:  cubic-bezier(0.7, 0, 0.84, 0);
  --dur-micro: 120ms;  --dur-short: 220ms;  --dur-long: 420ms;

  /* ===== 形 ===== playful の上限は12px。影は1段だけ、重ねない */
  --radius-card:  12px;
  --radius-input: 8px;
  --radius-pill:  999px;
  --shadow-card: 0 1px 2px oklch(21% 0.014 262 / 0.05);
  --shadow-lift: 0 8px 24px -10px oklch(48% 0.150 262 / 0.28);

  --z-base: 1; --z-raised: 10; --z-sticky: 200; --z-modal: 400; --z-toast: 500;

  --tap: 44px;

  /* ===== 前の名前 =====
     ページ側の style="" から直接呼ばれているので、消さずに新しい値へ向ける。 */
  --bg: var(--paper);          --card: var(--paper-2);
  --text: var(--ink);
  --primary: var(--accent);    --primary-dark: var(--accent-dark);
  --primary-soft: var(--accent-soft);
  --border: var(--rule);       --border-strong: var(--rule-strong);
  --danger-bg: var(--danger-soft);
  --success-bg: var(--care-soft);
  --warning-bg: var(--warning-soft);
}

* { box-sizing: border-box; }
/* はみ出しても横スクロールは起こさない。hidden ではなく clip（sticky を壊さない） */
html, body { overflow-x: clip; }

body {
  margin: 0;
  font-family: var(--font-body);
  background: var(--paper);
  color: var(--ink);
  font-size: var(--text-base);   /* DADSの本文の下限 */
  line-height: 1.7;              /* 本文は150%以上 */
}

/* ===== フォーカス =====
   黄色の内側と黒の外側の二重リング。背景が明るくても暗くてもどちらかが必ず見える。
   どの部品でも outline を消さないこと。出方は決してアニメーションさせない。 */
:focus-visible {
  outline: 3px solid var(--focus-inner);
  outline-offset: 0;
  box-shadow: 0 0 0 6px var(--focus-outer);
  border-radius: 2px;
  position: relative;
  z-index: var(--z-raised);
  transition: none;
}
/* :focus-visible を知らない古いブラウザ向け。新しいブラウザではこちらを打ち消す */
:focus { outline: 3px solid var(--focus-inner); box-shadow: 0 0 0 6px var(--focus-outer); }
:focus:not(:focus-visible) { outline: none; box-shadow: none; }

header.appbar {
  background: var(--accent);
  color: #fff;
  padding: var(--space-md);
  font-size: var(--text-md);
  font-weight: 700;
  line-height: 1.35;
  letter-spacing: -0.01em;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: var(--space-sm);
}
header.appbar.chief { background: var(--care); }
header.appbar a {
  color: #fff; font-size: var(--text-sm); font-weight: 400; cursor: pointer;
  min-height: var(--tap); display: inline-flex; align-items: center;
  white-space: nowrap; text-decoration: underline; text-underline-offset: 3px;
}

main { max-width: 760px; margin: 0 auto; padding: var(--space-md); }
main.wide { max-width: 1240px; }
/* 余白はわざと不揃いにする。まとまりの間はカードの内側より広い */
main > section + section { margin-top: var(--space-xl); }

.card {
  background: var(--paper-2);
  border: 1px solid var(--rule);
  border-radius: var(--radius-card);
  padding: var(--space-lg);
  margin-bottom: var(--space-md);
  box-shadow: var(--shadow-card);
}
/* 枠の中に枠は作らない。カードの中のカードは地の色だけで分ける */
.card .card { box-shadow: none; border-color: transparent; background: var(--paper); }

h1, h2, h3, h4 { overflow-wrap: anywhere; min-width: 0; }
h1 { font-size: var(--text-lg); line-height: 1.3; letter-spacing: -0.02em; margin: 0 0 var(--space-sm); }
h2 { font-size: var(--text-md); line-height: 1.35; letter-spacing: -0.015em; margin: 0 0 var(--space-xs); }
h3 { font-size: 1.0625rem; line-height: 1.4; margin: 0 0 var(--space-xs); }

/* 数字は Geist Mono で桁をそろえる。役は「表と数の欄」「丸バッジ」の2つだけ */
.num, .cell-count, .statline b, .summary-grid .stat b,
.pickcell .rank, .steps .s .no, .name-chip .r, .picked-list .item .n, .calday .d {
  font-family: var(--font-num);
  font-variant-numeric: tabular-nums;
  font-feature-settings: "tnum";
}

label { display: block; font-weight: 700; margin: var(--space-md) 0 var(--space-2xs); font-size: var(--text-base); }
label .req { color: var(--danger); font-size: var(--text-sm); margin-left: var(--space-2xs); }

/* 選ぶだけの小さなラベル。DADSの下限14pxは下回らない */
label.inline {
  display: inline-flex; align-items: center; gap: var(--space-xs); font-weight: 400;
  margin: 0 var(--space-sm) 0 0; font-size: var(--text-base); min-height: var(--tap); cursor: pointer;
}

select, input[type=text], input[type=number], input[type=password], input[type=date], textarea {
  width: 100%; padding: 11px var(--space-sm);
  border: 1px solid var(--rule-strong); border-radius: var(--radius-input);
  font-size: var(--text-base); background: var(--paper-2); color: var(--ink);
  font-family: inherit; min-height: var(--tap);
  transition: border-color var(--dur-micro) var(--ease-out);
}
input[type=number] { font-family: var(--font-num); font-variant-numeric: tabular-nums; }
select:hover, input:hover, textarea:hover { border-color: var(--accent); }
textarea { min-height: 88px; resize: vertical; line-height: 1.7; }
input[type=checkbox], input[type=radio] { width: 20px; height: 20px; margin: 0; accent-color: var(--accent); }

.row { display: flex; gap: var(--space-sm); flex-wrap: wrap; align-items: flex-end; }
.row > * { flex: 1; min-width: 140px; }
.row.tight > * { flex: 0 0 auto; min-width: 0; }

.checkbox-list, .radio-list { display: flex; flex-wrap: wrap; gap: var(--space-xs); margin-top: var(--space-xs); }

.chip {
  border: 1px solid var(--rule-strong); border-radius: var(--radius-pill);
  padding: 10px var(--space-lg); font-size: var(--text-base); cursor: pointer; user-select: none;
  background: var(--paper-2); min-height: var(--tap); display: inline-flex; align-items: center;
  white-space: nowrap;
  transition: transform var(--dur-micro) var(--ease-out), background-color var(--dur-micro) var(--ease-out);
}
.chip.selected { background: var(--accent); color: #fff; border-color: var(--accent); }
.chip.small { padding: var(--space-xs) 14px; font-size: var(--text-sm); }
.chip:active { transform: translateY(1px); }

/* ===== ボタン =====
   DADSの目安 中サイズ 96×48 / 小 80×36。当たり判定は44px以上。
   文言は動詞で終える（「保存」ではなく「人数と学年を保存」）。 */
button {
  background: var(--accent); color: #fff; border: 1px solid var(--accent);
  border-radius: var(--radius-input);
  padding: var(--space-sm) var(--space-lg); font-size: var(--text-base); font-weight: 700;
  cursor: pointer; min-height: 48px; min-width: 96px; font-family: inherit; line-height: 1.4;
  white-space: nowrap;   /* 押せる文字は2行にしない */
  transition: background-color var(--dur-micro) var(--ease-out), transform var(--dur-micro) var(--ease-out);
}
button:hover { background: var(--accent-dark); border-color: var(--accent-dark); }
button:active { transform: translateY(1px); }
button.secondary { background: var(--paper-2); color: var(--accent); border-color: var(--accent); }
button.secondary:hover { background: var(--accent-soft); }
button.danger { background: var(--danger); border-color: var(--danger); }
button.danger:hover { background: var(--danger-dark); border-color: var(--danger-dark); }
button.small { padding: var(--space-xs) 14px; font-size: var(--text-sm); min-height: 36px; min-width: 80px; margin: var(--space-2xs) 0; }
/*
  DADSは disabled を勧めていない（なぜ押せないかが伝わらないため）。
  この画面では押せる状態のままにして、押したときに足りないものを文章で知らせている。
  やむを得ず使う場所だけ、理由を必ず近くに書くこと。
*/
button:disabled { opacity: .55; cursor: not-allowed; }

.msg {
  padding: var(--space-sm) 14px; border-radius: var(--radius-input);
  margin: var(--space-sm) 0; font-size: var(--text-base); line-height: 1.7;
}
.msg.success { background: var(--care-soft); color: var(--care); border: 1px solid var(--care); border-left-width: 4px; }
.msg.error   { background: var(--danger-soft); color: var(--danger); border: 1px solid var(--danger); border-left-width: 4px; }
.msg.warning { background: var(--warning-soft); color: var(--warning); border: 1px solid var(--warning); border-left-width: 4px; }

table { width: 100%; border-collapse: collapse; font-size: var(--text-base); }
th, td { border: 1px solid var(--rule); padding: 10px var(--space-sm); text-align: left; line-height: 1.5; }
th { background: var(--paper-3); font-weight: 700; }

.muted { color: var(--muted); font-size: var(--text-sm); }
.hint { color: var(--muted); font-size: var(--text-sm); margin: var(--space-2xs) 0 0; line-height: 1.7; max-width: 65ch; }

.list-item {
  display: flex; justify-content: space-between; align-items: center; gap: var(--space-sm);
  padding: var(--space-sm) 0; border-bottom: 1px solid var(--rule); flex-wrap: wrap;
}
.list-item:last-child { border-bottom: none; }

.tabs { display: flex; gap: var(--space-xs); margin-bottom: var(--space-md); flex-wrap: wrap; }
.tabs button { background: var(--paper-2); color: var(--ink); border: 1px solid var(--rule-strong); border-radius: var(--radius-pill); }
.tabs button:hover { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }
.tabs button.active { background: var(--accent); color: #fff; border-color: var(--accent); }

/* ===== 表のまわりの枠（Workbench） =====
   まとめる側の画面は表が主役。表を枠で囲って「道具の一画面」として立たせ、
   節と節はこの枠と余白だけで分ける（節ごとに罫線を引き足さない）。 */
.grid-wrap {
  overflow-x: auto;
  border: 1px solid var(--rule-strong);
  border-radius: var(--radius-input);
  background: var(--paper-2);
}
/* 枠の内側で表の外周がもう一度出ると二重に見えるので、外周だけ消す */
.grid-wrap > table.duty-grid > * > tr > *:first-child,
.grid-wrap > table.assign-grid > * > tr > *:first-child { border-left: 0; }
.grid-wrap > table.duty-grid > * > tr > *:last-child,
.grid-wrap > table.assign-grid > * > tr > *:last-child { border-right: 0; }
.grid-wrap > table.duty-grid > thead > tr > *,
.grid-wrap > table.assign-grid > thead > tr > * { border-top: 0; }
.grid-wrap > table.duty-grid > tbody > tr:last-child > *,
.grid-wrap > table.assign-grid > tbody > tr:last-child > * { border-bottom: 0; }
table.duty-grid { border-collapse: separate; border-spacing: 0; width: 100%; min-width: 640px; font-size: var(--text-sm); }
table.duty-grid th, table.duty-grid td { border: 1px solid var(--rule-strong); padding: 0; text-align: center; }
table.duty-grid thead th { background: var(--paper-3); padding: var(--space-xs) var(--space-2xs); font-size: var(--text-base); font-weight: 700; }
table.duty-grid th.rowhead {
  background: var(--paper-3); text-align: left; padding: var(--space-xs) 10px; white-space: nowrap;
  min-width: 96px; position: sticky; left: 0; z-index: var(--z-raised); font-size: var(--text-base);
}
/* 土日は色だけでなく文字（土・日）でも分かる */
table.duty-grid thead th.sat { background: var(--accent-soft); color: var(--accent-dark); }
table.duty-grid thead th.sun { background: var(--danger-soft); color: var(--danger); }

/* 部員が押す1マス。押した順に第1〜第4希望の番号が付く。 */
.pickcell {
  display: block; width: 100%; min-height: 64px; padding: var(--space-xs) var(--space-2xs);
  background: var(--paper-2); border: 0; cursor: pointer; user-select: none;
  font-size: var(--text-sm); color: var(--muted); line-height: 1.4; font-family: inherit;
  min-width: 0; border-radius: 0;
  transition: background-color var(--dur-micro) var(--ease-out);
}
.pickcell:hover { background: var(--accent-soft); }
.pickcell.picked { background: var(--accent-soft); }
.pickcell.disabled { background: var(--paper-sunken); color: var(--muted); cursor: not-allowed; }
.pickcell .rank {
  display: inline-flex; align-items: center; justify-content: center;
  width: 30px; height: 30px; border-radius: var(--radius-pill);
  background: var(--accent); color: #fff; font-weight: 700; font-size: var(--text-base);
}
/* 希望の順は濃さで表すが、数字そのものが読めるので色だけに頼っていない */
.pickcell .rank.r1 { background: oklch(33% 0.150 262); }
.pickcell .rank.r2 { background: oklch(40% 0.150 262); }
.pickcell .rank.r3 { background: oklch(48% 0.150 262); }
.pickcell .rank.r4 { background: oklch(56% 0.140 262); }
.pickcell .cap { display: block; font-size: var(--text-xs); }

/* 選んだ順の確認欄 */
.picked-list { display: flex; flex-direction: column; gap: var(--space-xs); margin-top: 10px; }
.picked-list .item {
  display: flex; align-items: center; gap: var(--space-sm);
  border: 1px solid var(--rule-strong); border-radius: var(--radius-input);
  padding: 10px var(--space-sm); background: var(--paper-2); flex-wrap: wrap;
}
.picked-list .item .n { flex: 0 0 auto; font-weight: 700; color: var(--accent); }
.picked-list .item .what { flex: 1 1 auto; font-weight: 700; }
.picked-list .item.empty { border-style: dashed; border-color: var(--rule-strong); color: var(--muted); background: var(--paper); }
.picked-list .item.empty .what { font-weight: 400; }

/* ===== 当番表・手入れ表（手で直す） ===== */
table.assign-grid { border-collapse: separate; border-spacing: 0; width: 100%; min-width: 760px; font-size: var(--text-sm); }
table.assign-grid th, table.assign-grid td { border: 1px solid var(--rule-strong); padding: var(--space-xs); vertical-align: top; }
table.assign-grid thead th { background: var(--paper-3); text-align: center; font-size: var(--text-base); }
table.assign-grid th.rowhead { background: var(--paper-3); text-align: left; white-space: nowrap; min-width: 100px; position: sticky; left: 0; z-index: var(--z-raised); font-size: var(--text-base); }
/* 過不足は色だけでなく、下の「〇人 / 下限〜上限」の文字でも分かる */
table.assign-grid td.short { background: var(--danger-soft); }
table.assign-grid td.over { background: var(--warning-soft); }

.name-chip {
  display: inline-flex; align-items: center; gap: var(--space-2xs); margin: var(--space-3xs);
  border: 1px solid var(--rule-strong); border-radius: var(--radius-pill);
  padding: var(--space-2xs) var(--space-2xs) var(--space-2xs) 10px;
  font-size: var(--text-sm); background: var(--paper-2); white-space: nowrap; min-height: 36px;
}
.name-chip .r { font-size: var(--text-xs); color: var(--muted); }
.name-chip .r.off { color: var(--warning); font-weight: 700; }
.name-chip.locked { border-color: var(--warning); border-width: 2px; }
/* チップの中の小さなボタン。見た目は小さいが当たり判定は32px確保する */
.name-chip .lock, .name-chip .x {
  background: none; border: 0; cursor: pointer; font-size: var(--text-sm); font-family: inherit;
  min-width: 32px; min-height: 32px; padding: 0; display: inline-flex;
  align-items: center; justify-content: center; border-radius: var(--radius-input); color: var(--ink);
}
.name-chip .x { color: var(--danger); font-weight: 700; }
.name-chip .lock:hover, .name-chip .x:hover { background: var(--paper-sunken); }
.cell-count { display: block; font-size: var(--text-xs); color: var(--muted); text-align: right; margin-top: var(--space-2xs); }
.cell-count.short { color: var(--danger); font-weight: 700; }
/* マスの中の「人を足す」。selectの既定の高さを保ちつつ小さめに */
.add-select { margin-top: var(--space-2xs); font-size: var(--text-sm); padding: var(--space-xs); min-height: 40px; }

/* ===== 手入れ：曜日／カレンダーの◎○× ===== */
.mark-row { display: flex; align-items: center; gap: var(--space-sm); padding: var(--space-xs) 0; border-bottom: 1px solid var(--rule); flex-wrap: wrap; }
.mark-row:last-child { border-bottom: none; }
.mark-row .k { flex: 0 0 104px; font-weight: 700; font-size: var(--text-base); }
.mark-row .k.sat { color: var(--accent-dark); }
.mark-row .k.sun { color: var(--danger); }
.marks { display: flex; gap: var(--space-xs); }
.mk {
  width: 56px; height: var(--tap); border: 1px solid var(--rule-strong); border-radius: var(--radius-input);
  background: var(--paper-2); font-size: 22px; line-height: 1; cursor: pointer; user-select: none;
  display: inline-flex; align-items: center; justify-content: center; color: var(--muted);
  font-weight: 700; font-family: inherit; min-width: 0; padding: 0;
  transition: transform var(--dur-micro) var(--ease-out), background-color var(--dur-micro) var(--ease-out);
}
.mk:hover { background: var(--accent-soft); }
.mk:active { transform: translateY(1px); }
/* 選ばれている状態は、色に加えて枠の太さでも分かるようにしてある */
.mk.on { border-width: 3px; }
.mk.on.m2 { background: var(--care-soft); border-color: var(--maru2); color: var(--maru2); }
.mk.on.m1 { background: var(--accent-soft); border-color: var(--maru1); color: var(--maru1); }
.mk.on.m0 { background: var(--paper-sunken); border-color: var(--batsu); color: var(--batsu); }

/* カレンダー（月曜始まり） */
.cal { margin-bottom: var(--space-md); }
.cal h4 { margin: 0 0 var(--space-xs); font-size: 1.0625rem; line-height: 1.4; }
table.cal-grid { border-collapse: separate; border-spacing: 0; width: 100%; table-layout: fixed; font-size: var(--text-sm); }
table.cal-grid th, table.cal-grid td { border: 1px solid var(--rule-strong); padding: 0; text-align: center; height: 68px; vertical-align: top; }
table.cal-grid th { background: var(--paper-3); height: auto; padding: var(--space-2xs) 0; font-size: var(--text-sm); }
table.cal-grid th.sat { background: var(--accent-soft); color: var(--accent-dark); }
table.cal-grid th.sun { background: var(--danger-soft); color: var(--danger); }
table.cal-grid td.off { background: var(--paper); }
.calday { display: block; width: 100%; height: 100%; min-height: var(--tap); border: 0; background: transparent; cursor: pointer; padding: var(--space-2xs) var(--space-3xs); font-family: inherit; }
.calday .d { display: block; font-size: var(--text-xs); color: var(--muted); }
.calday .m { display: block; font-size: 22px; font-weight: 700; line-height: 1.1; color: oklch(70% 0.015 262); }
.calday.m2 { background: var(--care-soft); } .calday.m2 .m { color: var(--maru2); }
.calday.m1 { background: var(--accent-soft); } .calday.m1 .m { color: var(--maru1); }
.calday.m0 { background: var(--paper-sunken); } .calday.m0 .m { color: var(--batsu); }
.calday .who { display: block; font-size: var(--text-xs); font-weight: 700; color: var(--ink); }

/* チェックシート（サブを選ぶ） */
.checksheet { display: flex; flex-wrap: wrap; gap: var(--space-xs); margin-top: var(--space-xs); }
.checksheet label {
  display: inline-flex; align-items: center; gap: var(--space-xs); margin: 0;
  border: 1px solid var(--rule-strong); border-radius: var(--radius-input); padding: 10px 14px;
  background: var(--paper-2); font-weight: 400; font-size: var(--text-base); cursor: pointer; min-height: var(--tap);
  transition: background-color var(--dur-micro) var(--ease-out);
}
.checksheet label:hover { background: var(--accent-soft); }
/* チェック済みは、色に加えて枠の太さでも分かる */
.checksheet label.on { border-color: var(--accent); border-width: 2px; background: var(--accent-soft); }
.checksheet label .g { color: var(--muted); font-size: var(--text-sm); }

/* ===== 見出しだけ出しておいて、押したら開く =====
   使う頻度が低いわりに場所を取っていたところを畳んである。 */
details.fold { border: 1px solid var(--rule-strong); border-radius: var(--radius-input); background: var(--paper-2); margin-top: var(--space-sm); }
details.fold > summary {
  cursor: pointer; padding: var(--space-sm) var(--space-md); font-weight: 700; font-size: var(--text-base);
  min-height: var(--tap); display: flex; align-items: center; gap: var(--space-xs); list-style: none;
  border-radius: var(--radius-input);
}
details.fold > summary::-webkit-details-marker { display: none; }
details.fold > summary::before { content: "\25B6"; font-size: 13px; color: var(--accent); }
details.fold[open] > summary::before { content: "\25BC"; }
details.fold > summary:hover { background: var(--accent-soft); }
details.fold[open] > summary { border-bottom: 1px solid var(--rule); border-radius: var(--radius-input) var(--radius-input) 0 0; }
.fold-body { padding: var(--space-2xs) var(--space-md) var(--space-md); }

/* ===== 決まりのまとまり =====
   当番と手入れは別の表なのに、決まりが1枚に続けて並んでいて境目が見えなかった。
   fieldset/legend で囲うと、目で見て分かれるだけでなく、読み上げでも
   「当番の決まりの中の欄」と伝わる（DADS：関係のある入力欄はひとまとまりにする）。 */
fieldset.rule {
  border: 1px solid var(--rule-strong); border-left-width: 6px;
  border-radius: var(--radius-card); padding: var(--space-xs) var(--space-md) var(--space-md);
  margin: 0 0 var(--space-md);
}
fieldset.rule > legend {
  font-weight: 700; font-size: 1.0625rem; line-height: 1.4;
  padding: var(--space-3xs) 10px; margin-left: -4px;
  border: 1px solid var(--rule-strong); border-radius: var(--radius-pill); background: var(--paper-2);
}
/* 何の表に効くのかを、まとまりの頭に必ず書く */
fieldset.rule .rule-what { margin: var(--space-2xs) 0 var(--space-sm); font-size: var(--text-sm); line-height: 1.6; color: var(--ink); }
/* 枠は灰色ではなく、そのまとまりの色にする。
   薄い青地の上では灰色の枠が 2.98:1 しか出ず、3:1 に届かなかった。 */
fieldset.rule-duty { border-color: var(--accent); background: var(--accent-soft); }
fieldset.rule-duty > legend { border-color: var(--accent); color: var(--accent-dark); }
fieldset.rule-care { border-color: var(--care); background: var(--care-soft); }
fieldset.rule-care > legend { border-color: var(--care); color: var(--care); }
/* 色が付いた地の上でも、入力欄は白のままにして境目を残す */
fieldset.rule input[type="number"], fieldset.rule input[type="text"] { background: var(--paper-2); }

/* 数字だけの1行。以前は大きな箱を並べていて、場所のわりに情報が少なかった。 */
.statline { font-size: var(--text-base); line-height: 1.9; }
.statline b { font-size: var(--text-md); margin: 0 var(--space-3xs) 0 var(--space-2xs); }
.statline b:first-child { margin-left: 0; }
.statline .ng { color: var(--danger); }
.statline .sep { color: var(--muted); margin: 0 var(--space-xs); }

/* 一覧の要約（サブは誰か、など）。畳んだ中身の代わりに見せる。 */
.summary-line { font-size: var(--text-base); line-height: 1.8; }
.summary-line .none { color: var(--danger); font-weight: 700; }

/* ===== 段（Narrative Workflow） =====
   希望を出す画面は「1 だれの 2 押す 3 出す」という順番が本当にある。
   段の番号を見出しの頭に大きく置き、カードの上を太い罫線で切って前の段と分ける。 */
.card.stage-card { border-top: 4px solid var(--accent); border-top-left-radius: var(--radius-card); border-top-right-radius: var(--radius-card); }
.card.stage-card.care { border-top-color: var(--care); }
.stage { display: flex; align-items: baseline; gap: var(--space-sm); margin: 0 0 var(--space-sm); }
.stage .n {
  flex: 0 0 auto; font-family: var(--font-num); font-variant-numeric: tabular-nums;
  font-size: var(--text-lg); font-weight: 500; line-height: 1; color: var(--accent);
}
.card.stage-card.care .stage .n { color: var(--care); }
.stage .h { font-size: var(--text-md); font-weight: 700; line-height: 1.35; letter-spacing: -0.015em; overflow-wrap: anywhere; min-width: 0; }

/* 進み方の帯（Narrative Workflow・Workbench） */
.steps { display: flex; flex-wrap: wrap; gap: var(--space-xs); margin: 0 0 var(--space-md); font-size: var(--text-sm); list-style: none; padding: 0; }
.steps .s {
  border: 1px solid var(--rule-strong); border-radius: var(--radius-pill);
  padding: var(--space-2xs) 14px; background: var(--paper-2); color: var(--muted);
  display: inline-flex; align-items: center; gap: var(--space-2xs); white-space: nowrap;
}
.steps .s .no { font-weight: 500; margin-right: var(--space-3xs); }
.steps .s.on { background: var(--care); border-color: var(--care); color: #fff; font-weight: 700; }
.steps .s.done { border-color: var(--care); color: var(--care); }
/* 当番の段は青、手入れの段は緑。どちらの話かが段だけで分かる */
.steps.duty .s.on { background: var(--accent); border-color: var(--accent); }
.steps.duty .s.done { border-color: var(--accent); color: var(--accent-dark); }

.pill-list { display: flex; flex-wrap: wrap; gap: var(--space-xs); margin-top: var(--space-xs); }
.pill { border: 1px solid var(--rule-strong); border-radius: var(--radius-pill); padding: var(--space-2xs) var(--space-sm); font-size: var(--text-sm); background: var(--paper-2); }
.pill.no { background: var(--danger-soft); border-color: var(--danger); color: var(--danger); }
.pill.yes { background: var(--care-soft); border-color: var(--care); color: var(--care); }

.summary-grid { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; }
.summary-grid .stat { border: 1px solid var(--rule); border-radius: var(--radius-input); padding: 10px 14px; background: var(--paper-2); min-width: 116px; }
.summary-grid .stat b { display: block; font-size: var(--text-lg); line-height: 1.3; }
.summary-grid .stat span { font-size: var(--text-sm); color: var(--muted); }

.warn-list { max-height: 280px; overflow-y: auto; margin-top: 10px; }
.warn-list div { font-size: var(--text-base); padding: var(--space-2xs) 0; border-bottom: 1px solid var(--rule); line-height: 1.7; }
.warn-list div:last-child { border-bottom: none; }
.warn-list .e { color: var(--danger); }
.warn-list .w { color: var(--warning); }

/* 画面に出さないが、読み上げには渡したい文言 */
.visually-hidden {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}

/* 通信中の表示。Apps Scriptは1往復に数秒かかるので、待ちを必ず見せる */
#busy {
  position: fixed; top: 0; left: 0; right: 0; z-index: var(--z-toast);
  background: var(--warning); color: #fff; text-align: center;
  padding: 10px; font-size: var(--text-base); font-weight: 700; display: none;
}
#busy.on { display: block; }

.saving-bar {
  position: sticky; bottom: 0; background: var(--paper-2); border-top: 3px solid var(--accent);
  padding: var(--space-sm); display: none; align-items: center; gap: var(--space-sm);
  justify-content: space-between; margin: 0 calc(var(--space-lg) * -1) calc(var(--space-lg) * -1);
  flex-wrap: wrap; z-index: var(--z-sticky);
}
.saving-bar.on { display: flex; }

/* ===== 動き =====
   2つだけ。press（押している間 1px 沈む）と nudge（入口の行で印が少し寄る）。
   出てくる演出は置いていない。道具の画面で毎回待たされる動きは邪魔にしかならないため。
   press は button・.chip・.mk に、nudge は入口ページの中に書いてある。 */
a.hub-link {
  transition: background-color var(--dur-short) var(--ease-out), border-color var(--dur-short) var(--ease-out);
}
@media (pointer: coarse) { button, .chip, .mk { min-height: 48px; } }

/* 動きを減らす設定の人には、動きを出さない。フォーカスリングは元から動かしていない */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 1ms !important; animation-iteration-count: 1 !important;
    transition-duration: 1ms !important; scroll-behavior: auto !important;
  }
}

/* マイページから来たときの「◯◯ さんとして出します」。
   入口で名前を選んでいるので、ここで選び直させない（2026-09-13）。
   ちがう人のときは入口で選び直す（画面ごとに聞き直さない）。 */
.wholine { font-size: var(--text-base); margin: var(--space-xs) 0 0; line-height: 1.7; }
.wholine b { font-size: var(--text-md); }
.wholine .hint { display: block; margin-top: var(--space-3xs); }
</style>
<style>
/* 「マイページに戻る」は**いつでも左上**に出す（2026-09-13にユーザーが決めた）。
   見出し帯ごと貼り付けておけば、下まで読んでいる途中でも戻れる。 */
header.appbar { position: sticky; top: 0; z-index: var(--z-sticky); }
header.appbar > span { margin-right: auto; }   /* 題が伸びて、ほかのリンクは右に寄る */
header.appbar a.backhome {
  border: 1px solid rgba(255, 255, 255, 0.75); border-radius: var(--radius-pill);
  padding: 4px 14px; text-decoration: none; font-weight: 700;
}
header.appbar a.backhome:hover { background: rgba(255, 255, 255, 0.15); }

/* 出し終わったときに、知らせの下に出すボタン（2026-09-13にユーザーが決めた）。
   出したあとは次の画面へ移ることが多いので、帯まで戻らなくても押せるところに置く。 */
a.donehome {
  display: inline-flex; align-items: center; justify-content: center;
  min-height: var(--tap); margin-top: var(--space-sm); padding: var(--space-xs) var(--space-lg);
  background: var(--accent); color: #fff; font-size: var(--text-base); font-weight: 700;
  border-radius: var(--radius-input); text-decoration: none;
}
a.donehome:hover { background: var(--accent-dark); }
</style>
</head>
<body>
<div id="busy">通信中です…</div>
<header class="appbar">
  <a class="backhome" href="index.html">← マイページ</a><span>手入れの希望を出す</span></header>

<main>
  <div id="loading" class="card muted">読み込んでいます…</div>

  <!-- 進み方。手入れの段は2つ（Narrative Workflow） -->
  <ol class="steps" id="stepStrip" style="display:none;" aria-label="進み方">
    <li class="s" data-step="1"><span class="no">1</span>名前</li>
    <li class="s" data-step="2"><span class="no">2</span>馬ごとに ◎○× を出す</li>
  </ol>

  <section class="card stage-card care" id="pickCard" style="display:none;">
    <p class="stage"><span class="n">1</span><span class="h">だれの希望か</span></p>
    <label for="memberSelect">あなたの名前</label>
    <select id="memberSelect"></select>
    <p class="hint">あなたが<b>サブに入っている馬</b>の分だけ出てきます。出てこない馬があれば、その馬のチーフに連絡してください。</p>
  </section>

  <section id="planStage" style="display:none;">
    <p class="stage"><span class="n">2</span><span class="h">馬ごとに ◎○× を出す</span></p>
    <p class="hint" style="margin-bottom:var(--space-sm);">
      <b>◎ 入りたい</b>　<b>○ 入れる</b>　<b>× 入れない</b>。×の日には入りません。馬ごとに出したら、その馬の「出す」を押してください。
    </p>
    <div id="plans"></div>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* 選んだ人は「名前」で覚える。
   当番・手入れと大会人員表では部員IDの体系が違い（m_xxxxxxxxxx と m_001）、
   両方にいる人でも一致しない。画面が全部おなじドメインに並んでいるので、
   IDのまま覚えると画面を移るたびに当てが外れて選び直しになる。
   名簿は「名簿をそろえる」で同期していて、名前は揃っている。 */
function 名前を覚える(members, memberId) {
  const m = (members || []).filter((x) => x.id === memberId)[0];
  if (!m) return;
  try { localStorage.setItem('me', m.name); } catch (e) { /* 保存できない設定でも画面は動かす */ }
}
function 覚えた人のID(members) {
  let 名 = '';
  try { 名 = localStorage.getItem('me') || ''; } catch (e) {}
  const m = (members || []).filter((x) => x.name === 名)[0];
  if (m) return m.id;
  // 名前で覚える前に使っていた人のぶん（同じシステムの中でだけ当たる）
  let 旧 = '';
  try { 旧 = localStorage.getItem('memberId') || ''; } catch (e) {}
  return (members || []).some((x) => x.id === 旧) ? 旧 : '';
}

const 記号 = ['◎', '○', '×'];
const 記号クラス = { '◎': 'm2', '○': 'm1', '×': 'm0' };
const 記号の説明 = { '◎': '入りたい', '○': '入れる', '×': '入れない' };

let DATA = { members: [], plans: [] };
let MARKS = {};   // 計画ID → キー → 記号
let busyCount = 0;

function busy(on) {
  busyCount += on ? 1 : -1;
  $('busy').className = busyCount > 0 ? 'on' : '';
}

const API = 'https://script.google.com/macros/s/AKfycbxRymAf5iGuZfmZE-CK2fwicbnj1tE6UZKywZ3cNDTkqxZp0aBAKIb67jYWfOzYorK2Yw/exec';

/**
 * サーバ（Apps Script）を呼ぶ。
 *
 * この画面は script.google.com の外に置いてあるので、GASの画面用の呼び出し口は使えない。
 * かわりに fetch で叩く。**別オリジンなのでCookieが飛ばない**ぶん、
 * 複数のGoogleアカウントに同時ログインしていても「ファイルを開くことができません」にならない。
 * 画面を外に出したのはそのため。
 *
 * Content-Type を text/plain にしているのは、application/json にすると
 * ブラウザが事前確認（preflight の OPTIONS）を投げ、Apps Script がそれを受けられないため。
 *
 * 通信のせいで失敗したとき（つながらない・HTMLのエラーページが返った）は、エラーに 通信: true を付ける。
 * サーバが断ったとき（入力の誤りなど）と分けて、送り直してよいかを画面が判断できるようにするため。
 *
 * **送信（submitResponse）だけは keepalive で送る。** 押してすぐ画面を閉じたり
 * マイページへ戻ったりしても、ブラウザが最後まで届けてくれる。keepalive で失敗したときは
 * 普通の送り方でもう一度だけ試す（出欠の送信は同じ中身で何度送っても結果が変わらない）。
 */
const 閉じても届ける = ['submitResponse'];

function call(fn) {
  const args = Array.prototype.slice.call(arguments, 1);
  busy(true);
  const 本文 = JSON.stringify({ fn: fn, args: args });
  const 送る = (keepalive) => fetch(API, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=UTF-8' },
    body: 本文,
    keepalive: keepalive,
  });
  const 届ける = 閉じても届ける.indexOf(fn) >= 0 && 本文.length < 60000;
  return (届ける ? 送る(true).catch(() => 送る(false)) : 送る(false)).then((res) => {
    if (!res.ok) throw new Error('つながりませんでした（' + res.status + '）。少し待ってから開き直してください。');
    return res.json();
  }).catch((e) => {
    const err = /^つながりませんでした/.test((e && e.message) || '') ? e
      : new Error('つながりませんでした。電波の良いところで、少し待ってから開き直してください。');
    err.通信 = true;
    throw err;
  }).then((r) => {
    if (!r.ok) throw new Error(r.error || '不明なエラーが起きました。');
    return r.value;
  }).finally(() => { busy(false); });
}

// いまどの段にいるかを帯に塗る
function 段を塗る(名前あり) {
  Array.prototype.forEach.call(document.querySelectorAll("#stepStrip .s"), (el) => {
    const n = Number(el.dataset.step);
    const 段 = 名前あり ? 2 : 1;
    el.className = "s" + (n === 段 ? " on" : (n < 段 ? " done" : ""));
    if (n === 段) el.setAttribute("aria-current", "step"); else el.removeAttribute("aria-current");
  });
  document.getElementById("planStage").style.display = 名前あり ? "block" : "none";
}
/* マイページからは「どれの話か」を付けて飛んでくる（?term= ?event= ?plan=）。
   GASの画面は枠の中で動くので location.search は拾えない。そのときは今までどおり選ぶ。 */
function URLの(名) {
  try { return new URLSearchParams(location.search).get(名) || ''; } catch (e) { return ''; }
}

/**
 * 入口（マイページ）で名前を選んでからここへ来るので、**名前は聞き直さない**（2026-09-13）。
 * 選ぶところを隠して「◯◯ さんとして出します」に置き換える。
 * 別の人のぶんを出すときは入口で名前を選び直す（2026-09-13にユーザーが決めた。
 * ここに「ちがう人」を置くと、押す前に確かめる手間が画面ごとに戻ってしまう）。
 */
function 名前は聞かない(名) {
  const sel = $('memberSelect');
  if (!sel || !名) return;
  const lab = document.querySelector('label[for="memberSelect"]');
  const 行 = document.createElement('p');
  行.className = 'wholine';
  行.innerHTML = '<b>' + esc(名) + '</b> さんとして出します' +
    '<span class="hint">ちがう人のときは、左上の「← マイページ」で名前を選び直してください。</span>';
  sel.parentNode.insertBefore(行, lab || sel);
  sel.style.display = 'none';
  if (lab) lab.style.display = 'none';
}

const show = (planId, cls, text) => {
  const el = document.querySelector('[data-msg="' + planId + '"]');
  if (el) el.innerHTML = '<div class="msg ' + cls + '">' + esc(text) + '</div>';
};

// ===== 曜日方式：7行に◎○×を並べる =====
function 曜日の表(plan) {
  const m = MARKS[plan.id] || {};
  return '<div>' + plan.keys.map((k) => {
    const cls = k.key === '土' ? ' sat' : (k.key === '日' ? ' sun' : '');
    return '<div class="mark-row" role="group" aria-label="' + esc(k.label) + 'の希望">' +
      '<span class="k' + cls + '">' + esc(k.label) + '</span>' +
      '<span class="marks">' + 記号.map((s) =>
        '<button type="button" class="mk ' + 記号クラス[s] + (m[k.key] === s ? ' on' : '') + '"' +
        ' data-plan="' + esc(plan.id) + '" data-key="' + esc(k.key) + '" data-mark="' + esc(s) + '"' +
        ' aria-pressed="' + (m[k.key] === s ? 'true' : 'false') + '"' +
        ' aria-label="' + esc(k.label) + 'は' + 記号の説明[s] + '（' + s + '）"' +
        '>' + s + '</button>').join('') + '</span>' +
      '</div>';
  }).join('') + '</div>';
}

// ===== カレンダー方式：月曜始まりのカレンダー。押すと ◎→○→×→◎ と変わる =====
function カレンダーの表(plan) {
  const m = MARKS[plan.id] || {};
  const ある = {};
  plan.keys.forEach((k) => { ある[k.key] = k; });

  // 月ごとに分ける
  const 月順 = [];
  const 月ごと = {};
  plan.keys.forEach((k) => {
    const ym = k.key.slice(0, 7);
    if (!月ごと[ym]) { 月ごと[ym] = []; 月順.push(ym); }
    月ごと[ym].push(k);
  });

  const 頭 = ['月', '火', '水', '木', '金', '土', '日'];
  return 月順.map((ym) => {
    const y = Number(ym.slice(0, 4));
    const mo = Number(ym.slice(5, 7));
    const 末日 = new Date(y, mo, 0).getDate();
    // その月の1日が何曜か（月曜=0）
    const 先頭 = (new Date(y, mo - 1, 1).getDay() + 6) % 7;

    const マス = [];
    for (let i = 0; i < 先頭; i++) マス.push('<td class="off"></td>');
    for (let d = 1; d <= 末日; d++) {
      const key = y + '-' + ('0' + mo).slice(-2) + '-' + ('0' + d).slice(-2);
      if (!ある[key]) {
        マス.push('<td class="off"><span class="calday"><span class="d">' + d + '</span></span></td>');
      } else {
        const v = m[key] || '';
        const 曜 = ある[key].label.replace(/^.*（|）$/g, '');
        マス.push('<td><button type="button" class="calday ' + (記号クラス[v] || '') + '"' +
          ' data-plan="' + esc(plan.id) + '" data-key="' + esc(key) + '" data-cycle="1"' +
          ' aria-label="' + mo + '月' + d + '日（' + esc(曜) + '）　いまは' +
          (v ? esc(記号の説明[v]) + '（' + v + '）' : '未入力') + '。押すと次の希望に変わります"' +
          '>' +
          '<span class="d">' + d + '</span>' +
          '<span class="m">' + (v || '・') + '</span></button></td>');
      }
    }
    while (マス.length % 7) マス.push('<td class="off"></td>');

    let rows = '';
    for (let i = 0; i < マス.length; i += 7) rows += '<tr>' + マス.slice(i, i + 7).join('') + '</tr>';

    return '<div class="cal"><h4>' + y + '年' + mo + '月</h4>' +
      '<table class="cal-grid"><thead><tr>' +
      頭.map((w) => '<th' + (w === '土' ? ' class="sat"' : (w === '日' ? ' class="sun"' : '')) + '>' + w + '</th>').join('') +
      '</tr></thead><tbody>' + rows + '</tbody></table></div>';
  }).join('');
}

function 残りの数(plan) {
  const m = MARKS[plan.id] || {};
  return plan.keys.filter((k) => !m[k.key]).length;
}

function renderPlan(plan) {
  const 期間 = plan.mode === 'カレンダー'
    ? plan.from + ' 〜 ' + plan.to + '（' + plan.keys.length + '日）'
    : '曜日ごと';
  const 残り = 残りの数(plan);

  return '<div class="card" data-card="' + esc(plan.id) + '">' +
    '<h2>' + esc(plan.horse) + '　<span class="muted">' + esc(plan.term) + '</span></h2>' +
    '<div class="muted">' + esc(期間) + (plan.chief ? '　チーフ：' + esc(plan.chief) : '') + '</div>' +
    (plan.broken
      ? '<div class="msg error">この期間の設定がおかしくなっています。チーフに連絡してください。</div>'
      : (
        '<p class="hint">◎＝入りたい　○＝入れる　×＝入れない。<b>全部の日</b>に入れてください。' +
        (plan.mode === 'カレンダー' ? '日付を押すと ◎→○→× と変わります。' : '') + '</p>' +
        '<div class="row tight" style="margin:8px 0;">' +
        記号.map((s) => '<button type="button" class="small secondary" data-all="' + esc(plan.id) + '" data-mark="' + esc(s) + '">全部' + s + '</button>').join('') +
        '<button type="button" class="small secondary" data-rest="' + esc(plan.id) + '">未入力を○に</button>' +
        '</div>' +
        (plan.mode === 'カレンダー' ? カレンダーの表(plan) : 曜日の表(plan)) +
        '<div class="msg ' + (残り ? 'warning' : 'success') + '" data-left="' + esc(plan.id) + '" role="status" aria-live="polite">' +
        (残り ? 'あと' + 残り + '日ぶん入れてください。全部そろうと送信できます。' : '全部そろいました。送信できます。') + '</div>' +
        // 送信ボタンは押せるままにしておく。足りないときは押した時点で何日ぶん足りないかを出す。
        '<button type="button" data-send="' + esc(plan.id) + '">' + esc(plan.horse) + 'の希望を送信する</button>' +
        '<div data-msg="' + esc(plan.id) + '" role="status" aria-live="polite"></div>'
      )) +
    '</div>';
}

// マイページの「まだ出していないもの」から来たときは、その馬のところまで動かす
function その馬まで動かす() {
  const 指定 = URLの('plan');
  if (!指定) return;
  const card = document.querySelector('[data-card="' + 指定 + '"]');
  if (card && card.scrollIntoView) card.scrollIntoView({ block: 'start' });
}

function renderPlans() {
  if (!DATA.plans.length) {
    $('plans').innerHTML = '<div class="card muted">サブに入っている馬がありません。チーフが決めるまで待ってください。</div>';
    return;
  }
  $('plans').innerHTML = DATA.plans.map(renderPlan).join('');
}

// 1枚だけ描き直す（ほかの馬の入力を消さないため）
function refreshPlan(planId) {
  const plan = DATA.plans.filter((p) => p.id === planId)[0];
  if (!plan) return;
  const card = document.querySelector('[data-card="' + planId + '"]');
  const msg = card ? card.querySelector('[data-msg="' + planId + '"]') : null;
  const 残す = msg ? msg.innerHTML : '';
  if (card) card.outerHTML = renderPlan(plan);
  const 新 = document.querySelector('[data-msg="' + planId + '"]');
  if (新 && 残す) 新.innerHTML = 残す;
}

$('plans').addEventListener('click', async (e) => {
  const t = e.target.closest ? e.target : null;
  if (!t) return;

  // 曜日方式の◎○×
  const mk = e.target.closest('[data-mark][data-key]');
  if (mk) {
    const p = mk.dataset.plan;
    (MARKS[p] = MARKS[p] || {})[mk.dataset.key] = mk.dataset.mark;
    return refreshPlan(p);
  }

  // カレンダーの日付（押すたびに ◎→○→× と回る）
  const cal = e.target.closest('[data-cycle]');
  if (cal) {
    const p = cal.dataset.plan;
    const k = cal.dataset.key;
    const 今 = (MARKS[p] || {})[k] || '';
    const i = 記号.indexOf(今);
    (MARKS[p] = MARKS[p] || {})[k] = 記号[(i + 1) % 記号.length];
    return refreshPlan(p);
  }

  // まとめて入れる
  const all = e.target.closest('[data-all]');
  if (all) {
    const p = all.dataset.all;
    const plan = DATA.plans.filter((x) => x.id === p)[0];
    MARKS[p] = {};
    plan.keys.forEach((k) => { MARKS[p][k.key] = all.dataset.mark; });
    return refreshPlan(p);
  }
  const rest = e.target.closest('[data-rest]');
  if (rest) {
    const p = rest.dataset.rest;
    const plan = DATA.plans.filter((x) => x.id === p)[0];
    MARKS[p] = MARKS[p] || {};
    plan.keys.forEach((k) => { if (!MARKS[p][k.key]) MARKS[p][k.key] = '○'; });
    return refreshPlan(p);
  }

  // 送信
  const send = e.target.closest('[data-send]');
  if (send) {
    const p = send.dataset.send;
    const memberId = $('memberSelect').value;
    if (!memberId) return void show(p, 'error', '先にあなたの名前を選んでください。');

    const plan = DATA.plans.filter((x) => x.id === p)[0];
    const 未入力 = plan.keys.filter((k) => !(MARKS[p] || {})[k.key]);
    if (未入力.length) {
      return show(p, 'error', 'まだ送信できません。あと' + 未入力.length + '日ぶん、◎○×のどれかを入れてください（' +
        未入力.slice(0, 8).map((k) => k.label).join('、') + (未入力.length > 8 ? ' ほか' : '') + '）。' +
        '全部おなじでよければ「全部◎」や「未入力を○に」が使えます。');
    }

    send.disabled = true;
    try {
      const r = await call('submitCareVote', p, memberId, MARKS[p] || {});
      show(p, 'success', '送信しました（' + r.count + '日ぶん）。ありがとうございます。');
    } catch (err) {
      show(p, 'error', '送信に失敗しました：' + ((err && err.message) || err));
    } finally {
      send.disabled = false;
    }
  }
});

async function onMemberChange() {
  const memberId = $('memberSelect').value;
  段を塗る(!!memberId);
  if (!memberId) { $('plans').innerHTML = ''; return; }
  名前を覚える(DATA.members, memberId);
  $('plans').innerHTML = '<div class="card muted">読み込んでいます…</div>';
  try {
    const r = await call('getCareMemberData', memberId);
    DATA.plans = r.plans || [];
    MARKS = {};
    DATA.plans.forEach((p) => { MARKS[p.id] = Object.assign({}, p.votes || {}); });
    renderPlans();
  } catch (e) {
    $('plans').innerHTML = '<div class="card"><div class="msg error">' + esc((e && e.message) || e) + '</div></div>';
  }
}

(async () => {
  try {
    const r = await call('getCareMemberData', null);
    DATA.members = r.members || [];
    $('loading').style.display = 'none';
    $('pickCard').style.display = 'block';
    $('stepStrip').style.display = 'flex';
    段を塗る(false);
    $('memberSelect').innerHTML = '<option value="">選択してください</option>' +
      DATA.members.map((m) => '<option value="' + m.id + '">' + esc(m.name) + (m.grade ? '（' + m.grade + '年）' : '') + '</option>').join('');
    $('memberSelect').addEventListener('change', onMemberChange);

    const saved = 覚えた人のID(DATA.members);
    if (saved) {
      $('memberSelect').value = saved;
      名前は聞かない((DATA.members.filter((m) => m.id === saved)[0] || {}).name);
      await onMemberChange();
      その馬まで動かす();
    }
  } catch (e) {
    $('loading').innerHTML = '<div class="msg error">読み込みに失敗しました：' + esc((e && e.message) || e) + '</div>';
  }
})();
</script>
<script>
/*
  入口（マイページ）へ戻る道を2つ用意する。どちらも静的サイトだけのもの。
    1. 見出し帯の「← マイページ」…… いつでも左上に見えている
    2. 出し終わったときのボタン …… 送信できた知らせの下に足す

  2は、知らせを出すところが画面ごとにバラバラ（show() だったり innerHTML だったり）なので、
  **出てきた「成功の知らせ」を見つけて足す**形にしてある。そのぶん画面側は触らずに済む。
*/
(function () {
  let 戻り先 = 'index.html';
  try {
    const 立場 = localStorage.getItem('role');
    if (立場 && 立場 !== 'links') 戻り先 = 'index.html?role=' + encodeURIComponent(立場);
  } catch (e) { /* 保存できない設定でも、部員用の入口には戻れる */ }
  document.querySelectorAll('a.backhome').forEach((a) => { a.href = 戻り先; });

  // 「前回の回答を読み込みました」のような成功の知らせもあるので、**出し終わった知らせだけ**に付ける
  const 出し終わった = /(送信しました|出しました|申し込みました|受け付けました|登録しました|保存しました)/;

  const 足す = (el) => {
    if (!el || el.dataset.home === '1' || !出し終わった.test(el.textContent || '')) return;
    el.dataset.home = '1';
    // マイページが、サーバの返事を待たずに「まだ出していないもの」から消せるようにしておく
    try {
      localStorage.setItem('mypage:出したところ', JSON.stringify({
        url: location.pathname.split('/').pop(), 時刻: Date.now(),
      }));
    } catch (e) { /* 保存できない設定なら、次に読んだときに正しくなる */ }
    const a = document.createElement('a');
    a.className = 'donehome';
    a.href = 戻り先;
    a.textContent = 'マイページに戻る';
    el.insertAdjacentElement('afterend', a);
  };
  const 見る = (根) => {
    if (!根 || 根.querySelectorAll === undefined) return;
    if (根.classList && 根.classList.contains('msg') && 根.classList.contains('success')) 足す(根);
    根.querySelectorAll('.msg.success').forEach(足す);
  };
  new MutationObserver((記録) => {
    記録.forEach((m) => m.addedNodes.forEach(見る));
  }).observe(document.body, { childList: true, subtree: true });
  見る(document.body);
})();
</script>
