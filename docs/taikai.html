<!DOCTYPE html>
<html lang="ja">
<head>
<base target="_top">
<meta name="robots" content="noindex, nofollow">
<!--
  人員表の見た目（2026-09-15 に作り直した）。

  土台は当番・手入れの style.html と同じ（色・文字・余白・形・フォーカスリング）。
  決まりは 当番・手入れシステム_GAS/design.md。その上に立つのは デジタル庁デザインシステム（DADS）だけ。
    ・本文16px以上（人員表のマスだけは表計算と同じ密度にするため例外）
    ・文字と背景は4.5:1以上、押せるものの枠は3:1以上
    ・フォーカスは「黄色＋黒」の二重リング。どの部品でも消さない
    ・押せるものの当たり判定は44px以上（マウスで使う人員表のマスの中だけは例外）
    ・色だけで意味を伝えない

  2026-09-15、「WebアプリのUIデザインを洗練させるための7つのヒント」（NRIネットコム）に沿って足したもの。
  ユーザーが特に3と7を挙げた。
    3. ボタンを多用しない … 行ごとの「編集・削除」はアイコンボタンにして、マウスを乗せたときだけ出す。
       使う回数が少ない操作は「⋯」のメニューへ。人員表のマスは右クリックのメニューで触れる。
       ただしキーボードで来たとき（:focus-within）と、マウスの無い端末では常に出す（DADS：隠れて押せない状態を作らない）
    7. インタラクション … 押すと沈む、選んだものに✓、保存したところが一瞬光る、メニューと保存の帯がふわっと出る。
       動かすのは transform と opacity だけ。動きを減らす設定では止める。
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&family=Geist+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root {
  /* ===== 色（当番・手入れと同じ。色相は 262 に寄せる） ===== */
  --paper:        oklch(97.2% 0.006 262);
  --paper-2:      oklch(99.2% 0.003 262);
  --paper-3:      oklch(94.5% 0.010 262);
  --paper-sunken: oklch(92.5% 0.008 262);

  --ink:          oklch(21%   0.014 262);
  --muted:        oklch(46%   0.022 262);

  --rule:         oklch(88%   0.012 262);
  --rule-strong:  oklch(62%   0.030 262);

  --accent:       oklch(48%   0.150 262);
  --accent-dark:  oklch(40%   0.150 262);
  --accent-soft:  oklch(95.5% 0.021 262);
  --care:         oklch(45%   0.095 165);
  --care-soft:    oklch(95.5% 0.026 165);

  --danger:       oklch(50%   0.190 27);
  --danger-dark:  oklch(42%   0.173 27);
  --danger-soft:  oklch(96%   0.019 27);
  --warning:      oklch(48%   0.105 70);
  --warning-soft: oklch(96%   0.030 80);
  --success:      var(--care);
  --success-soft: var(--care-soft);

  /* 出場する人の馬名。マニュアルと書き出しの Excel と同じ赤 */
  --rider:        #c00000;

  --focus-inner: oklch(87% 0.170 100);
  --focus-outer: #000000;

  /* ===== 余白 ===== */
  --space-3xs: 0.125rem;  --space-2xs: 0.25rem;  --space-xs: 0.5rem;
  --space-sm:  0.75rem;   --space-md:  1rem;     --space-lg: 1.5rem;
  --space-xl:  2.5rem;    --space-2xl: 4rem;

  /* ===== 文字 ===== */
  --text-xs:   0.875rem;
  --text-sm:   0.9375rem;
  --text-base: 1rem;
  --text-md:   1.25rem;
  --text-lg:   1.5625rem;

  --font-body: "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", sans-serif;
  --font-num:  "Geist Mono", ui-monospace, SFMono-Regular, Consolas, monospace;

  /* ===== 動き ===== */
  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
  --dur-micro: 120ms;  --dur-short: 220ms;  --dur-long: 420ms;

  /* ===== 形 ===== */
  --radius-card:  12px;
  --radius-input: 8px;
  --radius-pill:  999px;
  --shadow-card: 0 1px 2px oklch(21% 0.014 262 / 0.05);
  --shadow-lift: 0 8px 24px -10px oklch(48% 0.150 262 / 0.28);

  --z-base: 1; --z-raised: 10; --z-sticky: 200; --z-modal: 400; --z-toast: 500;
  --tap: 44px;

  /* 前の名前。画面の style="" から呼ばれているので残す */
  --bg: var(--paper);  --card: var(--paper-2);  --text: var(--ink);
  --primary: var(--accent);  --primary-dark: var(--accent-dark);
  --border: var(--rule);
}

* { box-sizing: border-box; }
html, body { overflow-x: clip; }

body {
  margin: 0;
  font-family: var(--font-body);
  background: var(--paper);
  color: var(--ink);
  font-size: var(--text-base);
  line-height: 1.7;
}

/* ===== フォーカス（DADS の黄＋黒。動かさない） ===== */
:focus-visible {
  outline: 3px solid var(--focus-inner);
  outline-offset: 0;
  box-shadow: 0 0 0 6px var(--focus-outer);
  border-radius: 2px;
  position: relative;
  z-index: var(--z-raised);
  transition: none;
}
:focus { outline: 3px solid var(--focus-inner); box-shadow: 0 0 0 6px var(--focus-outer); }
:focus:not(:focus-visible) { outline: none; box-shadow: none; }

header.appbar {
  background: var(--accent);
  color: #fff;
  padding: var(--space-md);
  font-size: var(--text-md);
  font-weight: 700;
  line-height: 1.35;
  letter-spacing: -0.01em;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: var(--space-sm);
}
header.appbar a {
  color: #fff; font-size: var(--text-sm); font-weight: 400; cursor: pointer;
  min-height: var(--tap); display: inline-flex; align-items: center;
  white-space: nowrap; text-decoration: underline; text-underline-offset: 3px;
}

main { max-width: 760px; margin: 0 auto; padding: var(--space-md); }
main.wide { max-width: 1400px; }

.card {
  background: var(--paper-2);
  border: 1px solid var(--rule);
  border-radius: var(--radius-card);
  padding: var(--space-lg);
  margin-bottom: var(--space-md);
  box-shadow: var(--shadow-card);
}

h1, h2, h3 { overflow-wrap: anywhere; min-width: 0; }
h1 { font-size: var(--text-lg); line-height: 1.3; letter-spacing: -0.02em; margin: 0 0 var(--space-sm); }
h2 { font-size: var(--text-md); line-height: 1.35; letter-spacing: -0.015em; margin: 0 0 var(--space-xs); }
h3 { font-size: 1.0625rem; line-height: 1.4; margin: 0 0 var(--space-xs); }

.num, .summary-grid .stat b {
  font-family: var(--font-num);
  font-variant-numeric: tabular-nums;
}

label { display: block; font-weight: 700; margin: var(--space-md) 0 var(--space-2xs); font-size: var(--text-base); }
label.inline {
  display: inline-flex; align-items: center; gap: var(--space-xs); font-weight: 400;
  margin: 0 var(--space-sm) 0 0; font-size: var(--text-base); min-height: 36px; cursor: pointer;
}

select, input[type=text], input[type=number], input[type=password], input[type=date], textarea {
  width: 100%; padding: 10px var(--space-sm);
  border: 1px solid var(--rule-strong); border-radius: var(--radius-input);
  font-size: var(--text-base); background: var(--paper-2); color: var(--ink);
  font-family: inherit; min-height: var(--tap);
  transition: border-color var(--dur-micro) var(--ease-out);
}
input[type=number] { font-family: var(--font-num); font-variant-numeric: tabular-nums; }
select:hover, input:hover, textarea:hover { border-color: var(--accent); }
textarea { min-height: 88px; resize: vertical; line-height: 1.7; }
input[type=checkbox] { width: 20px; height: 20px; margin: 0; accent-color: var(--accent); }

.row { display: flex; gap: var(--space-sm); flex-wrap: wrap; align-items: flex-end; }
.row > * { flex: 1; min-width: 140px; }
.row.tight > * { flex: 0 0 auto; min-width: 0; }

.checkbox-list, .radio-list { display: flex; flex-wrap: wrap; gap: var(--space-xs); margin-top: var(--space-xs); }

/* ===== 選ぶ札（行ける／行けない） =====
   選ぶと✓が付く（色だけで伝えない）。押している間は沈み、選んだ瞬間に少し膨らんで戻る。 */
.chip {
  border: 1px solid var(--rule-strong); border-radius: var(--radius-pill);
  padding: 10px var(--space-lg); font-size: var(--text-base); cursor: pointer; user-select: none;
  background: var(--paper-2); color: var(--ink); min-height: var(--tap); min-width: 0;
  display: inline-flex; align-items: center; gap: var(--space-2xs); font-weight: 400; white-space: nowrap;
  transition: transform var(--dur-micro) var(--ease-out), background-color var(--dur-micro) var(--ease-out);
}
.chip:hover { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-dark); }
.chip.selected, .chip.selected:hover { background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 700; }
.chip.selected::before { content: "✓"; font-weight: 700; }
.chip.selected.no-chip, .chip.selected.no-chip:hover { background: var(--danger); border-color: var(--danger); }
.chip.just { animation: pick var(--dur-short) var(--ease-out); }
.chip:active { transform: translateY(1px); }
@keyframes pick { from { transform: scale(0.94); } to { transform: none; } }

/* ===== ボタン ===== */
button {
  background: var(--accent); color: #fff; border: 1px solid var(--accent);
  border-radius: var(--radius-input);
  padding: var(--space-sm) var(--space-lg); font-size: var(--text-base); font-weight: 700;
  cursor: pointer; min-height: 48px; font-family: inherit; line-height: 1.4;
  white-space: nowrap;
  display: inline-flex; align-items: center; justify-content: center; gap: var(--space-xs);
  transition: background-color var(--dur-micro) var(--ease-out), transform var(--dur-micro) var(--ease-out);
}
button:hover { background: var(--accent-dark); border-color: var(--accent-dark); }
button:active { transform: translateY(1px); }
button.secondary { background: var(--paper-2); color: var(--accent); border-color: var(--accent); }
button.secondary:hover { background: var(--accent-soft); }
button.danger { background: var(--danger); border-color: var(--danger); }
button.danger:hover { background: var(--danger-dark); border-color: var(--danger-dark); }
button.small { padding: var(--space-2xs) 14px; font-size: var(--text-sm); min-height: 36px; }
button:disabled { opacity: .55; cursor: not-allowed; transform: none; }
button svg, summary svg { width: 20px; height: 20px; flex: 0 0 auto; }

/* ===== アイコンボタン（ヒント3） =====
   文字のボタンを並べる代わりに使う。アイコンだけなので、必ず aria-label と title を付ける
   （読み上げと、マウスを乗せたときの説明のため）。 */
.icon-btn {
  display: inline-flex; align-items: center; justify-content: center;
  width: 40px; height: 40px; min-width: 40px; min-height: 40px; padding: 0; margin: 0;
  background: transparent; color: var(--muted); border: 1px solid transparent;
  border-radius: var(--radius-input); cursor: pointer; font-weight: 400;
}
.icon-btn:hover { background: var(--accent-soft); color: var(--accent-dark); border-color: var(--accent); }
.icon-btn.danger { background: transparent; color: var(--danger); border-color: transparent; }
.icon-btn.danger:hover { background: var(--danger-soft); color: var(--danger-dark); border-color: var(--danger); }
.icon-btn.tiny { width: 28px; height: 28px; min-width: 28px; min-height: 28px; }
.icon-btn.tiny svg { width: 16px; height: 16px; }
/* 押してある状態（固定している、など）。色に加えて枠でも分かる */
.icon-btn[aria-pressed="true"] { background: var(--warning-soft); color: var(--warning); border-color: var(--warning); }
/* ⋯ のボタン。隣の主ボタンと高さをそろえ、押せるものとして枠を出す */
.icon-btn.menu-btn { width: 48px; height: 48px; min-width: 48px; min-height: 48px; color: var(--ink); border-color: var(--rule-strong); background: var(--paper-2); }
@media (pointer: coarse) {
  .icon-btn, .icon-btn.tiny { width: var(--tap); height: var(--tap); min-width: var(--tap); min-height: var(--tap); }
}

/* 行の操作。マウスを乗せた行・キーボードで入った行だけに出す。
   マウスの無い端末（スマホ）では乗せられないので、いつも出しておく。 */
.row-actions { display: inline-flex; align-items: center; gap: var(--space-3xs); flex: 0 0 auto; }
@media (hover: hover) and (pointer: fine) {
  .row-actions { opacity: 0; transition: opacity var(--dur-short) var(--ease-out); }
  .is-row:hover .row-actions, .is-row:focus-within .row-actions,
  .pill:hover .row-actions, .pill:focus-within .row-actions { opacity: 1; }
}

/* ===== メニュー（ヒント3：⋯ とマスの右クリック） =====
   ⋯ は <details> で作る。キーボードでも Enter で開け、何もしなくても読み上げに「開いている」が伝わる。 */
details.menu { position: relative; display: inline-block; }
details.menu > summary { list-style: none; }
details.menu > summary::-webkit-details-marker { display: none; }
details.menu[open] > summary { background: var(--accent-soft); color: var(--accent-dark); border-color: var(--accent); }
.menu-list {
  position: absolute; right: 0; top: calc(100% + var(--space-2xs)); z-index: var(--z-modal);
  min-width: 240px; padding: var(--space-2xs);
  background: var(--paper-2); border: 1px solid var(--rule-strong); border-radius: var(--radius-input);
  box-shadow: var(--shadow-lift);
  display: flex; flex-direction: column; gap: var(--space-3xs);
  transform-origin: top right;
  animation: menu-in var(--dur-short) var(--ease-out);
}
.menu-list.ctx { position: fixed; right: auto; top: auto; transform-origin: top left; }
.menu-list[hidden] { display: none; }
.menu-sep { height: 1px; background: var(--rule); margin: var(--space-2xs) 0; }
.menu-item {
  display: flex; align-items: center; justify-content: flex-start; gap: var(--space-sm);
  width: 100%; min-height: var(--tap); padding: var(--space-xs) var(--space-sm);
  background: transparent; color: var(--ink); border: 0; border-radius: 6px;
  font-weight: 400; font-size: var(--text-base); text-align: left;
}
.menu-item svg { color: var(--muted); }
.menu-item:hover, .menu-item:focus-visible { background: var(--accent-soft); color: var(--accent-dark); }
.menu-item:hover svg { color: var(--accent-dark); }
/* 危ない項目は赤い文字だけ。button.danger の赤い塗りが残ると、赤地に赤文字で読めなくなる */
.menu-item.danger { color: var(--danger); background: transparent; border-color: transparent; }
.menu-item.danger svg { color: var(--danger); }
.menu-item.danger:hover { background: var(--danger-soft); color: var(--danger-dark); }
.menu-item .kbd { margin-left: auto; padding-left: var(--space-md); font-family: var(--font-num); font-size: var(--text-xs); color: var(--muted); }
@keyframes menu-in { from { opacity: 0; transform: translateY(-4px) scale(0.98); } to { opacity: 1; transform: none; } }

/* ===== 知らせ ===== 出るときに少しだけ下りてくる（ヒント7） */
.msg {
  padding: var(--space-sm) 14px; border-radius: var(--radius-input);
  margin: var(--space-sm) 0; font-size: var(--text-base); line-height: 1.7;
  animation: msg-in var(--dur-short) var(--ease-out);
}
.msg.success { background: var(--care-soft); color: var(--care); border: 1px solid var(--care); border-left-width: 4px; }
.msg.error   { background: var(--danger-soft); color: var(--danger); border: 1px solid var(--danger); border-left-width: 4px; }
.msg.warning { background: var(--warning-soft); color: var(--warning); border: 1px solid var(--warning); border-left-width: 4px; }
@keyframes msg-in { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }

/* 保存したところが一瞬光る（ヒント7）。上に重ねた薄い緑の opacity だけを動かす */
.flash { position: relative; }
.flash::before {
  content: ""; position: absolute; inset: 0; pointer-events: none; border-radius: inherit;
  background: var(--care); opacity: 0; animation: flash 900ms var(--ease-out);
}
@keyframes flash { from { opacity: 0.28; } to { opacity: 0; } }

table { width: 100%; border-collapse: collapse; font-size: var(--text-base); }
th, td { border: 1px solid var(--rule); padding: 8px 10px; text-align: left; }
th { background: var(--paper-3); }

.muted { color: var(--muted); font-size: var(--text-sm); }
.hint { color: var(--muted); font-size: var(--text-sm); margin: var(--space-2xs) 0 0; line-height: 1.7; }

.list-item {
  display: flex; justify-content: space-between; align-items: center; gap: var(--space-sm);
  padding: var(--space-xs) 0; border-bottom: 1px solid var(--rule); flex-wrap: wrap;
}
.list-item:last-child { border-bottom: none; }
/* 操作できる行は、乗せると地の色が変わる（ヒント7：どの行を触るのかが分かる） */
.list-item.is-row {
  margin: 0 calc(var(--space-sm) * -1); padding-left: var(--space-sm); padding-right: var(--space-2xs);
  border-radius: var(--radius-input);
  transition: background-color var(--dur-micro) var(--ease-out);
}
.list-item.is-row:hover, .list-item.is-row:focus-within { background: var(--paper-3); }

/* ===== タブ ===== 選んでいるタブは塗り＋下の太線（色だけで伝えない） */
.tabs { display: flex; gap: var(--space-xs); margin-bottom: var(--space-md); flex-wrap: wrap; }
.tabs button { background: var(--paper-2); color: var(--ink); border: 1px solid var(--rule-strong); border-radius: var(--radius-pill); }
.tabs button:hover { background: var(--accent-soft); color: var(--accent-dark); border-color: var(--accent); }
.tabs button.active { background: var(--accent); color: #fff; border-color: var(--accent); box-shadow: inset 0 -3px 0 var(--accent-dark); }
section[id^="tab-"] { animation: msg-in var(--dur-short) var(--ease-out); }

/* 使う回数の少ない欄は、見出しだけ出して畳んでおく（ヒント3：最初に見えるボタンを減らす） */
details.fold { border: 1px solid var(--rule); border-radius: var(--radius-card); background: var(--paper-2); margin-bottom: var(--space-md); box-shadow: var(--shadow-card); }
details.fold > summary {
  cursor: pointer; padding: var(--space-sm) var(--space-lg); font-weight: 700; font-size: 1.0625rem;
  min-height: 52px; display: flex; align-items: center; gap: var(--space-xs); list-style: none;
  border-radius: var(--radius-card);
  transition: background-color var(--dur-micro) var(--ease-out);
}
details.fold > summary::-webkit-details-marker { display: none; }
details.fold > summary svg { color: var(--accent); transition: transform var(--dur-short) var(--ease-out); }
details.fold[open] > summary svg { transform: rotate(90deg); }
details.fold > summary:hover { background: var(--accent-soft); }
details.fold > summary .muted { font-weight: 400; margin-left: var(--space-2xs); }
details.fold[open] > summary { border-bottom: 1px solid var(--rule); border-radius: var(--radius-card) var(--radius-card) 0 0; }
.fold-body { padding: var(--space-xs) var(--space-lg) var(--space-lg); }

.post-tag { display: inline-block; border-radius: 6px; padding: 0 8px; font-size: var(--text-xs); font-weight: 700; background: var(--accent-soft); color: var(--accent-dark); line-height: 1.6; }
.post-運営 { background: #eff6ff; color: #1d4ed8; }
.post-箱番長 { background: #f0fdf4; color: #15803d; }
.post-馬匹 { background: #fef3c7; color: #92400e; }
.post-会計 { background: #fae8ff; color: #a21caf; }

.role-card { border: 1px solid var(--rule); border-radius: var(--radius-input); padding: var(--space-sm); margin-bottom: var(--space-xs); background: var(--paper-2); }

/* 大会設定の「1日ぶん」のまとまり */
.day-block { border-left: 6px solid var(--accent); background: var(--paper) !important; box-shadow: none; }
.day-heading { font-size: var(--text-md); color: var(--accent-dark); border-bottom: 1px solid var(--rule); padding-bottom: var(--space-xs); margin-bottom: var(--space-sm); }
/* 行の中の小さな「消す」（×） */
.comp-row, .job-row .row { align-items: center; }

.pick { display: flex; flex-direction: column; gap: var(--space-2xs); min-width: 0; }
.pick > select, .pick > input { width: 100%; }
.pick > input.pick-other { border-color: var(--accent); }

/* ===== 人員表のマトリクス =====
   ここだけは表計算ソフトと同じ密度（12px）。書き出す Excel と見比べながら直すため。 */
.matrix-wrap { overflow-x: auto; border: 1px solid var(--rule-strong); border-radius: var(--radius-input); background: var(--paper-2); max-height: 70vh; overflow-y: auto; }
table.matrix { border-collapse: separate; border-spacing: 0; font-size: 12px; line-height: 1.5; width: auto; min-width: 100%; }
table.matrix th, table.matrix td { border: 0; border-right: 1px solid var(--rule); border-bottom: 1px solid var(--rule); padding: 2px 4px; white-space: nowrap; }
table.matrix thead th { background: var(--paper-3); position: sticky; top: 0; z-index: 2; text-align: center; }
table.matrix thead tr.days th { background: var(--paper-sunken); top: 0; height: 27px; }
table.matrix thead tr.comps th { top: 27px; }
table.matrix th.rowhead, table.matrix td.rowhead {
  position: sticky; left: 0; z-index: 3; background: var(--paper-2); text-align: left;
  border-right: 2px solid var(--rule-strong); min-width: 110px;
}

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* 選んだ人は「名前」で覚える。
   当番・手入れと大会人員表では部員IDの体系が違い（m_xxxxxxxxxx と m_001）、
   両方にいる人でも一致しない。画面が全部おなじドメインに並んでいるので、
   IDのまま覚えると画面を移るたびに当てが外れて選び直しになる。
   名簿は「名簿をそろえる」で同期していて、名前は揃っている。 */
function 名前を覚える(members, memberId) {
  const m = (members || []).filter((x) => x.id === memberId)[0];
  if (!m) return;
  try { localStorage.setItem('me', m.name); } catch (e) { /* 保存できない設定でも画面は動かす */ }
}
function 覚えた名前() {
  try { return localStorage.getItem('me') || ''; } catch (e) { return ''; }
}
function 覚えた人のID(members) {
  const 名 = 覚えた名前();
  const m = (members || []).filter((x) => x.name === 名)[0];
  if (m) return m.id;
  // 名前で覚える前に使っていた人のぶん（同じシステムの中でだけ当たる）
  let 旧 = '';
  try { 旧 = localStorage.getItem('memberId') || ''; } catch (e) {}
  return (members || []).some((x) => x.id === 旧) ? 旧 : '';
}
/* マイページからは「どれの話か」を付けて飛んでくる（?term= ?event= ?plan=）。
   GASの画面は枠の中で動くので location.search は拾えない。そのときは今までどおり選ぶ。 */
function URLの(名) {
  try { return new URLSearchParams(location.search).get(名) || ''; } catch (e) { return ''; }
}

/**
 * 入口（マイページ）で名前を選んでからここへ来るので、**名前は聞き直さない**（2026-09-13）。
 * 選ぶところを隠して「◯◯ さんとして出します」に置き換える。
 * 別の人のぶんを出すときは入口で名前を選び直す（2026-09-13にユーザーが決めた。
 * ここに「ちがう人」を置くと、押す前に確かめる手間が画面ごとに戻ってしまう）。
 */
function 名前は聞かない(名) {
  const sel = $('memberSelect');
  if (!sel || !名) return;
  const lab = document.querySelector('label[for="memberSelect"]');
  const 行 = document.createElement('p');
  行.className = 'wholine';
  行.innerHTML = '<b>' + esc(名) + '</b> さんとして出します' +
    '<span class="hint">ちがう人のときは、左上の「← マイページ」で名前を選び直してください。</span>';
  sel.parentNode.insertBefore(行, lab || sel);
  sel.style.display = 'none';
  if (lab) lab.style.display = 'none';
}

const show = (cls, text) => { $('msg').innerHTML = '<div class="msg ' + cls + '">' + esc(text) + '</div>'; };

let DATA = { members: [], events: [] };
let DAYS = [];      // 選んでいる大会の日の一覧
let ANSWERS = {};   // 日付 → true（行ける）／false（行けない）
let RIDES = {};     // 競技ID → 乗る馬の名前の配列（同じ競技に2頭で出ることがある）
let HORSES = [];    // 部の馬
let busyCount = 0;

function busy(on) {
  busyCount += on ? 1 : -1;
  $('busy').className = busyCount > 0 ? 'on' : '';
}

const API = 'https://bajutsubu-api.hokudai-equestrian.workers.dev/jinin';

/**
 * サーバ（Apps Script）を呼ぶ。
 *
 * この画面は script.google.com の外に置いてあるので、GASの画面用の呼び出し口は使えない。
 * かわりに fetch で叩く。**別オリジンなのでCookieが飛ばない**ぶん、
 * 複数のGoogleアカウントに同時ログインしていても「ファイルを開くことができません」にならない。
 * 画面を外に出したのはそのため。
 *
 * Content-Type を text/plain にしているのは、application/json にすると
 * ブラウザが事前確認（preflight の OPTIONS）を投げ、Apps Script がそれを受けられないため。
 *
 * 通信のせいで失敗したとき（つながらない・HTMLのエラーページが返った）は、エラーに 通信: true を付ける。
 * サーバが断ったとき（入力の誤りなど）と分けて、送り直してよいかを画面が判断できるようにするため。
 *
 * **送信（submitResponse）だけは keepalive で送る。** 押してすぐ画面を閉じたり
 * マイページへ戻ったりしても、ブラウザが最後まで届けてくれる。keepalive で失敗したときは
 * 普通の送り方でもう一度だけ試す（出欠の送信は同じ中身で何度送っても結果が変わらない）。
 */
const 閉じても届ける = ['submitResponse'];

function call(fn) {
  const args = Array.prototype.slice.call(arguments, 1);
  busy(true);
  const 本文 = JSON.stringify({ fn: fn, args: args });
  const 送る = (keepalive) => fetch(API, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=UTF-8' },
    body: 本文,
    keepalive: keepalive,
  });
  const 届ける = 閉じても届ける.indexOf(fn) >= 0 && 本文.length < 60000;
  return (届ける ? 送る(true).catch(() => 送る(false)) : 送る(false)).then((res) => {
    if (!res.ok) throw new Error('つながりませんでした（' + res.status + '）。少し待ってから開き直してください。');
    return res.json();
  }).catch((e) => {
    const err = /^つながりませんでした/.test((e && e.message) || '') ? e
      : new Error('つながりませんでした。電波の良いところで、少し待ってから開き直してください。');
    err.通信 = true;
    throw err;
  }).then((r) => {
    if (!r.ok) throw new Error(r.error || '不明なエラーが起きました。');
    return r.value;
  }).finally(() => { busy(false); });
}

/* ===== 待たせない工夫（2026-09-13） =====
   Apps Script は1回の往復に2〜30秒かかる。そこで
     ・前回読んだ中身を覚えておき、**開いた瞬間にそれで組む**（届いたら差し替える）
     ・静的サイトでは Cloudflare の写しから、名簿・大会と自分の返事を**1回で**読む（写しから読む。build.js が差し込む）
     ・送信は**押した瞬間に受け付けて**、裏で送る。届くまで「送り待ち」に残し、
       届かなかったら次に開いたとき（この画面かマイページ）にもう一度送る
   覚えるもの：
     taikai:画面               前回の名簿・大会・馬
     taikai:返事:部員ID|大会ID  前回サーバから取れた自分の返事
     taikai:手元:部員ID|大会ID  自分が出したばかりの返事（写しに載るまでこちらを出す）
     taikai:送り待ち           まだ届いたと確かめていない送信
*/
const 覚え = {
  取る(k) { try { const s = localStorage.getItem(k); return s ? JSON.parse(s) : null; } catch (e) { return null; } },
  置く(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* いっぱいなら諦める */ } },
  消す(k) { try { localStorage.removeItem(k); } catch (e) {} },
};
const 組の鍵 = (memberId, eventId) => memberId + '|' + eventId;
// 版は「書き替えた時刻.乱数」。写しがいつの中身かを、この時刻で見分ける
const 版の時刻 = (v) => Number(String(v == null ? '' : v).split('.')[0]) || 0;

/**
 * 画面に出す自分の返事を選ぶ。
 *   サーバ … サーバの返事（無ければ null）
 *   版     … それが写しなら写しの版。Apps Script から直に取った最新なら null
 *   手元   … 自分が出したばかりの返事（{answers, comment, entries, 時刻}）
 *   待ち   … その返事がまだ届いたと確かめられていないか
 * 写しは1〜2分遅れるので、**出したあとに作られた写しが来るまでは手元を出す。**
 */
function どちらの返事(サーバ, 版, 手元, 待ち) {
  if (!手元) return { 返事: サーバ, 手元を使った: false, 手元は古い: false };
  const サーバが新しい = !待ち && (版 === null || 版の時刻(版) >= 手元.時刻);
  if (サーバが新しい) return { 返事: サーバ, 手元を使った: false, 手元は古い: true };
  return {
    返事: { answers: 手元.answers, comment: 手元.comment, entries: 手元.entries },
    手元を使った: true,
    手元は古い: false,
  };
}

let 触った = false;       // 返事を出したあとに、この人が画面を触ったか（触ったら上書きしない）
let 返事の表 = null;      // 写しから取れた自分の返事 {版, memberId, 表: {大会ID: 返事}}
let 返事を読む番 = 0;     // 読んでいるあいだに選び直されたら、古いほうの結果は捨てる
let 読み込み中 = true;    // 開いてすぐの読み込みが終わるまでは、手元のぶんを出すだけにする（写しで返事も一緒に来るので、別に聞きに行かない）

let 今押した = -1;        // いま押した日の番号。その日の札と出場欄だけを動かす（描き直すたびに全部が動かないように）

const 行けない日 = () => DAYS.filter((d) => ANSWERS[d.date] === false);
const 未入力の日 = () => DAYS.filter((d) => ANSWERS[d.date] === undefined);

function renderDays() {
  $('dayVotes').innerHTML = DAYS.map((d, i) => {
    const v = ANSWERS[d.date];
    const comps = d.competitions || [];
    const plan = comps.length ? esc(comps.map((c) => c.name).join('・')) : '';

    // 行ける日だけ、出る競技と馬を聞く。
    // 同じ競技に2頭で出ることがあるので、馬を選ぶと下に空の枠が増えていく。
    const 出場欄 = (v === true && comps.length)
      ? '<div class="ride-box' + (今押した === i ? ' just' : '') + '"><div class="muted" style="margin-bottom:6px;">この日に<b>選手として出る競技</b>があれば、乗る馬を選んでください。出ない競技はそのままで構いません。<br>同じ競技に2頭以上で出る場合は、馬を選ぶと下に欄が増えます。</div>' +
        comps.map((c) => {
          const 馬たち = (RIDES[c.id] || []).slice();
          馬たち.push(''); // いつでも1つ空きを出しておく
          return 馬たち.map((馬, i) =>
            '<div class="ride-row">' +
            '<span class="ride-name">' + (i === 0 ? esc(c.name) : '') + '</span>' +
            '<select data-ride="' + esc(c.id) + '" data-slot="' + i + '">' +
            '<option value="">' + (i === 0 ? '出ない' : '（追加しない）') + '</option>' +
            HORSES.map((h) => '<option value="' + esc(h) + '"' + (馬 === h ? ' selected' : '') + '>' + esc(h) + '</option>').join('') +
            (馬 && HORSES.indexOf(馬) < 0 ? '<option value="' + esc(馬) + '" selected>' + esc(馬) + '</option>' : '') +
            '</select></div>').join('');
        }).join('') + '</div>'
      : '';

    // 札は押せる部品なので button にする（キーボードでも選べる・読み上げに「押されている」が伝わる）。
    // 押したばかりの札にだけ just を付けて、少し膨らませる（2026-09-15、ヒント7）
    const 押した = 今押した === i;
    return '<div class="day-vote' + (v === false ? ' no' : (v === true ? ' yes' : '')) + '">' +
      '<div class="day-name">' + esc(d.label) + '</div>' +
      (plan ? '<div class="day-plan">' + plan + '</div>' : '') +
      '<div class="radio-list" role="group" aria-label="' + esc(d.label) + 'の出欠" style="margin-top:8px;">' +
      '<button type="button" class="chip' + (v === true ? ' selected' + (押した ? ' just' : '') : '') + '" aria-pressed="' + (v === true) + '" data-day="' + i + '" data-val="1">行ける</button>' +
      '<button type="button" class="chip' + (v === false ? ' selected no-chip' + (押した ? ' just' : '') : '') + '" aria-pressed="' + (v === false) + '" data-day="' + i + '" data-val="0">行けない</button>' +
      '</div>' + 出場欄 + '</div>';
  }).join('');
  今押した = -1;

  $('dayVotes').querySelectorAll('select[data-ride]').forEach((sel) => {
    sel.addEventListener('change', () => {
      触った = true;
      const cid = sel.dataset.ride;
      const i = Number(sel.dataset.slot);
      const 一覧 = (RIDES[cid] || []).slice();
      if (sel.value) 一覧[i] = sel.value;   // 空きの枠なら、そこに足される
      else 一覧.splice(i, 1);               // 「出ない」を選んだらその枠を消す
      // 同じ馬を二重に選んでいたら1つにする
      const 整理 = [];
      一覧.forEach((h) => { if (h && 整理.indexOf(h) < 0) 整理.push(h); });
      if (整理.length) RIDES[cid] = 整理;
      else delete RIDES[cid];
      renderDays(); // 枠の増減を出し直す
    });
  });

  updateCommentLabel();
}

$('dayVotes').addEventListener('click', (e) => {
  const chip = e.target.closest ? e.target.closest('[data-day]') : null;
  if (!chip) return;
  触った = true;
  const day = DAYS[Number(chip.dataset.day)];
  const 行ける = chip.dataset.val === '1';
  今押した = ANSWERS[day.date] === 行ける ? -1 : Number(chip.dataset.day);   // 同じ札を押し直したときは動かさない
  ANSWERS[day.date] = 行ける;
  // 行けなくした日の出場は取り下げる
  if (!行ける) (day.competitions || []).forEach((c) => { delete RIDES[c.id]; });
  renderDays();
});
$('comment').addEventListener('input', () => { 触った = true; });

// 行けない日があるときだけ連絡事項を必須にする
function updateCommentLabel() {
  const ng = 行けない日();
  if (ng.length) {
    $('commentLabel').innerHTML = '連絡事項 <span style="color:var(--danger);">※必須</span>';
    $('commentHint').innerHTML = '<b>' + esc(ng.map((d) => d.label).join('、')) + '</b> に行けないので、理由を書いてください。';
    $('comment').placeholder = '例：土曜は教習所の卒検があるため行けません';
  } else {
    $('commentLabel').textContent = '希望・連絡事項（任意）';
    $('commentHint').textContent = '仕事は基本的に役職にそって割り振られます。希望や都合があればここに書いてください。';
    $('comment').placeholder = '例：日曜の午後は用事があるので早めに帰りたいです';
  }
}

// 返事を画面に入れる（null なら空にする）
function 返事を入れる(mine) {
  ANSWERS = {};
  RIDES = {};
  $('comment').value = '';
  if (mine) {
    (mine.answers || []).forEach((a) => { ANSWERS[a.date || ''] = a.attending; });
    (mine.entries || []).forEach((x) => {
      if (!RIDES[x.competitionId]) RIDES[x.competitionId] = [];
      if (RIDES[x.competitionId].indexOf(x.horse) < 0) RIDES[x.competitionId].push(x.horse);
    });
    $('comment').value = mine.comment || '';
  }
  renderDays();
}

async function onSelectionChange() {
  const memberId = $('memberSelect').value;
  const eventId = $('eventSelect').value;
  const ev = DATA.events.filter((e) => e.id === eventId)[0];
  if (!memberId || !eventId || !ev) { $('formCard').style.display = 'none'; return; }
  名前を覚える(DATA.members, memberId);

  $('eventTitle').textContent = ev.name;
  DAYS = ev.days || [];
  $('eventPeriod').textContent = DAYS.length && DAYS[0].date
    ? DAYS[0].label + (DAYS.length > 1 ? ' 〜 ' + DAYS[DAYS.length - 1].label : '') + '（全' + DAYS.length + '日）'
    : '';

  $('msg').innerHTML = '';
  $('formCard').style.display = 'block';
  触った = false;
  await 自分の返事を出す(memberId, eventId);
}

/**
 * 自分の返事を出す。まず手元（出したばかり／前回取れたぶん）で出して、
 * サーバのぶんが取れたら、**まだ画面を触っていなければ**差し替える。
 */
async function 自分の返事を出す(memberId, eventId) {
  const 番 = ++返事を読む番;
  const 鍵 = 組の鍵(memberId, eventId);
  const 手元 = 覚え.取る('taikai:手元:' + 鍵);
  const 待ち = !!(覚え.取る('taikai:送り待ち') || {})[鍵];

  // 1. 待たずに出せるぶん
  const 表 = 返事の表 && 返事の表.memberId === memberId ? 返事の表 : null;
  const 先に = どちらの返事(表 ? (表.表[eventId] || null) : 覚え.取る('taikai:返事:' + 鍵), 表 ? 表.版 : '0', 手元, 待ち);
  返事を入れる(先に.返事);
  if (待ち) show('warning', '前に出したぶんを、まだ送っています。届くとここに出ます。');
  else if (先に.返事) show('success', '前回の回答を読み込みました。書き換えて送信すると更新されます。');
  if (表) { 返事を覚える(鍵, 表.表[eventId] || null, 先に); return; }
  if (読み込み中) return;

  // 2. 写しが無いときは Apps Script に聞く（こちらは常に最新）
  let サーバ;
  try {
    サーバ = await call('getMyResponse', eventId, memberId);
  } catch (e) {
    if (番 === 返事を読む番 && !先に.返事) show('error', (e && e.message) || e);
    return;
  }
  if (番 !== 返事を読む番) return;   // 読んでいるあいだに選び直された
  const 後で = どちらの返事(サーバ, null, 手元, 待ち);
  返事を覚える(鍵, サーバ, 後で);
  if (触った || JSON.stringify(後で.返事) === JSON.stringify(先に.返事)) return;
  返事を入れる(後で.返事);
  if (後で.返事) show('success', '前回の回答を読み込みました。書き換えて送信すると更新されます。');
  else $('msg').innerHTML = '';
}

function 返事を覚える(鍵, サーバ, 選んだ) {
  覚え.置く('taikai:返事:' + 鍵, サーバ);
  if (選んだ.手元は古い) 覚え.消す('taikai:手元:' + 鍵);   // サーバに載ったので、手元のぶんはもう要らない
}

// ===== 送る =====

let 送信の列 = Promise.resolve();   // 続けて押しても、押した順に届くように1つずつ送る

function 送り待ちを直す(x, 届いた) {
  const 鍵 = 組の鍵(x.memberId, x.eventId);
  const 待ち = 覚え.取る('taikai:送り待ち') || {};
  // もっと新しく出し直していたら、そちらを残す
  if (待ち[鍵] && 待ち[鍵].時刻 === x.時刻) { delete 待ち[鍵]; 覚え.置く('taikai:送り待ち', 待ち); }
  const 手元 = 覚え.取る('taikai:手元:' + 鍵);
  if (!手元 || 手元.時刻 < x.時刻) return;
  if (届いた && 手元.時刻 === x.時刻) {
    手元.時刻 = Date.now();   // 届いた時刻にしておく。これより新しい写しなら、この返事が載っている
    覚え.置く('taikai:手元:' + 鍵, 手元);
  } else if (!届いた) {
    覚え.消す('taikai:手元:' + 鍵);
  }
}

/**
 * 1件送る。通信のせいで届かなかったときは送り待ちに残し（次に開いたときにもう一度送る）、
 * サーバに断られたとき（大会が消えた など）は残さずに知らせる。
 */
async function 送る(x, 知らせる) {
  const 今この組 = () => $('memberSelect').value === x.memberId && $('eventSelect').value === x.eventId;
  try {
    await call('submitResponse', x.eventId, x.memberId, x.answers, x.comment, x.rides);
    送り待ちを直す(x, true);
    // マイページが、写しに載るまで「まだ出していないもの」から外しておけるように
    try { localStorage.setItem('mypage:出したところ', JSON.stringify({ url: 'taikai.html', 時刻: Date.now() })); } catch (e) {}
    if (知らせる && 今この組()) {
      const ng = x.answers.filter((a) => !a.attending).length;
      show('success', '送信しました。ありがとうございます。' +
        (x.rides.length ? '出場する競技を' + x.rides.length + '件登録しました。' : '') +
        (ng ? '（行けない日は欠席で登録しました）' : ''));
    }
  } catch (e) {
    const 文 = (e && e.message) || String(e);
    if (e && e.通信) {
      if (知らせる && 今この組()) show('warning', '送信がまだ届いていません（' + 文 + '）。電波の良いところでこの画面を開き直すと、自動でもう一度送ります。');
      return;
    }
    送り待ちを直す(x, false);
    if (知らせる && 今この組()) show('error', '送信に失敗しました：' + 文);
  }
}

// 前に届かなかった送信を送り直す。いま飛んでいる最中かもしれないので、1分たったものだけ
function 送り待ちを送る() {
  const 待ち = 覚え.取る('taikai:送り待ち') || {};
  Object.keys(待ち).forEach((k) => {
    const x = 待ち[k];
    if (!x || Date.now() - (x.時刻 || 0) < 60 * 1000) return;
    送信の列 = 送信の列.then(() => 送る(x, true));
  });
}

$('submitBtn').addEventListener('click', () => {
  const memberId = $('memberSelect').value;
  const eventId = $('eventSelect').value;
  if (!memberId || !eventId) return;

  const 未入力 = 未入力の日();
  if (未入力.length) {
    return show('error', '出欠が入っていない日があります：' + 未入力.map((d) => d.label).join('、'));
  }
  const ng = 行けない日();
  if (ng.length && !$('comment').value.trim()) {
    show('error', '行けない日（' + ng.map((d) => d.label).join('、') + '）があるので、連絡事項に理由を書いてください。');
    $('comment').focus();
    return;
  }

  const answers = DAYS.map((d) => ({ date: d.date, attending: !!ANSWERS[d.date] }));
  const rides = [];
  Object.keys(RIDES).forEach((cid) => {
    (RIDES[cid] || []).forEach((h) => rides.push({ competitionId: cid, horse: h }));
  });
  const x = { eventId: eventId, memberId: memberId, answers: answers, comment: $('comment').value, rides: rides, 時刻: Date.now() };

  // 押した瞬間に受け付ける。届くまでは送り待ちに残し、画面にも手元のぶんを出す
  const 鍵 = 組の鍵(memberId, eventId);
  const 待ち = 覚え.取る('taikai:送り待ち') || {};
  待ち[鍵] = x;
  覚え.置く('taikai:送り待ち', 待ち);
  覚え.置く('taikai:手元:' + 鍵, { answers: answers, comment: x.comment, entries: rides, 時刻: x.時刻 });
  触った = false;

  show('success', '受け付けました。' +
    (rides.length ? '出場する競技' + rides.length + '件も一緒に出します。' : '') +
    (ng.length ? '（' + ng.map((d) => d.label).join('、') + 'は欠席で出します）' : '') +
    'いま送っています。届くとここに出ます。');
  送信の列 = 送信の列.then(() => 送る(x, true));
});

// ===== 開いたとき =====

// 名簿と大会の選ぶ欄を組む。選んでいたものはそのまま残す
function 選ぶ欄を組む(data) {
  DATA = data;
  HORSES = data.horses || [];
  $('loading').style.display = 'none';
  $('pickCard').style.display = 'block';
  const 人 = $('memberSelect').value;
  const 大会 = $('eventSelect').value;
  $('memberSelect').innerHTML = '<option value="">選択してください</option>' +
    DATA.members.map((m) => '<option value="' + m.id + '">' + esc(m.name) + (m.grade ? '（' + m.grade + '年）' : '') + '</option>').join('');
  $('eventSelect').innerHTML = '<option value="">選択してください</option>' +
    DATA.events.map((e) => '<option value="' + e.id + '">' + esc(e.name) + '</option>').join('');
  if (人 && DATA.members.some((m) => m.id === 人)) $('memberSelect').value = 人;
  if (大会 && DATA.events.some((e) => e.id === 大会)) $('eventSelect').value = 大会;
}

let 選んだことがある = false;
function 最初に選ぶ() {
  if (選んだことがある) return;
  選んだことがある = true;
  const saved = 覚えた人のID(DATA.members);
  if (saved) {
    $('memberSelect').value = saved;
    名前は聞かない((DATA.members.filter((m) => m.id === saved)[0] || {}).name);
  }
  if (DATA.events.length === 1) $('eventSelect').value = DATA.events[0].id;
  // マイページの「まだ出していないもの」から来たときは、その大会を開く
  const 指定 = URLの('event');
  if (指定 && DATA.events.some((e2) => e2.id === 指定)) $('eventSelect').value = 指定;
}

// 新しい中身を読む。静的サイトでは Cloudflare の写しから、名簿・大会・自分の返事を1回で
async function 新しいのを読む() {
  if (typeof 写しから読む === 'function') {
    try {
      const r = await 写しから読む(覚えた名前());
      return { data: r.data, 返事の表: r.memberId ? { 版: r.版, memberId: r.memberId, 表: r.返事 || {} } : null };
    } catch (e) { /* 写しが読めなければ Apps Script に聞く */ }
  }
  return { data: await call('getMemberPageData'), 返事の表: null };
}

(async () => {
  $('memberSelect').addEventListener('change', onSelectionChange);
  $('eventSelect').addEventListener('change', onSelectionChange);
  送り待ちを送る();

  const 前 = 覚え.取る('taikai:画面');
  if (前 && 前.members && 前.events) {
    選ぶ欄を組む(前);
    最初に選ぶ();
    onSelectionChange();
  }

  let 新;
  try {
    新 = await 新しいのを読む();
  } catch (e) {
    読み込み中 = false;
    if (前) show('warning', '最新の内容を読めませんでした。前回の内容を出しています：' + ((e && e.message) || e));
    else $('loading').innerHTML = '<div class="msg error">読み込みに失敗しました：' + esc((e && e.message) || e) + '</div>';
    return;
  }
  覚え.置く('taikai:画面', 新.data);
  返事の表 = 新.返事の表;
  読み込み中 = false;

  const 同じ = 前 && JSON.stringify(前) === JSON.stringify(新.data);
  if (!同じ) {
    選ぶ欄を組む(新.data);
    最初に選ぶ();
  }
  if (!前 || !触った) {
    onSelectionChange();   // 大会の日や自分の返事が変わっていれば出し直す
  } else if (!同じ) {
    // 触っている最中なら、入れたぶんは残して日の並びだけ新しくする
    const ev = DATA.events.filter((e) => e.id === $('eventSelect').value)[0];
    if (ev) { DAYS = ev.days || []; renderDays(); }
  }
})();
</script>
<script>
/*
  入口（マイページ）へ戻る道を2つ用意する。どちらも静的サイトだけのもの。
    1. 見出し帯の「← マイページ」…… いつでも左上に見えている
    2. 出し終わったときのボタン …… 送信できた知らせの下に足す

  2は、知らせを出すところが画面ごとにバラバラ（show() だったり innerHTML だったり）なので、
  **出てきた「成功の知らせ」を見つけて足す**形にしてある。そのぶん画面側は触らずに済む。
*/
(function () {
  let 戻り先 = 'index.html';
  try {
    const 立場 = localStorage.getItem('role');
    if (立場 && 立場 !== 'links') 戻り先 = 'index.html?role=' + encodeURIComponent(立場);
  } catch (e) { /* 保存できない設定でも、部員用の入口には戻れる */ }
  document.querySelectorAll('a.backhome').forEach((a) => { a.href = 戻り先; });

  // 「前回の回答を読み込みました」のような成功の知らせもあるので、**出し終わった知らせだけ**に付ける
  const 出し終わった = /(送信しました|出しました|申し込みました|受け付けました|登録しました|保存しました)/;

  const 足す = (el) => {
    if (!el || el.dataset.home === '1' || !出し終わった.test(el.textContent || '')) return;
    el.dataset.home = '1';
    // マイページが、サーバの返事を待たずに「まだ出していないもの」から消せるようにしておく
    try {
      localStorage.setItem('mypage:出したところ', JSON.stringify({
        url: location.pathname.split('/').pop(), 時刻: Date.now(),
      }));
    } catch (e) { /* 保存できない設定なら、次に読んだときに正しくなる */ }
    const a = document.createElement('a');
    a.className = 'donehome';
    a.href = 戻り先;
    a.textContent = 'マイページに戻る';
    el.insertAdjacentElement('afterend', a);
  };
  const 見る = (根) => {
    if (!根 || 根.querySelectorAll === undefined) return;
    if (根.classList && 根.classList.contains('msg') && 根.classList.contains('success')) 足す(根);
    根.querySelectorAll('.msg.success').forEach(足す);
  };
  new MutationObserver((記録) => {
