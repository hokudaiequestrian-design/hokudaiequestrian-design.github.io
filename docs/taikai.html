<!DOCTYPE html>
<html lang="ja">
<head>
<base target="_top">
<meta name="robots" content="noindex, nofollow">
<style>
:root {
  --bg: #f5f6f8;
  --card: #ffffff;
  --text: #1f2430;
  --muted: #6b7280;
  --primary: #2563eb;
  --primary-dark: #1d4ed8;
  --border: #e2e5ea;
  --danger: #dc2626;
  --success: #16a34a;
  --warning: #b45309;
  --rider: #c00000;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
}

header.appbar {
  background: var(--primary);
  color: #fff;
  padding: 14px 16px;
  font-size: 18px;
  font-weight: 700;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
}
header.appbar a { color: #fff; text-decoration: underline; font-size: 13px; font-weight: 400; cursor: pointer; }

main { max-width: 720px; margin: 0 auto; padding: 16px; }
main.wide { max-width: 1400px; }

.card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 16px; margin-bottom: 16px; }

h1 { font-size: 20px; }
h2 { font-size: 17px; margin-top: 0; }
h3 { font-size: 15px; margin: 0 0 8px; }

label { display: block; font-weight: 600; margin: 12px 0 4px; font-size: 14px; }
label.inline { display: inline-flex; align-items: center; gap: 5px; font-weight: 400; margin: 0 10px 0 0; font-size: 13px; }

select, input[type=text], input[type=number], input[type=password], input[type=date], textarea {
  width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 8px;
  font-size: 15px; background: #fff; color: var(--text); font-family: inherit;
}
textarea { min-height: 70px; resize: vertical; }
input[type=checkbox] { width: auto; }

.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; }
.row > * { flex: 1; min-width: 120px; }
.row.tight > * { flex: 0 0 auto; min-width: 0; }

.checkbox-list, .radio-list { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }

.chip { border: 1px solid var(--border); border-radius: 999px; padding: 10px 18px; font-size: 15px; cursor: pointer; user-select: none; background: #fff; }
.chip.selected { background: var(--primary); color: #fff; border-color: var(--primary); }

button {
  background: var(--primary); color: #fff; border: none; border-radius: 8px;
  padding: 12px 18px; font-size: 15px; font-weight: 700; cursor: pointer;
}
button:hover { background: var(--primary-dark); }
button:disabled { opacity: .5; cursor: default; }
button.secondary { background: #fff; color: var(--primary); border: 1px solid var(--primary); }
button.secondary:hover { background: #eff6ff; }
button.danger { background: var(--danger); }
button.small { padding: 6px 10px; font-size: 13px; }

.msg { padding: 10px 12px; border-radius: 8px; margin: 10px 0; font-size: 14px; }
.msg.success { background: #ecfdf3; color: var(--success); border: 1px solid #b7f0ce; }
.msg.error { background: #fef2f2; color: var(--danger); border: 1px solid #fecaca; }
.msg.warning { background: #fffbeb; color: var(--warning); border: 1px solid #fde68a; }

table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { border: 1px solid var(--border); padding: 8px 10px; text-align: left; }
th { background: #f0f2f5; }

.muted { color: var(--muted); font-size: 13px; }
.hint { color: var(--muted); font-size: 13px; margin: 4px 0 0; }

.list-item { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--border); }
.list-item:last-child { border-bottom: none; }

.tabs { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
.tabs button { background: #fff; color: var(--text); border: 1px solid var(--border); }
.tabs button.active { background: var(--primary); color: #fff; border-color: var(--primary); }

.post-tag { display: inline-block; border-radius: 6px; padding: 1px 8px; font-size: 12px; font-weight: 700; background: #eef2ff; color: var(--primary); }
.post-運営 { background: #eff6ff; color: #1d4ed8; }
.post-箱番長 { background: #f0fdf4; color: #15803d; }
.post-馬匹 { background: #fef3c7; color: #a16207; }
.post-会計 { background: #fae8ff; color: #a21caf; }

.role-card { border: 1px dashed var(--border); border-radius: 8px; padding: 10px; margin-bottom: 8px; }

/* 大会設定の「1日ぶん」のまとまり */
.day-block { border-left: 4px solid var(--primary); }
.day-heading { font-size: 16px; color: var(--primary); border-bottom: 1px solid var(--border); padding-bottom: 6px; margin-bottom: 10px; }

/* 候補から選ぶプルダウン。「その他（自由入力）」を選んだときだけ下に入力欄が出る */
.pick { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.pick > select, .pick > input { width: 100%; }
.pick > input.pick-other { border-color: var(--primary); }

/* 人員表のマトリクス */
.matrix-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 8px; background: #fff; max-height: 70vh; overflow-y: auto; }
table.matrix { border-collapse: separate; border-spacing: 0; font-size: 12px; width: auto; min-width: 100%; }
table.matrix th, table.matrix td { border: 0; border-right: 1px solid var(--border); border-bottom: 1px solid var(--border); padding: 2px 4px; white-space: nowrap; }
table.matrix thead th { background: #f0f2f5; position: sticky; top: 0; z-index: 2; text-align: center; }
table.matrix thead tr.days th { background: #e5e9f0; top: 0; }
table.matrix thead tr.comps th { top: 27px; }
table.matrix th.rowhead, table.matrix td.rowhead {
  position: sticky; left: 0; z-index: 3; background: #fff; text-align: left;
  border-right: 2px solid var(--border); min-width: 96px;
}
table.matrix thead th.rowhead { z-index: 4; background: #f0f2f5; }
/* 行にカーソルを合わせても色は変えない（表計算ソフトと同じ）。
   代わりに、選んでいるマスの行と列の見出しだけを目立たせる。 */
/* 選んでいる行・列の見出し。選択中のマスより薄くして、マスの青が負けないようにする。 */
table.matrix thead th.active, table.matrix td.rowhead.active { background: #e8eefb; }

/* 仕事ごとの色は --jb（背景）と --jf（文字）で渡ってくる。
   選択中や未保存のほうが目立つべきなので、そちらの指定が勝つ順番にしてある。 */
td.cell {
  text-align: center; padding: 4px 2px; min-width: 76px; cursor: cell; user-select: none;
  background: var(--jb, #fff); color: var(--jf, var(--text));
}
td.cell .v { display: block; min-height: 1.2em; }
td.cell select {
  width: 100%; min-width: 76px; border: 0; background: #fff; padding: 2px;
  font-size: 12px; border-radius: 0; text-align: center; cursor: pointer; color: var(--text);
}
/* 来られないと答えている日のマス。触れるので、右上の小さな角印だけで控えめに示す。
   仕事を入れればその色が出て、他のマスと同じ見た目になる。 */
td.cell.absent { position: relative; background: var(--jb, #fafbfc); }
td.cell.absent::after {
  content: ''; position: absolute; top: 0; right: 0;
  border-top: 6px solid #b9c0cc; border-left: 6px solid transparent;
}
td.cell.absent .v:empty::after { content: '－'; color: #c7ccd4; }
td.cell.locked { box-shadow: inset 3px 0 0 var(--warning); }
td.cell.dirty { background: #fffbeb; }
/* 人数が足りない競技は、マスの色を潰さないよう下線で示す */
td.cell.short { border-bottom: 3px solid #f08a8a; }

/* 選択範囲。表計算ソフトと同じ感覚で見えるように */
.matrix-wrap { user-select: none; }
#matrixBox:focus { outline: none; }
/* 選択の青は何よりも優先させたいので、詳細度を高くしてある */
table.matrix tbody tr td.sel { background: #cfe2ff; }
table.matrix tbody tr td.sel.dirty { background: #fde68a; }
table.matrix tbody tr td.anchor { outline: 2px solid var(--primary); outline-offset: -2px; }

.cell-tools {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  flex-wrap: wrap; margin: 8px 0 0; padding: 8px 10px;
  background: #eff6ff; border: 1px solid #bfdbfe; border-radius: 8px;
}
/* 出場する人の馬名は赤字、手伝い（馬付き）は黒字。マニュアルと同じ見せ方。 */
td.rider { text-align: center; color: var(--rider); font-weight: 700; background: #fff; }
td.cell.helper { font-weight: 700; }
.off-tag { font-size: 11px; color: #9aa1ac; }
.row-filter { display: block; margin: 10px 0 0; font-size: 13px; cursor: pointer; }
.row-filter input { margin-right: 6px; vertical-align: -1px; }
.rider-tag { display: inline-block; border-radius: 6px; padding: 1px 8px; font-size: 12px; font-weight: 700; background: #fff5f5; color: var(--rider); border: 1px solid #fecaca; }
th.short { background: #fef2f2; }

/* 出欠を日ごとに聞く欄（部員の画面） */
.day-vote { border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; background: #fff; }
.day-vote.no { border-color: #fecaca; background: #fef2f2; }
.day-vote .day-name { font-weight: 700; font-size: 15px; }
.day-vote .day-plan { color: var(--muted); font-size: 12px; margin-top: 2px; }

/* 出る競技と馬を選ぶ欄（部員の画面） */
.ride-box { margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--border); }
.ride-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
.ride-row .ride-name { flex: 0 0 110px; font-size: 14px; font-weight: 600; }
.ride-row select { flex: 1 1 auto; padding: 8px; }

.legend { display: flex; flex-wrap: wrap; gap: 10px; margin: 10px 0 0; font-size: 12px; color: var(--muted); align-items: center; }
.legend .swatch { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 4px; vertical-align: -2px; }
.legend .swatch.abs { position: relative; background: #fafbfc; border: 1px solid #d1d5db; border-radius: 0; }
.legend .swatch.abs::after {
  content: ''; position: absolute; top: 0; right: 0;
  border-top: 5px solid #b9c0cc; border-left: 5px solid transparent;
}

.summary-grid { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
.summary-grid .stat { border: 1px solid var(--border); border-radius: 8px; padding: 8px 12px; background: #fff; min-width: 108px; }
.summary-grid .stat b { display: block; font-size: 19px; }
.summary-grid .stat span { font-size: 12px; color: var(--muted); }

.warn-list { max-height: 220px; overflow-y: auto; margin-top: 8px; }
.warn-list div { font-size: 13px; padding: 3px 0; border-bottom: 1px solid var(--border); }
.warn-list div:last-child { border-bottom: none; }
.warn-list .e { color: var(--danger); }
.warn-list .w { color: var(--warning); }

.pill-list { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.pill { border: 1px solid var(--border); border-radius: 999px; padding: 3px 10px; font-size: 12px; background: #fff; }
.pill.no { background: #fef2f2; border-color: #fecaca; color: var(--danger); }
.pill.yes { background: #ecfdf3; border-color: #b7f0ce; color: var(--success); }

/* 通信中の表示。Apps Scriptは1往復に数秒かかるので、待ちを必ず見せる */
#busy {
  position: fixed; top: 0; left: 0; right: 0; z-index: 100;
  background: var(--warning); color: #fff; text-align: center;
  padding: 6px; font-size: 13px; font-weight: 700; display: none;
}
#busy.on { display: block; }

.saving-bar {
  position: sticky; bottom: 0; background: #fff; border-top: 2px solid var(--primary);
  padding: 10px; display: none; align-items: center; gap: 12px; justify-content: space-between;
}
.saving-bar.on { display: flex; }

/* マイページから来たときの「◯◯ さんとして出します」。
   入口で名前を選んでいるので、ここで選び直させない（2026-09-13）。
   ちがう人のときは入口で選び直す（画面ごとに聞き直さない）。 */
.wholine { font-size: var(--text-base); margin: var(--space-xs) 0 0; line-height: 1.7; }
.wholine b { font-size: var(--text-md); }
.wholine .hint { display: block; margin-top: var(--space-3xs); }
</style>
<script>
const 写しのURL = 'https://bajutsubu-cache.hokudai-equestrian.workers.dev';
function 写しから読む(名) {
  const 止める = typeof AbortController === 'function' ? new AbortController() : null;
  const 時間切れ = setTimeout(() => { if (止める) 止める.abort(); }, 5000);
  return fetch(写しのURL + '/jinin/taikai?name=' + encodeURIComponent(名 || ''), {
    cache: 'no-store', signal: 止める ? 止める.signal : undefined,
  }).then((res) => {
    if (!res.ok) throw new Error('写しを読めませんでした（' + res.status + '）');
    return res.json();
  }).then((r) => {
    if (!r.ok) throw new Error(r.error || '写しを読めませんでした');
    return r.value;
  }).finally(() => clearTimeout(時間切れ));
}
</script>
<style>
/* 「マイページに戻る」は**いつでも左上**に出す（2026-09-13にユーザーが決めた）。
   見出し帯ごと貼り付けておけば、下まで読んでいる途中でも戻れる。 */
header.appbar { position: sticky; top: 0; z-index: var(--z-sticky); }
header.appbar > span { margin-right: auto; }   /* 題が伸びて、ほかのリンクは右に寄る */
header.appbar a.backhome {
  border: 1px solid rgba(255, 255, 255, 0.75); border-radius: var(--radius-pill);
  padding: 4px 14px; text-decoration: none; font-weight: 700;
}
header.appbar a.backhome:hover { background: rgba(255, 255, 255, 0.15); }

/* 出し終わったときに、知らせの下に出すボタン（2026-09-13にユーザーが決めた）。
   出したあとは次の画面へ移ることが多いので、帯まで戻らなくても押せるところに置く。 */
a.donehome {
  display: inline-flex; align-items: center; justify-content: center;
  min-height: var(--tap); margin-top: var(--space-sm); padding: var(--space-xs) var(--space-lg);
  background: var(--accent); color: #fff; font-size: var(--text-base); font-weight: 700;
  border-radius: var(--radius-input); text-decoration: none;
}
a.donehome:hover { background: var(--accent-dark); }
</style>
</head>
<body>
<div id="busy">通信中です…</div>
<header class="appbar">
  <a class="backhome" href="index.html">← マイページ</a><span>大会の出欠入力</span></header>

<main>
  <div id="loading" class="card muted">読み込んでいます…</div>

  <div class="card" id="pickCard" style="display:none;">
    <label for="memberSelect">あなたの名前</label>
    <select id="memberSelect"></select>
    <label for="eventSelect">大会</label>
    <select id="eventSelect"></select>
  </div>

  <div class="card" id="formCard" style="display:none;">
    <h2 id="eventTitle"></h2>
    <div id="eventPeriod" class="muted"></div>

    <label>日ごとの出欠</label>
    <p class="hint">大会は数日あります。<b>1日ずつ</b>、行ける・行けないを選んでください。行ける日は、その下に出る競技と馬を入れる欄が出ます。</p>
    <div id="dayVotes"></div>

    <label for="comment" id="commentLabel">希望・連絡事項（任意）</label>
    <p class="hint" id="commentHint">仕事は基本的に役職にそって割り振られます。希望や都合があればここに書いてください。</p>
    <textarea id="comment" placeholder="例：日曜の午後は用事があるので早めに帰りたいです"></textarea>

    <div style="margin-top:16px;">
      <button id="submitBtn">送信する</button>
    </div>
    <div id="msg"></div>
  </div>
</main>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* 選んだ人は「名前」で覚える。
   当番・手入れと大会人員表では部員IDの体系が違い（m_xxxxxxxxxx と m_001）、
   両方にいる人でも一致しない。画面が全部おなじドメインに並んでいるので、
   IDのまま覚えると画面を移るたびに当てが外れて選び直しになる。
   名簿は「名簿をそろえる」で同期していて、名前は揃っている。 */
function 名前を覚える(members, memberId) {
  const m = (members || []).filter((x) => x.id === memberId)[0];
  if (!m) return;
  try { localStorage.setItem('me', m.name); } catch (e) { /* 保存できない設定でも画面は動かす */ }
}
function 覚えた名前() {
  try { return localStorage.getItem('me') || ''; } catch (e) { return ''; }
}
function 覚えた人のID(members) {
  const 名 = 覚えた名前();
  const m = (members || []).filter((x) => x.name === 名)[0];
  if (m) return m.id;
  // 名前で覚える前に使っていた人のぶん（同じシステムの中でだけ当たる）
  let 旧 = '';
  try { 旧 = localStorage.getItem('memberId') || ''; } catch (e) {}
  return (members || []).some((x) => x.id === 旧) ? 旧 : '';
}
/* マイページからは「どれの話か」を付けて飛んでくる（?term= ?event= ?plan=）。
   GASの画面は枠の中で動くので location.search は拾えない。そのときは今までどおり選ぶ。 */
function URLの(名) {
  try { return new URLSearchParams(location.search).get(名) || ''; } catch (e) { return ''; }
}

/**
 * 入口（マイページ）で名前を選んでからここへ来るので、**名前は聞き直さない**（2026-09-13）。
 * 選ぶところを隠して「◯◯ さんとして出します」に置き換える。
 * 別の人のぶんを出すときは入口で名前を選び直す（2026-09-13にユーザーが決めた。
 * ここに「ちがう人」を置くと、押す前に確かめる手間が画面ごとに戻ってしまう）。
 */
function 名前は聞かない(名) {
  const sel = $('memberSelect');
  if (!sel || !名) return;
  const lab = document.querySelector('label[for="memberSelect"]');
  const 行 = document.createElement('p');
  行.className = 'wholine';
  行.innerHTML = '<b>' + esc(名) + '</b> さんとして出します' +
    '<span class="hint">ちがう人のときは、左上の「← マイページ」で名前を選び直してください。</span>';
  sel.parentNode.insertBefore(行, lab || sel);
  sel.style.display = 'none';
  if (lab) lab.style.display = 'none';
}

const show = (cls, text) => { $('msg').innerHTML = '<div class="msg ' + cls + '">' + esc(text) + '</div>'; };

let DATA = { members: [], events: [] };
let DAYS = [];      // 選んでいる大会の日の一覧
let ANSWERS = {};   // 日付 → true（行ける）／false（行けない）
let RIDES = {};     // 競技ID → 乗る馬の名前の配列（同じ競技に2頭で出ることがある）
let HORSES = [];    // 部の馬
let busyCount = 0;

function busy(on) {
  busyCount += on ? 1 : -1;
  $('busy').className = busyCount > 0 ? 'on' : '';
}

const API = 'https://script.google.com/macros/s/AKfycbxUWCdZAA0-JIhl2Pr10KbAIZSKY4hcn7MfFwRWODjd0WQBWmmA25A-GdtVb5mcK38MTQ/exec';

/**
 * サーバ（Apps Script）を呼ぶ。
 *
 * この画面は script.google.com の外に置いてあるので、GASの画面用の呼び出し口は使えない。
 * かわりに fetch で叩く。**別オリジンなのでCookieが飛ばない**ぶん、
 * 複数のGoogleアカウントに同時ログインしていても「ファイルを開くことができません」にならない。
 * 画面を外に出したのはそのため。
 *
 * Content-Type を text/plain にしているのは、application/json にすると
 * ブラウザが事前確認（preflight の OPTIONS）を投げ、Apps Script がそれを受けられないため。
 *
 * 通信のせいで失敗したとき（つながらない・HTMLのエラーページが返った）は、エラーに 通信: true を付ける。
 * サーバが断ったとき（入力の誤りなど）と分けて、送り直してよいかを画面が判断できるようにするため。
 *
 * **送信（submitResponse）だけは keepalive で送る。** 押してすぐ画面を閉じたり
 * マイページへ戻ったりしても、ブラウザが最後まで届けてくれる。keepalive で失敗したときは
 * 普通の送り方でもう一度だけ試す（出欠の送信は同じ中身で何度送っても結果が変わらない）。
 */
const 閉じても届ける = ['submitResponse'];

function call(fn) {
  const args = Array.prototype.slice.call(arguments, 1);
  busy(true);
  const 本文 = JSON.stringify({ fn: fn, args: args });
  const 送る = (keepalive) => fetch(API, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=UTF-8' },
    body: 本文,
    keepalive: keepalive,
  });
  const 届ける = 閉じても届ける.indexOf(fn) >= 0 && 本文.length < 60000;
  return (届ける ? 送る(true).catch(() => 送る(false)) : 送る(false)).then((res) => {
    if (!res.ok) throw new Error('つながりませんでした（' + res.status + '）。少し待ってから開き直してください。');
    return res.json();
  }).catch((e) => {
    const err = /^つながりませんでした/.test((e && e.message) || '') ? e
      : new Error('つながりませんでした。電波の良いところで、少し待ってから開き直してください。');
    err.通信 = true;
    throw err;
  }).then((r) => {
    if (!r.ok) throw new Error(r.error || '不明なエラーが起きました。');
    return r.value;
  }).finally(() => { busy(false); });
}

/* ===== 待たせない工夫（2026-09-13） =====
   Apps Script は1回の往復に2〜30秒かかる。そこで
     ・前回読んだ中身を覚えておき、**開いた瞬間にそれで組む**（届いたら差し替える）
     ・静的サイトでは Cloudflare の写しから、名簿・大会と自分の返事を**1回で**読む（写しから読む。build.js が差し込む）
     ・送信は**押した瞬間に受け付けて**、裏で送る。届くまで「送り待ち」に残し、
       届かなかったら次に開いたとき（この画面かマイページ）にもう一度送る
   覚えるもの：
     taikai:画面               前回の名簿・大会・馬
     taikai:返事:部員ID|大会ID  前回サーバから取れた自分の返事
     taikai:手元:部員ID|大会ID  自分が出したばかりの返事（写しに載るまでこちらを出す）
     taikai:送り待ち           まだ届いたと確かめていない送信
*/
const 覚え = {
  取る(k) { try { const s = localStorage.getItem(k); return s ? JSON.parse(s) : null; } catch (e) { return null; } },
  置く(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* いっぱいなら諦める */ } },
  消す(k) { try { localStorage.removeItem(k); } catch (e) {} },
};
const 組の鍵 = (memberId, eventId) => memberId + '|' + eventId;
// 版は「書き替えた時刻.乱数」。写しがいつの中身かを、この時刻で見分ける
const 版の時刻 = (v) => Number(String(v == null ? '' : v).split('.')[0]) || 0;

/**
 * 画面に出す自分の返事を選ぶ。
 *   サーバ … サーバの返事（無ければ null）
 *   版     … それが写しなら写しの版。Apps Script から直に取った最新なら null
 *   手元   … 自分が出したばかりの返事（{answers, comment, entries, 時刻}）
 *   待ち   … その返事がまだ届いたと確かめられていないか
 * 写しは1〜2分遅れるので、**出したあとに作られた写しが来るまでは手元を出す。**
 */
function どちらの返事(サーバ, 版, 手元, 待ち) {
  if (!手元) return { 返事: サーバ, 手元を使った: false, 手元は古い: false };
  const サーバが新しい = !待ち && (版 === null || 版の時刻(版) >= 手元.時刻);
  if (サーバが新しい) return { 返事: サーバ, 手元を使った: false, 手元は古い: true };
  return {
    返事: { answers: 手元.answers, comment: 手元.comment, entries: 手元.entries },
    手元を使った: true,
    手元は古い: false,
  };
}

let 触った = false;       // 返事を出したあとに、この人が画面を触ったか（触ったら上書きしない）
let 返事の表 = null;      // 写しから取れた自分の返事 {版, memberId, 表: {大会ID: 返事}}
let 返事を読む番 = 0;     // 読んでいるあいだに選び直されたら、古いほうの結果は捨てる
let 読み込み中 = true;    // 開いてすぐの読み込みが終わるまでは、手元のぶんを出すだけにする（写しで返事も一緒に来るので、別に聞きに行かない）

const 行けない日 = () => DAYS.filter((d) => ANSWERS[d.date] === false);
const 未入力の日 = () => DAYS.filter((d) => ANSWERS[d.date] === undefined);

function renderDays() {
  $('dayVotes').innerHTML = DAYS.map((d, i) => {
    const v = ANSWERS[d.date];
    const comps = d.competitions || [];
    const plan = comps.length ? esc(comps.map((c) => c.name).join('・')) : '';

    // 行ける日だけ、出る競技と馬を聞く。
    // 同じ競技に2頭で出ることがあるので、馬を選ぶと下に空の枠が増えていく。
    const 出場欄 = (v === true && comps.length)
      ? '<div class="ride-box"><div class="muted" style="margin-bottom:6px;">この日に<b>選手として出る競技</b>があれば、乗る馬を選んでください。出ない競技はそのままで構いません。<br>同じ競技に2頭以上で出る場合は、馬を選ぶと下に欄が増えます。</div>' +
        comps.map((c) => {
          const 馬たち = (RIDES[c.id] || []).slice();
          馬たち.push(''); // いつでも1つ空きを出しておく
          return 馬たち.map((馬, i) =>
            '<div class="ride-row">' +
            '<span class="ride-name">' + (i === 0 ? esc(c.name) : '') + '</span>' +
            '<select data-ride="' + esc(c.id) + '" data-slot="' + i + '">' +
            '<option value="">' + (i === 0 ? '出ない' : '（追加しない）') + '</option>' +
            HORSES.map((h) => '<option value="' + esc(h) + '"' + (馬 === h ? ' selected' : '') + '>' + esc(h) + '</option>').join('') +
            (馬 && HORSES.indexOf(馬) < 0 ? '<option value="' + esc(馬) + '" selected>' + esc(馬) + '</option>' : '') +
            '</select></div>').join('');
        }).join('') + '</div>'
      : '';

    return '<div class="day-vote' + (v === false ? ' no' : '') + '">' +
      '<div class="day-name">' + esc(d.label) + '</div>' +
      (plan ? '<div class="day-plan">' + plan + '</div>' : '') +
      '<div class="radio-list" style="margin-top:8px;">' +
      '<div class="chip' + (v === true ? ' selected' : '') + '" data-day="' + i + '" data-val="1">行ける</div>' +
      '<div class="chip' + (v === false ? ' selected' : '') + '" data-day="' + i + '" data-val="0">行けない</div>' +
      '</div>' + 出場欄 + '</div>';
  }).join('');

  $('dayVotes').querySelectorAll('select[data-ride]').forEach((sel) => {
    sel.addEventListener('change', () => {
      触った = true;
      const cid = sel.dataset.ride;
      const i = Number(sel.dataset.slot);
      const 一覧 = (RIDES[cid] || []).slice();
      if (sel.value) 一覧[i] = sel.value;   // 空きの枠なら、そこに足される
      else 一覧.splice(i, 1);               // 「出ない」を選んだらその枠を消す
      // 同じ馬を二重に選んでいたら1つにする
      const 整理 = [];
      一覧.forEach((h) => { if (h && 整理.indexOf(h) < 0) 整理.push(h); });
      if (整理.length) RIDES[cid] = 整理;
      else delete RIDES[cid];
      renderDays(); // 枠の増減を出し直す
    });
  });

  updateCommentLabel();
}

$('dayVotes').addEventListener('click', (e) => {
  const chip = e.target.closest ? e.target.closest('[data-day]') : null;
  if (!chip) return;
  触った = true;
  const day = DAYS[Number(chip.dataset.day)];
  const 行ける = chip.dataset.val === '1';
  ANSWERS[day.date] = 行ける;
  // 行けなくした日の出場は取り下げる
  if (!行ける) (day.competitions || []).forEach((c) => { delete RIDES[c.id]; });
  renderDays();
});
$('comment').addEventListener('input', () => { 触った = true; });

// 行けない日があるときだけ連絡事項を必須にする
function updateCommentLabel() {
  const ng = 行けない日();
  if (ng.length) {
    $('commentLabel').innerHTML = '連絡事項 <span style="color:var(--danger);">※必須</span>';
    $('commentHint').innerHTML = '<b>' + esc(ng.map((d) => d.label).join('、')) + '</b> に行けないので、理由を書いてください。';
    $('comment').placeholder = '例：土曜は教習所の卒検があるため行けません';
  } else {
    $('commentLabel').textContent = '希望・連絡事項（任意）';
    $('commentHint').textContent = '仕事は基本的に役職にそって割り振られます。希望や都合があればここに書いてください。';
    $('comment').placeholder = '例：日曜の午後は用事があるので早めに帰りたいです';
  }
}

// 返事を画面に入れる（null なら空にする）
function 返事を入れる(mine) {
  ANSWERS = {};
  RIDES = {};
  $('comment').value = '';
  if (mine) {
    (mine.answers || []).forEach((a) => { ANSWERS[a.date || ''] = a.attending; });
    (mine.entries || []).forEach((x) => {
      if (!RIDES[x.competitionId]) RIDES[x.competitionId] = [];
      if (RIDES[x.competitionId].indexOf(x.horse) < 0) RIDES[x.competitionId].push(x.horse);
    });
    $('comment').value = mine.comment || '';
  }
  renderDays();
}

async function onSelectionChange() {
  const memberId = $('memberSelect').value;
  const eventId = $('eventSelect').value;
  const ev = DATA.events.filter((e) => e.id === eventId)[0];
  if (!memberId || !eventId || !ev) { $('formCard').style.display = 'none'; return; }
  名前を覚える(DATA.members, memberId);

  $('eventTitle').textContent = ev.name;
  DAYS = ev.days || [];
  $('eventPeriod').textContent = DAYS.length && DAYS[0].date
    ? DAYS[0].label + (DAYS.length > 1 ? ' 〜 ' + DAYS[DAYS.length - 1].label : '') + '（全' + DAYS.length + '日）'
    : '';

  $('msg').innerHTML = '';
  $('formCard').style.display = 'block';
  触った = false;
  await 自分の返事を出す(memberId, eventId);
}

/**
 * 自分の返事を出す。まず手元（出したばかり／前回取れたぶん）で出して、
 * サーバのぶんが取れたら、**まだ画面を触っていなければ**差し替える。
 */
async function 自分の返事を出す(memberId, eventId) {
  const 番 = ++返事を読む番;
  const 鍵 = 組の鍵(memberId, eventId);
  const 手元 = 覚え.取る('taikai:手元:' + 鍵);
  const 待ち = !!(覚え.取る('taikai:送り待ち') || {})[鍵];

  // 1. 待たずに出せるぶん
  const 表 = 返事の表 && 返事の表.memberId === memberId ? 返事の表 : null;
  const 先に = どちらの返事(表 ? (表.表[eventId] || null) : 覚え.取る('taikai:返事:' + 鍵), 表 ? 表.版 : '0', 手元, 待ち);
  返事を入れる(先に.返事);
  if (待ち) show('warning', '前に出したぶんを、まだ送っています。届くとここに出ます。');
  else if (先に.返事) show('success', '前回の回答を読み込みました。書き換えて送信すると更新されます。');
  if (表) { 返事を覚える(鍵, 表.表[eventId] || null, 先に); return; }
  if (読み込み中) return;

  // 2. 写しが無いときは Apps Script に聞く（こちらは常に最新）
  let サーバ;
  try {
    サーバ = await call('getMyResponse', eventId, memberId);
  } catch (e) {
    if (番 === 返事を読む番 && !先に.返事) show('error', (e && e.message) || e);
    return;
  }
  if (番 !== 返事を読む番) return;   // 読んでいるあいだに選び直された
  const 後で = どちらの返事(サーバ, null, 手元, 待ち);
  返事を覚える(鍵, サーバ, 後で);
  if (触った || JSON.stringify(後で.返事) === JSON.stringify(先に.返事)) return;
  返事を入れる(後で.返事);
  if (後で.返事) show('success', '前回の回答を読み込みました。書き換えて送信すると更新されます。');
  else $('msg').innerHTML = '';
}

function 返事を覚える(鍵, サーバ, 選んだ) {
  覚え.置く('taikai:返事:' + 鍵, サーバ);
  if (選んだ.手元は古い) 覚え.消す('taikai:手元:' + 鍵);   // サーバに載ったので、手元のぶんはもう要らない
}

// ===== 送る =====

let 送信の列 = Promise.resolve();   // 続けて押しても、押した順に届くように1つずつ送る

function 送り待ちを直す(x, 届いた) {
  const 鍵 = 組の鍵(x.memberId, x.eventId);
  const 待ち = 覚え.取る('taikai:送り待ち') || {};
  // もっと新しく出し直していたら、そちらを残す
  if (待ち[鍵] && 待ち[鍵].時刻 === x.時刻) { delete 待ち[鍵]; 覚え.置く('taikai:送り待ち', 待ち); }
  const 手元 = 覚え.取る('taikai:手元:' + 鍵);
  if (!手元 || 手元.時刻 < x.時刻) return;
  if (届いた && 手元.時刻 === x.時刻) {
    手元.時刻 = Date.now();   // 届いた時刻にしておく。これより新しい写しなら、この返事が載っている
    覚え.置く('taikai:手元:' + 鍵, 手元);
  } else if (!届いた) {
    覚え.消す('taikai:手元:' + 鍵);
  }
}

/**
 * 1件送る。通信のせいで届かなかったときは送り待ちに残し（次に開いたときにもう一度送る）、
 * サーバに断られたとき（大会が消えた など）は残さずに知らせる。
 */
async function 送る(x, 知らせる) {
  const 今この組 = () => $('memberSelect').value === x.memberId && $('eventSelect').value === x.eventId;
  try {
    await call('submitResponse', x.eventId, x.memberId, x.answers, x.comment, x.rides);
    送り待ちを直す(x, true);
    // マイページが、写しに載るまで「まだ出していないもの」から外しておけるように
    try { localStorage.setItem('mypage:出したところ', JSON.stringify({ url: 'taikai.html', 時刻: Date.now() })); } catch (e) {}
    if (知らせる && 今この組()) {
      const ng = x.answers.filter((a) => !a.attending).length;
      show('success', '送信しました。ありがとうございます。' +
        (x.rides.length ? '出場する競技を' + x.rides.length + '件登録しました。' : '') +
        (ng ? '（行けない日は欠席で登録しました）' : ''));
    }
  } catch (e) {
    const 文 = (e && e.message) || String(e);
    if (e && e.通信) {
      if (知らせる && 今この組()) show('warning', '送信がまだ届いていません（' + 文 + '）。電波の良いところでこの画面を開き直すと、自動でもう一度送ります。');
      return;
    }
    送り待ちを直す(x, false);
    if (知らせる && 今この組()) show('error', '送信に失敗しました：' + 文);
  }
}

// 前に届かなかった送信を送り直す。いま飛んでいる最中かもしれないので、1分たったものだけ
function 送り待ちを送る() {
  const 待ち = 覚え.取る('taikai:送り待ち') || {};
  Object.keys(待ち).forEach((k) => {
    const x = 待ち[k];
    if (!x || Date.now() - (x.時刻 || 0) < 60 * 1000) return;
    送信の列 = 送信の列.then(() => 送る(x, true));
  });
}

$('submitBtn').addEventListener('click', () => {
  const memberId = $('memberSelect').value;
  const eventId = $('eventSelect').value;
  if (!memberId || !eventId) return;

  const 未入力 = 未入力の日();
  if (未入力.length) {
    return show('error', '出欠が入っていない日があります：' + 未入力.map((d) => d.label).join('、'));
  }
  const ng = 行けない日();
  if (ng.length && !$('comment').value.trim()) {
    show('error', '行けない日（' + ng.map((d) => d.label).join('、') + '）があるので、連絡事項に理由を書いてください。');
    $('comment').focus();
    return;
  }

  const answers = DAYS.map((d) => ({ date: d.date, attending: !!ANSWERS[d.date] }));
  const rides = [];
  Object.keys(RIDES).forEach((cid) => {
    (RIDES[cid] || []).forEach((h) => rides.push({ competitionId: cid, horse: h }));
  });
  const x = { eventId: eventId, memberId: memberId, answers: answers, comment: $('comment').value, rides: rides, 時刻: Date.now() };

  // 押した瞬間に受け付ける。届くまでは送り待ちに残し、画面にも手元のぶんを出す
  const 鍵 = 組の鍵(memberId, eventId);
  const 待ち = 覚え.取る('taikai:送り待ち') || {};
  待ち[鍵] = x;
  覚え.置く('taikai:送り待ち', 待ち);
  覚え.置く('taikai:手元:' + 鍵, { answers: answers, comment: x.comment, entries: rides, 時刻: x.時刻 });
  触った = false;

  show('success', '受け付けました。' +
    (rides.length ? '出場する競技' + rides.length + '件も一緒に出します。' : '') +
    (ng.length ? '（' + ng.map((d) => d.label).join('、') + 'は欠席で出します）' : '') +
    'いま送っています。届くとここに出ます。');
  送信の列 = 送信の列.then(() => 送る(x, true));
});

// ===== 開いたとき =====

// 名簿と大会の選ぶ欄を組む。選んでいたものはそのまま残す
function 選ぶ欄を組む(data) {
  DATA = data;
  HORSES = data.horses || [];
  $('loading').style.display = 'none';
  $('pickCard').style.display = 'block';
  const 人 = $('memberSelect').value;
  const 大会 = $('eventSelect').value;
  $('memberSelect').innerHTML = '<option value="">選択してください</option>' +
    DATA.members.map((m) => '<option value="' + m.id + '">' + esc(m.name) + (m.grade ? '（' + m.grade + '年）' : '') + '</option>').join('');
  $('eventSelect').innerHTML = '<option value="">選択してください</option>' +
    DATA.events.map((e) => '<option value="' + e.id + '">' + esc(e.name) + '</option>').join('');
  if (人 && DATA.members.some((m) => m.id === 人)) $('memberSelect').value = 人;
  if (大会 && DATA.events.some((e) => e.id === 大会)) $('eventSelect').value = 大会;
}

let 選んだことがある = false;
function 最初に選ぶ() {
  if (選んだことがある) return;
  選んだことがある = true;
  const saved = 覚えた人のID(DATA.members);
  if (saved) {
    $('memberSelect').value = saved;
    名前は聞かない((DATA.members.filter((m) => m.id === saved)[0] || {}).name);
  }
  if (DATA.events.length === 1) $('eventSelect').value = DATA.events[0].id;
  // マイページの「まだ出していないもの」から来たときは、その大会を開く
  const 指定 = URLの('event');
  if (指定 && DATA.events.some((e2) => e2.id === 指定)) $('eventSelect').value = 指定;
}

// 新しい中身を読む。静的サイトでは Cloudflare の写しから、名簿・大会・自分の返事を1回で
async function 新しいのを読む() {
  if (typeof 写しから読む === 'function') {
    try {
      const r = await 写しから読む(覚えた名前());
      return { data: r.data, 返事の表: r.memberId ? { 版: r.版, memberId: r.memberId, 表: r.返事 || {} } : null };
    } catch (e) { /* 写しが読めなければ Apps Script に聞く */ }
  }
  return { data: await call('getMemberPageData'), 返事の表: null };
}

(async () => {
  $('memberSelect').addEventListener('change', onSelectionChange);
  $('eventSelect').addEventListener('change', onSelectionChange);
  送り待ちを送る();

  const 前 = 覚え.取る('taikai:画面');
  if (前 && 前.members && 前.events) {
    選ぶ欄を組む(前);
    最初に選ぶ();
    onSelectionChange();
  }

  let 新;
  try {
    新 = await 新しいのを読む();
  } catch (e) {
    読み込み中 = false;
    if (前) show('warning', '最新の内容を読めませんでした。前回の内容を出しています：' + ((e && e.message) || e));
    else $('loading').innerHTML = '<div class="msg error">読み込みに失敗しました：' + esc((e && e.message) || e) + '</div>';
    return;
  }
  覚え.置く('taikai:画面', 新.data);
  返事の表 = 新.返事の表;
  読み込み中 = false;

  const 同じ = 前 && JSON.stringify(前) === JSON.stringify(新.data);
  if (!同じ) {
    選ぶ欄を組む(新.data);
    最初に選ぶ();
  }
  if (!前 || !触った) {
    onSelectionChange();   // 大会の日や自分の返事が変わっていれば出し直す
  } else if (!同じ) {
    // 触っている最中なら、入れたぶんは残して日の並びだけ新しくする
    const ev = DATA.events.filter((e) => e.id === $('eventSelect').value)[0];
    if (ev) { DAYS = ev.days || []; renderDays(); }
  }
})();
</script>
<script>
/*
  入口（マイページ）へ戻る道を2つ用意する。どちらも静的サイトだけのもの。
    1. 見出し帯の「← マイページ」…… いつでも左上に見えている
    2. 出し終わったときのボタン …… 送信できた知らせの下に足す

  2は、知らせを出すところが画面ごとにバラバラ（show() だったり innerHTML だったり）なので、
  **出てきた「成功の知らせ」を見つけて足す**形にしてある。そのぶん画面側は触らずに済む。
*/
(function () {
  let 戻り先 = 'index.html';
  try {
    const 立場 = localStorage.getItem('role');
    if (立場 && 立場 !== 'links') 戻り先 = 'index.html?role=' + encodeURIComponent(立場);
  } catch (e) { /* 保存できない設定でも、部員用の入口には戻れる */ }
  document.querySelectorAll('a.backhome').forEach((a) => { a.href = 戻り先; });

  // 「前回の回答を読み込みました」のような成功の知らせもあるので、**出し終わった知らせだけ**に付ける
  const 出し終わった = /(送信しました|出しました|申し込みました|受け付けました|登録しました|保存しました)/;

  const 足す = (el) => {
    if (!el || el.dataset.home === '1' || !出し終わった.test(el.textContent || '')) return;
    el.dataset.home = '1';
    // マイページが、サーバの返事を待たずに「まだ出していないもの」から消せるようにしておく
    try {
      localStorage.setItem('mypage:出したところ', JSON.stringify({
        url: location.pathname.split('/').pop(), 時刻: Date.now(),
      }));
    } catch (e) { /* 保存できない設定なら、次に読んだときに正しくなる */ }
    const a = document.createElement('a');
    a.className = 'donehome';
    a.href = 戻り先;
    a.textContent = 'マイページに戻る';
    el.insertAdjacentElement('afterend', a);
  };
  const 見る = (根) => {
    if (!根 || 根.querySelectorAll === undefined) return;
    if (根.classList && 根.classList.contains('msg') && 根.classList.contains('success')) 足す(根);
    根.querySelectorAll('.msg.success').forEach(足す);
  };
  new MutationObserver((記録) => {
    記録.forEach((m) => m.addedNodes.forEach(見る));
  }).observe(document.body, { childList: true, subtree: true });
  見る(document.body);
})();
</script>
</body>
</html>
