<!--
  人員表の見た目（2026-09-15 に作り直した）。

  土台は当番・手入れの style.html と同じ（色・文字・余白・形・フォーカスリング）。
  決まりは 当番・手入れシステム_GAS/design.md。その上に立つのは デジタル庁デザインシステム（DADS）だけ。
    ・本文16px以上（人員表のマスだけは表計算と同じ密度にするため例外）
    ・文字と背景は4.5:1以上、押せるものの枠は3:1以上
    ・フォーカスは「黄色＋黒」の二重リング。どの部品でも消さない
    ・押せるものの当たり判定は44px以上（マウスで使う人員表のマスの中だけは例外）
    ・色だけで意味を伝えない

  2026-09-15、「WebアプリのUIデザインを洗練させるための7つのヒント」（NRIネットコム）に沿って足したもの。
  ユーザーが特に3と7を挙げた。
    3. ボタンを多用しない … 行ごとの「編集・削除」はアイコンボタンにして、マウスを乗せたときだけ出す。
       使う回数が少ない操作は「⋯」のメニューへ。人員表のマスは右クリックのメニューで触れる。
       ただしキーボードで来たとき（:focus-within）と、マウスの無い端末では常に出す（DADS：隠れて押せない状態を作らない）
    7. インタラクション … 押すと沈む、選んだものに✓、保存したところが一瞬光る、メニューと保存の帯がふわっと出る。
       動かすのは transform と opacity だけ。動きを減らす設定では止める。
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&family=Geist+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root {
  /* ===== 色（当番・手入れと同じ。色相は 262 に寄せる） ===== */
  --paper:        oklch(97.2% 0.006 262);
  --paper-2:      oklch(99.2% 0.003 262);
  --paper-3:      oklch(94.5% 0.010 262);
  --paper-sunken: oklch(92.5% 0.008 262);

  --ink:          oklch(21%   0.014 262);
  --muted:        oklch(46%   0.022 262);

  --rule:         oklch(88%   0.012 262);
  --rule-strong:  oklch(62%   0.030 262);

  --accent:       oklch(48%   0.150 262);
  --accent-dark:  oklch(40%   0.150 262);
  --accent-soft:  oklch(95.5% 0.021 262);
  --care:         oklch(45%   0.095 165);
  --care-soft:    oklch(95.5% 0.026 165);

  --danger:       oklch(50%   0.190 27);
  --danger-dark:  oklch(42%   0.173 27);
  --danger-soft:  oklch(96%   0.019 27);
  --warning:      oklch(48%   0.105 70);
  --warning-soft: oklch(96%   0.030 80);
  --success:      var(--care);
  --success-soft: var(--care-soft);

  /* 出場する人の馬名。マニュアルと書き出しの Excel と同じ赤 */
  --rider:        #c00000;

  --focus-inner: oklch(87% 0.170 100);
  --focus-outer: #000000;

  /* ===== 余白 ===== */
  --space-3xs: 0.125rem;  --space-2xs: 0.25rem;  --space-xs: 0.5rem;
  --space-sm:  0.75rem;   --space-md:  1rem;     --space-lg: 1.5rem;
  --space-xl:  2.5rem;    --space-2xl: 4rem;

  /* ===== 文字 ===== */
  --text-xs:   0.875rem;
  --text-sm:   0.9375rem;
  --text-base: 1rem;
  --text-md:   1.25rem;
  --text-lg:   1.5625rem;

  --font-body: "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", sans-serif;
  --font-num:  "Geist Mono", ui-monospace, SFMono-Regular, Consolas, monospace;

  /* ===== 動き ===== */
  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
  --dur-micro: 120ms;  --dur-short: 220ms;  --dur-long: 420ms;

  /* ===== 形 ===== */
  --radius-card:  12px;
  --radius-input: 8px;
  --radius-pill:  999px;
  --shadow-card: 0 1px 2px oklch(21% 0.014 262 / 0.05);
  --shadow-lift: 0 8px 24px -10px oklch(48% 0.150 262 / 0.28);

  --z-base: 1; --z-raised: 10; --z-sticky: 200; --z-modal: 400; --z-toast: 500;
  --tap: 44px;

  /* 前の名前。画面の style="" から呼ばれているので残す */
  --bg: var(--paper);  --card: var(--paper-2);  --text: var(--ink);
  --primary: var(--accent);  --primary-dark: var(--accent-dark);
  --border: var(--rule);
}

* { box-sizing: border-box; }
html, body { overflow-x: clip; }

body {
  margin: 0;
  font-family: var(--font-body);
  background: var(--paper);
  color: var(--ink);
  font-size: var(--text-base);
  line-height: 1.7;
}

/* ===== フォーカス（DADS の黄＋黒。動かさない） ===== */
:focus-visible {
  outline: 3px solid var(--focus-inner);
  outline-offset: 0;
  box-shadow: 0 0 0 6px var(--focus-outer);
  border-radius: 2px;
  position: relative;
  z-index: var(--z-raised);
  transition: none;
}
:focus { outline: 3px solid var(--focus-inner); box-shadow: 0 0 0 6px var(--focus-outer); }
:focus:not(:focus-visible) { outline: none; box-shadow: none; }

header.appbar {
  background: var(--accent);
  color: #fff;
  padding: var(--space-md);
  font-size: var(--text-md);
  font-weight: 700;
  line-height: 1.35;
  letter-spacing: -0.01em;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: var(--space-sm);
}
header.appbar a {
  color: #fff; font-size: var(--text-sm); font-weight: 400; cursor: pointer;
  min-height: var(--tap); display: inline-flex; align-items: center;
  white-space: nowrap; text-decoration: underline; text-underline-offset: 3px;
}

main { max-width: 760px; margin: 0 auto; padding: var(--space-md); }
main.wide { max-width: 1400px; }

.card {
  background: var(--paper-2);
  border: 1px solid var(--rule);
  border-radius: var(--radius-card);
  padding: var(--space-lg);
  margin-bottom: var(--space-md);
  box-shadow: var(--shadow-card);
}

h1, h2, h3 { overflow-wrap: anywhere; min-width: 0; }
h1 { font-size: var(--text-lg); line-height: 1.3; letter-spacing: -0.02em; margin: 0 0 var(--space-sm); }
h2 { font-size: var(--text-md); line-height: 1.35; letter-spacing: -0.015em; margin: 0 0 var(--space-xs); }
h3 { font-size: 1.0625rem; line-height: 1.4; margin: 0 0 var(--space-xs); }

.num, .summary-grid .stat b {
  font-family: var(--font-num);
  font-variant-numeric: tabular-nums;
}

label { display: block; font-weight: 700; margin: var(--space-md) 0 var(--space-2xs); font-size: var(--text-base); }
label.inline {
  display: inline-flex; align-items: center; gap: var(--space-xs); font-weight: 400;
  margin: 0 var(--space-sm) 0 0; font-size: var(--text-base); min-height: 36px; cursor: pointer;
}

select, input[type=text], input[type=number], input[type=password], input[type=date], textarea {
  width: 100%; padding: 10px var(--space-sm);
  border: 1px solid var(--rule-strong); border-radius: var(--radius-input);
  font-size: var(--text-base); background: var(--paper-2); color: var(--ink);
  font-family: inherit; min-height: var(--tap);
  transition: border-color var(--dur-micro) var(--ease-out);
}
input[type=number] { font-family: var(--font-num); font-variant-numeric: tabular-nums; }
select:hover, input:hover, textarea:hover { border-color: var(--accent); }
textarea { min-height: 88px; resize: vertical; line-height: 1.7; }
input[type=checkbox] { width: 20px; height: 20px; margin: 0; accent-color: var(--accent); }

.row { display: flex; gap: var(--space-sm); flex-wrap: wrap; align-items: flex-end; }
.row > * { flex: 1; min-width: 140px; }
.row.tight > * { flex: 0 0 auto; min-width: 0; }

.checkbox-list, .radio-list { display: flex; flex-wrap: wrap; gap: var(--space-xs); margin-top: var(--space-xs); }

/* ===== 選ぶ札（行ける／行けない） =====
   選ぶと✓が付く（色だけで伝えない）。押している間は沈み、選んだ瞬間に少し膨らんで戻る。 */
.chip {
  border: 1px solid var(--rule-strong); border-radius: var(--radius-pill);
  padding: 10px var(--space-lg); font-size: var(--text-base); cursor: pointer; user-select: none;
  background: var(--paper-2); color: var(--ink); min-height: var(--tap); min-width: 0;
  display: inline-flex; align-items: center; gap: var(--space-2xs); font-weight: 400; white-space: nowrap;
  transition: transform var(--dur-micro) var(--ease-out), background-color var(--dur-micro) var(--ease-out);
}
.chip:hover { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-dark); }
.chip.selected, .chip.selected:hover { background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 700; }
.chip.selected::before { content: "✓"; font-weight: 700; }
.chip.selected.no-chip, .chip.selected.no-chip:hover { background: var(--danger); border-color: var(--danger); }
.chip.just { animation: pick var(--dur-short) var(--ease-out); }
.chip:active { transform: translateY(1px); }
@keyframes pick { from { transform: scale(0.94); } to { transform: none; } }

/* ===== ボタン ===== */
button {
  background: var(--accent); color: #fff; border: 1px solid var(--accent);
  border-radius: var(--radius-input);
  padding: var(--space-sm) var(--space-lg); font-size: var(--text-base); font-weight: 700;
  cursor: pointer; min-height: 48px; font-family: inherit; line-height: 1.4;
  white-space: nowrap;
  display: inline-flex; align-items: center; justify-content: center; gap: var(--space-xs);
  transition: background-color var(--dur-micro) var(--ease-out), transform var(--dur-micro) var(--ease-out);
}
button:hover { background: var(--accent-dark); border-color: var(--accent-dark); }
button:active { transform: translateY(1px); }
button.secondary { background: var(--paper-2); color: var(--accent); border-color: var(--accent); }
button.secondary:hover { background: var(--accent-soft); }
button.danger { background: var(--danger); border-color: var(--danger); }
button.danger:hover { background: var(--danger-dark); border-color: var(--danger-dark); }
button.small { padding: var(--space-2xs) 14px; font-size: var(--text-sm); min-height: 36px; }
button:disabled { opacity: .55; cursor: not-allowed; transform: none; }
button svg, summary svg { width: 20px; height: 20px; flex: 0 0 auto; }

/* ===== アイコンボタン（ヒント3） =====
   文字のボタンを並べる代わりに使う。アイコンだけなので、必ず aria-label と title を付ける
   （読み上げと、マウスを乗せたときの説明のため）。 */
.icon-btn {
  display: inline-flex; align-items: center; justify-content: center;
  width: 40px; height: 40px; min-width: 40px; min-height: 40px; padding: 0; margin: 0;
  background: transparent; color: var(--muted); border: 1px solid transparent;
  border-radius: var(--radius-input); cursor: pointer; font-weight: 400;
}
.icon-btn:hover { background: var(--accent-soft); color: var(--accent-dark); border-color: var(--accent); }
.icon-btn.danger { background: transparent; color: var(--danger); border-color: transparent; }
.icon-btn.danger:hover { background: var(--danger-soft); color: var(--danger-dark); border-color: var(--danger); }
.icon-btn.tiny { width: 28px; height: 28px; min-width: 28px; min-height: 28px; }
.icon-btn.tiny svg { width: 16px; height: 16px; }
/* 押してある状態（固定している、など）。色に加えて枠でも分かる */
.icon-btn[aria-pressed="true"] { background: var(--warning-soft); color: var(--warning); border-color: var(--warning); }
/* ⋯ のボタン。隣の主ボタンと高さをそろえ、押せるものとして枠を出す */
.icon-btn.menu-btn { width: 48px; height: 48px; min-width: 48px; min-height: 48px; color: var(--ink); border-color: var(--rule-strong); background: var(--paper-2); }
@media (pointer: coarse) {
  .icon-btn, .icon-btn.tiny { width: var(--tap); height: var(--tap); min-width: var(--tap); min-height: var(--tap); }
}

/* 行の操作。マウスを乗せた行・キーボードで入った行だけに出す。
   マウスの無い端末（スマホ）では乗せられないので、いつも出しておく。 */
.row-actions { display: inline-flex; align-items: center; gap: var(--space-3xs); flex: 0 0 auto; }
@media (hover: hover) and (pointer: fine) {
  .row-actions { opacity: 0; transition: opacity var(--dur-short) var(--ease-out); }
  .is-row:hover .row-actions, .is-row:focus-within .row-actions,
  .pill:hover .row-actions, .pill:focus-within .row-actions { opacity: 1; }
}

/* ===== メニュー（ヒント3：⋯ とマスの右クリック） =====
   ⋯ は <details> で作る。キーボードでも Enter で開け、何もしなくても読み上げに「開いている」が伝わる。 */
details.menu { position: relative; display: inline-block; }
details.menu > summary { list-style: none; }
details.menu > summary::-webkit-details-marker { display: none; }
details.menu[open] > summary { background: var(--accent-soft); color: var(--accent-dark); border-color: var(--accent); }
.menu-list {
  position: absolute; right: 0; top: calc(100% + var(--space-2xs)); z-index: var(--z-modal);
  min-width: 240px; padding: var(--space-2xs);
  background: var(--paper-2); border: 1px solid var(--rule-strong); border-radius: var(--radius-input);
  box-shadow: var(--shadow-lift);
  display: flex; flex-direction: column; gap: var(--space-3xs);
  transform-origin: top right;
  animation: menu-in var(--dur-short) var(--ease-out);
}
.menu-list.ctx { position: fixed; right: auto; top: auto; transform-origin: top left; }
.menu-list[hidden] { display: none; }
.menu-sep { height: 1px; background: var(--rule); margin: var(--space-2xs) 0; }
.menu-item {
  display: flex; align-items: center; justify-content: flex-start; gap: var(--space-sm);
  width: 100%; min-height: var(--tap); padding: var(--space-xs) var(--space-sm);
  background: transparent; color: var(--ink); border: 0; border-radius: 6px;
  font-weight: 400; font-size: var(--text-base); text-align: left;
}
.menu-item svg { color: var(--muted); }
.menu-item:hover, .menu-item:focus-visible { background: var(--accent-soft); color: var(--accent-dark); }
.menu-item:hover svg { color: var(--accent-dark); }
/* 危ない項目は赤い文字だけ。button.danger の赤い塗りが残ると、赤地に赤文字で読めなくなる */
.menu-item.danger { color: var(--danger); background: transparent; border-color: transparent; }
.menu-item.danger svg { color: var(--danger); }
.menu-item.danger:hover { background: var(--danger-soft); color: var(--danger-dark); }
.menu-item .kbd { margin-left: auto; padding-left: var(--space-md); font-family: var(--font-num); font-size: var(--text-xs); color: var(--muted); }
@keyframes menu-in { from { opacity: 0; transform: translateY(-4px) scale(0.98); } to { opacity: 1; transform: none; } }

/* ===== 知らせ ===== 出るときに少しだけ下りてくる（ヒント7） */
.msg {
  padding: var(--space-sm) 14px; border-radius: var(--radius-input);
  margin: var(--space-sm) 0; font-size: var(--text-base); line-height: 1.7;
  animation: msg-in var(--dur-short) var(--ease-out);
}
.msg.success { background: var(--care-soft); color: var(--care); border: 1px solid var(--care); border-left-width: 4px; }
.msg.error   { background: var(--danger-soft); color: var(--danger); border: 1px solid var(--danger); border-left-width: 4px; }
.msg.warning { background: var(--warning-soft); color: var(--warning); border: 1px solid var(--warning); border-left-width: 4px; }
@keyframes msg-in { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }

/* 保存したところが一瞬光る（ヒント7）。上に重ねた薄い緑の opacity だけを動かす */
.flash { position: relative; }
.flash::before {
  content: ""; position: absolute; inset: 0; pointer-events: none; border-radius: inherit;
  background: var(--care); opacity: 0; animation: flash 900ms var(--ease-out);
}
@keyframes flash { from { opacity: 0.28; } to { opacity: 0; } }

table { width: 100%; border-collapse: collapse; font-size: var(--text-base); }
th, td { border: 1px solid var(--rule); padding: 8px 10px; text-align: left; }
th { background: var(--paper-3); }

.muted { color: var(--muted); font-size: var(--text-sm); }
.hint { color: var(--muted); font-size: var(--text-sm); margin: var(--space-2xs) 0 0; line-height: 1.7; }

.list-item {
  display: flex; justify-content: space-between; align-items: center; gap: var(--space-sm);
  padding: var(--space-xs) 0; border-bottom: 1px solid var(--rule); flex-wrap: wrap;
}
.list-item:last-child { border-bottom: none; }
/* 操作できる行は、乗せると地の色が変わる（ヒント7：どの行を触るのかが分かる） */
.list-item.is-row {
  margin: 0 calc(var(--space-sm) * -1); padding-left: var(--space-sm); padding-right: var(--space-2xs);
  border-radius: var(--radius-input);
  transition: background-color var(--dur-micro) var(--ease-out);
}
.list-item.is-row:hover, .list-item.is-row:focus-within { background: var(--paper-3); }

/* ===== タブ ===== 選んでいるタブは塗り＋下の太線（色だけで伝えない） */
.tabs { display: flex; gap: var(--space-xs); margin-bottom: var(--space-md); flex-wrap: wrap; }
.tabs button { background: var(--paper-2); color: var(--ink); border: 1px solid var(--rule-strong); border-radius: var(--radius-pill); }
.tabs button:hover { background: var(--accent-soft); color: var(--accent-dark); border-color: var(--accent); }
.tabs button.active { background: var(--accent); color: #fff; border-color: var(--accent); box-shadow: inset 0 -3px 0 var(--accent-dark); }
section[id^="tab-"] { animation: msg-in var(--dur-short) var(--ease-out); }

/* 使う回数の少ない欄は、見出しだけ出して畳んでおく（ヒント3：最初に見えるボタンを減らす） */
details.fold { border: 1px solid var(--rule); border-radius: var(--radius-card); background: var(--paper-2); margin-bottom: var(--space-md); box-shadow: var(--shadow-card); }
details.fold > summary {
  cursor: pointer; padding: var(--space-sm) var(--space-lg); font-weight: 700; font-size: 1.0625rem;
  min-height: 52px; display: flex; align-items: center; gap: var(--space-xs); list-style: none;
  border-radius: var(--radius-card);
  transition: background-color var(--dur-micro) var(--ease-out);
}
details.fold > summary::-webkit-details-marker { display: none; }
details.fold > summary svg { color: var(--accent); transition: transform var(--dur-short) var(--ease-out); }
details.fold[open] > summary svg { transform: rotate(90deg); }
details.fold > summary:hover { background: var(--accent-soft); }
details.fold > summary .muted { font-weight: 400; margin-left: var(--space-2xs); }
details.fold[open] > summary { border-bottom: 1px solid var(--rule); border-radius: var(--radius-card) var(--radius-card) 0 0; }
.fold-body { padding: var(--space-xs) var(--space-lg) var(--space-lg); }

.post-tag { display: inline-block; border-radius: 6px; padding: 0 8px; font-size: var(--text-xs); font-weight: 700; background: var(--accent-soft); color: var(--accent-dark); line-height: 1.6; }
.post-運営 { background: #eff6ff; color: #1d4ed8; }
.post-箱番長 { background: #f0fdf4; color: #15803d; }
.post-馬匹 { background: #fef3c7; color: #92400e; }
.post-会計 { background: #fae8ff; color: #a21caf; }

.role-card { border: 1px solid var(--rule); border-radius: var(--radius-input); padding: var(--space-sm); margin-bottom: var(--space-xs); background: var(--paper-2); }

/* 大会設定の「1日ぶん」のまとまり */
.day-block { border-left: 6px solid var(--accent); background: var(--paper) !important; box-shadow: none; }
.day-heading { font-size: var(--text-md); color: var(--accent-dark); border-bottom: 1px solid var(--rule); padding-bottom: var(--space-xs); margin-bottom: var(--space-sm); }
/* 行の中の小さな「消す」（×） */
.comp-row, .job-row .row { align-items: center; }

.pick { display: flex; flex-direction: column; gap: var(--space-2xs); min-width: 0; }
.pick > select, .pick > input { width: 100%; }
.pick > input.pick-other { border-color: var(--accent); }

/* ===== 人員表のマトリクス =====
   ここだけは表計算ソフトと同じ密度（12px）。書き出す Excel と見比べながら直すため。 */
.matrix-wrap { overflow-x: auto; border: 1px solid var(--rule-strong); border-radius: var(--radius-input); background: var(--paper-2); max-height: 70vh; overflow-y: auto; }
table.matrix { border-collapse: separate; border-spacing: 0; font-size: 12px; line-height: 1.5; width: auto; min-width: 100%; }
table.matrix th, table.matrix td { border: 0; border-right: 1px solid var(--rule); border-bottom: 1px solid var(--rule); padding: 2px 4px; white-space: nowrap; }
table.matrix thead th { background: var(--paper-3); position: sticky; top: 0; z-index: 2; text-align: center; }
table.matrix thead tr.days th { background: var(--paper-sunken); top: 0; height: 27px; }
table.matrix thead tr.comps th { top: 27px; }
table.matrix th.rowhead, table.matrix td.rowhead {
  position: sticky; left: 0; z-index: 3; background: var(--paper-2); text-align: left;
  border-right: 2px solid var(--rule-strong); min-width: 110px;
}
table.matrix td.rowhead .who { display: flex; align-items: center; gap: var(--space-2xs); font-size: 13px; font-weight: 700; }
