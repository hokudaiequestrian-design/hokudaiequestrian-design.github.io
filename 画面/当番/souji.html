<!DOCTYPE html>
<html lang="ja">
<head>
<base target="_top">
<?!= include('style') ?>
<style>
/*
  掃除当番（2026-10-04 ユーザーの指示）。副将だけが使う画面で、部員には見せない。
  日ごとに3人。名前を押すと「来なかった」＝次の日の同じ枠の人と入れ替える。
  同じ日の休み（了承待ちも）・大会・祝日を並べて見せ、入れ替えるかどうかは副将が決める。
  休みの画面と同じく帯は ink の黒（副将がまとめる画面）。
*/
header.appbar.souji { background: var(--ink); }

.range-head { display: flex; align-items: center; gap: var(--space-sm); flex-wrap: wrap; }
.range-head .now { font-size: var(--text-md); font-weight: 700; font-family: var(--font-num); }

/* 1日1行。左に日付、右に3人と、その日の休み・大会 */
.sday { display: grid; grid-template-columns: 7.5rem 1fr; gap: var(--space-xs) var(--space-sm); padding: var(--space-sm) 0; border-top: 1px solid var(--rule); }
.sday:first-child { border-top: none; }
.sday.today { background: var(--accent-soft); border-left: 4px solid var(--accent); padding-left: var(--space-xs); }
.sday.past .sdate { color: var(--muted); }
.sdate { font-family: var(--font-num); font-weight: 700; font-size: var(--text-md); line-height: 1.3; }
.sdate .w { font-size: var(--text-sm); margin-left: var(--space-3xs); }
.sdate .w.sat { color: var(--accent); }
.sdate .w.sun { color: var(--danger); }
.sdate .tlabel { display: block; font-size: var(--text-xs); color: var(--accent-dark); font-family: var(--font-body); }
.sbody { min-width: 0; }
.slots { display: flex; flex-wrap: wrap; gap: var(--space-xs); align-items: center; }
.slot-btn {
  min-height: var(--tap); padding: 0 var(--space-sm); border-radius: var(--radius-pill);
  border: 2px solid var(--rule-strong); background: var(--paper-2); color: var(--ink);
  font: inherit; font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; gap: var(--space-2xs);
}
.slot-btn:hover { background: var(--paper-3); }
.slot-btn .n { font-family: var(--font-num); font-size: var(--text-xs); color: var(--muted); font-weight: 700; }
/* その人がこの日に休み・バイトを出している：枠を点線にして「休」の札（色だけで伝えない） */
.slot-btn.off { border-style: dashed; border-color: var(--warning); background: var(--warning-soft); }
.slot-btn .offtag { font-size: var(--text-xs); color: var(--warning); border: 1px solid var(--warning); border-radius: 4px; padding: 0 3px; }
.slot-empty { min-height: var(--tap); display: inline-flex; align-items: center; padding: 0 var(--space-sm); border: 2px dashed var(--rule); border-radius: var(--radius-pill); color: var(--muted); }
.slot-btn.moved { animation: moved var(--dur-long) var(--ease-out); }
@keyframes moved { from { box-shadow: 0 0 0 6px var(--focus-inner); } to { box-shadow: 0 0 0 0 transparent; } }
@media (prefers-reduced-motion: reduce) { .slot-btn.moved { animation: none; outline: 3px solid var(--focus-inner); } }

.sinfo { margin-top: var(--space-2xs); font-size: var(--text-sm); color: var(--muted); display: flex; flex-wrap: wrap; gap: var(--space-2xs) var(--space-sm); }
.sinfo .lv { white-space: nowrap; }
.sinfo .lv .m { font-weight: 700; font-family: var(--font-num); margin-right: 2px; color: var(--ink); }
.sinfo .lv.wait { text-decoration: underline dashed; }
.badge { display: inline-block; min-width: 1.5em; padding: 0 4px; border-radius: 4px; font-size: var(--text-xs); font-weight: 700; line-height: 1.6; text-align: center; color: #fff; }
.badge.b-holiday { background: var(--danger); }
.badge.b-meet { background: var(--care-dark); }
.meet-name { color: var(--care-dark); font-weight: 700; }

/* 手で直す欄（その日の行の下に開く） */
.editor { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: var(--space-xs); align-items: flex-end; padding: var(--space-sm); background: var(--paper-3); border-radius: var(--radius-input); }
.editor label { font-size: var(--text-sm); margin: 0; }
.editor select { min-width: 9rem; }
.edit-btn { margin-left: auto; }

.undo-row { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-sm); }

@media (max-width: 560px) {
  .sday { grid-template-columns: 1fr; }
  .sdate .tlabel { display: inline; margin-left: var(--space-xs); }
}
</style>
</head>
<body>
<div id="busy">通信中です…</div>
<header class="appbar souji"><span>掃除当番（副将）</span></header>

<main class="wide">
  <!-- 副将のログインは入口でだけ。鍵が無い・切れたときは入口への案内をここに出す -->
  <div class="card" id="loginCard" style="display:none;"></div>
  <div id="loading" class="card"><p class="muted" style="margin:0;">読み込んでいます…</p></div>

  <div id="app" style="display:none;">
    <div class="card">
      <p class="hint" style="margin-top:0;">
        1日<b>3人</b>。当番に入る部員を<b>名簿の順に3人ずつ</b>毎日に並べます。部員には見せません。<br>
        <b>来なかった人の名前を押すと</b>、次の日の同じ枠の人と入れ替わります（その人が今日に出てきて、来なかった人は次の日へ）。
        間違えたら<b>同じところをもう一度押す</b>か、下に出る「元に戻す」で戻ります。<br>
        <span class="badge b-holiday">祝</span> 祝日　<span class="badge b-meet">大</span> 大会　点線の名前は、その日に休み・バイトを出している人です（自動では外しません）。
      </p>

      <details class="fold" id="genFold">
        <summary>名簿の順に組む</summary>
        <div class="fold-body">
        <div class="row" style="margin-top:var(--space-sm);">
          <div><label for="genFrom">この日から</label><input type="date" id="genFrom"></div>
          <div><label for="genTo">この日まで</label><input type="date" id="genTo"></div>
        </div>
        <p class="hint">前の日までに入っている最後の人の<b>次の人から</b>続けます。この範囲にすでに入っている日は<b>組み直します</b>（範囲の外は変わりません）。</p>
        <div class="row tight"><button type="button" id="genBtn">組む</button></div>
        <div id="genMsg"></div>
        </div>
      </details>
    </div>

    <div class="card">
      <div class="range-head">
        <button type="button" class="icon-btn outline" id="prevRange" aria-label="前の30日" title="前の30日"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M15 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        <span class="now" id="rangeNow"></span>
        <button type="button" class="icon-btn outline" id="nextRange" aria-label="次の30日" title="次の30日"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        <button type="button" class="secondary small" id="todayBtn">今日へ</button>
      </div>
      <div id="msg" aria-live="polite"></div>
      <div id="days"></div>
    </div>
  </div>
</main>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

let TOKEN = '';
let D = null;              // soujiLoadAll の返り
let 見る = { from: '', to: '' };
let 開いている日 = '';      // 手で直す欄を開いている日
let 光らせる枠 = [];        // 入れ替えたあとに光らせる [date, slot]
let busyCount = 0;

function busy(on) {
  busyCount += on ? 1 : -1;
  $('busy').className = busyCount > 0 ? 'on' : '';
}
function call(fn) {
  const args = Array.prototype.slice.call(arguments, 1);
  busy(true);
  return new Promise((resolve, reject) => {
    google.script.run
      .withSuccessHandler((r) => { busy(false); resolve(r); })
      .withFailureHandler((e) => { busy(false); reject(e); })[fn].apply(null, args);
  });
}
function 知らせ(場所, cls, html) {
  $(場所).innerHTML = html ? '<div class="msg ' + cls + '" role="status">' + html + '</div>' : '';
}
const 日付 = (d) => d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2);
const 日から = (key) => new Date(key + 'T00:00:00');
const ずらす = (key, n) => { const d = 日から(key); d.setDate(d.getDate() + n); return 日付(d); };
const 今日 = () => 日付(new Date());
const 曜日名 = ['日', '月', '火', '水', '木', '金', '土'];
const 和風 = (key) => { const d = 日から(key); return (d.getMonth() + 1) + '/' + d.getDate() + '（' + 曜日名[d.getDay()] + '）'; };
const 休みの印 = { '有給休暇': '有', '季節休み': '季', '体調不良': '体' };
const エラー文 = (e) => esc((e && e.message) || e);

// ===== ログイン =====
(async () => {
  const 案内 = (文) => {
    部品.副将の鍵を消す();
    $('loading').style.display = 'none';
    $('app').style.display = 'none';
    $('loginCard').innerHTML = 部品.入口へ(文);
    $('loginCard').style.display = 'block';
  };
  const 鍵 = 部品.副将の鍵();
  if (!鍵) return 案内('');
  TOKEN = 鍵;
  見る.from = ずらす(今日(), -1);   // カレンダーと同じく「きのうから30日」
  見る.to = ずらす(見る.from, 29);
  try {
    D = await call('soujiLoadAll', TOKEN, 見る.from, 見る.to);
    $('loading').style.display = 'none';
    $('app').style.display = 'block';
    組む欄の既定();
    描く();
  } catch (e) {
    案内(/有効期限/.test((e && e.message) || '') ? 'ログインの有効期限が切れました。' : '開けませんでした：' + ((e && e.message) || e) + '。');
  }
})();

async function 読み直す() {
  D = await call('soujiLoadAll', TOKEN, 見る.from, 見る.to);
  描く();
}

// ===== 範囲を動かす =====
async function 範囲を動かす(from) {
  見る.from = from;
  見る.to = ずらす(from, 29);
  開いている日 = '';
  知らせ('msg', '', '');
  try { await 読み直す(); } catch (e) { 知らせ('msg', 'error', '読めませんでした：' + エラー文(e)); }
}
$('prevRange').addEventListener('click', () => 範囲を動かす(ずらす(見る.from, -30)));
$('nextRange').addEventListener('click', () => 範囲を動かす(ずらす(見る.from, 30)));
$('todayBtn').addEventListener('click', () => 範囲を動かす(ずらす(今日(), -1)));

// ===== 描く =====
function 描く() {
  $('rangeNow').textContent = 和風(D.from) + ' 〜 ' + 和風(D.to);
  const 祝日 = Object.assign({}, 部品.祝日(Number(D.from.slice(0, 4))), 部品.祝日(Number(D.to.slice(0, 4))));
  const 名簿 = D.members || [];
  const 今 = D.today || 今日();
  const まだ空 = D.days.every((d) => d.slots.every((s) => !s.memberId));

  let html = '';
  if (まだ空) {
    html += '<p class="muted">この30日にはまだ誰も入っていません。上の「名簿の順に組む」から組んでください。</p>';
  }
  html += D.days.map((d) => {
    const w = 日から(d.date).getDay();
    const 祝 = 祝日[d.date];
    const 枠 = d.slots.map((s, i) => {
      if (!s.memberId) return '<span class="slot-empty">' + (i + 1) + '　空き</span>';
      const 光る = 光らせる枠.some((x) => x[0] === d.date && x[1] === i + 1);
      return '<button type="button" class="slot-btn' + (s.休み ? ' off' : '') + (光る ? ' moved' : '') + '" ' +
        'data-skip="' + d.date + '" data-slot="' + (i + 1) + '" ' +
        'aria-label="' + esc(s.name) + '（' + 和風(d.date) + '・' + (i + 1) + '人目）。押すと来なかったことにして次の日へ回す"' +
        (s.休み ? ' title="この日は「' + esc(s.休み) + '」を出しています"' : '') + '>' +
        '<span class="n">' + (i + 1) + '</span>' + esc(s.name) +
        (s.休み ? '<span class="offtag">休</span>' : '') +
        '</button>';
    }).join('');
    const 情報 = [];
    if (祝) 情報.push('<span><span class="badge b-holiday">祝</span> ' + esc(祝) + '</span>');
    if (d.大会) 情報.push('<span><span class="badge b-meet">大</span> <span class="meet-name">' + esc(d.大会) + '</span></span>');
    d.休み.forEach((l) => {
      const 印 = l.kind === 'バイト' ? 部品.バイトの印(l.label) : (休みの印[l.kind] || '休');
      情報.push('<span class="lv' + (l.state === '申請中' ? ' wait' : '') + '" title="' + esc(l.label || l.kind) + (l.state === '申請中' ? '（了承待ち）' : '') + '">' +
        '<span class="m">' + esc(印) + '</span>' + esc(l.name) + '</span>');
    });
    const 開く = 開いている日 === d.date;
    return '<div class="sday' + (d.date === 今 ? ' today' : '') + (d.date < 今 ? ' past' : '') + '">' +
      '<div class="sdate">' + (日から(d.date).getMonth() + 1) + '/' + 日から(d.date).getDate() +
        '<span class="w' + (w === 6 ? ' sat' : w === 0 || 祝 ? ' sun' : '') + '">' + 曜日名[w] + '</span>' +
        (d.date === 今 ? '<span class="tlabel">今日</span>' : '') + '</div>' +
      '<div class="sbody">' +
        '<div class="slots">' + 枠 +
          部品.アイコンボタン('edit', 和風(d.date) + ' を手で直す', { 'data-edit': d.date }, 'edit-btn') +
        '</div>' +
        (情報.length ? '<div class="sinfo">' + 情報.join('') + '</div>' : '') +
      '</div>' +
      (開く ? 直す欄(d, 名簿) : '') +
      '</div>';
  }).join('');
  $('days').innerHTML = html;
  光らせる枠 = [];
}

function 直す欄(d, 名簿) {
  const 選ぶ = (i) => {
    const 今の = d.slots[i].memberId;
    const 候補 = 名簿.slice();
    // 当番に入れない人や消された人が入っていても、選び直すまでは消えないように残す
    if (今の && !候補.some((m) => m.id === 今の)) 候補.unshift({ id: 今の, name: d.slots[i].name });
    return '<div><label for="ed' + i + '">' + (i + 1) + '人目</label><select id="ed' + i + '">' +
      '<option value="">（空き）</option>' +
      候補.map((m) => '<option value="' + esc(m.id) + '"' + (m.id === 今の ? ' selected' : '') + '>' + esc(m.name) + (m.grade ? '（' + m.grade + '年）' : '') + '</option>').join('') +
      '</select></div>';
  };
  let h = '<div class="editor">';
  for (let i = 0; i < D.人数; i++) h += 選ぶ(i);
  h += '<button type="button" id="edSave">保存</button>' +
    '<button type="button" class="secondary" id="edClear">この日を空にする</button>' +
    '<button type="button" class="secondary" id="edClose">閉じる</button></div>';
  return h;
}

// ===== 押したとき =====
$('days').addEventListener('click', async (e) => {
  const 来ない = e.target.closest('[data-skip]');
  const 直す = e.target.closest('[data-edit]');
  if (来ない) return 来なかった(来ない.dataset.skip, Number(来ない.dataset.slot));
  if (直す) {
    開いている日 = 開いている日 === 直す.dataset.edit ? '' : 直す.dataset.edit;
    描く();
    return;
  }
  if (e.target.id === 'edClose') { 開いている日 = ''; 描く(); return; }
  if (e.target.id === 'edSave' || e.target.id === 'edClear') {
    const 空 = e.target.id === 'edClear';
    if (空 && !confirm(和風(開いている日) + ' の掃除当番を空にします。よろしいですか？')) return;
    const ids = [];
    for (let i = 0; i < D.人数; i++) ids.push(空 ? '' : $('ed' + i).value);
    const 日 = 開いている日;
    try {
      D = await call('soujiSetDay', TOKEN, 日, ids, 見る);
      開いている日 = '';
      描く();
      知らせ('msg', 'success', esc(和風(日)) + (空 ? ' を空にしました。' : ' を直しました。'));
    } catch (err) {
      知らせ('msg', 'error', '保存できませんでした：' + エラー文(err));
    }
  }
});

// 来なかった：次の日の同じ枠の人と入れ替える。もう一度同じ入れ替えをすれば元に戻る
async function 来なかった(date, slot, 戻す) {
  try {
    D = await call('soujiSkip', TOKEN, date, slot, 見る);
    const x = D.入れ替え || {};
    光らせる枠 = [[date, slot], [x.明日, slot]];
    描く();
    if (戻す) {
      知らせ('msg', 'success', '元に戻しました。');
    } else {
      知らせ('msg', 'success',
        '<span class="undo-row"><span><b>' + esc(x.来なかった) + '</b> さんを ' + esc(和風(x.明日)) + ' に回し、<b>' + esc(x.出てきた) + '</b> さんを ' + esc(和風(date)) + ' に入れました。</span>' +
        '<button type="button" class="secondary small" id="undoBtn">' + 部品.アイコン('undo') + '元に戻す</button></span>');
      $('undoBtn').addEventListener('click', () => 来なかった(date, slot, true), { once: true });
    }
  } catch (err) {
    知らせ('msg', 'error', エラー文(err));
  }
}

// ===== 名簿の順に組む =====
function 組む欄の既定() {
  // 組んである最後の日の次（それが過去なら今日）から30日
  const 次 = D.最後の日 ? ずらす(D.最後の日, 1) : 今日();
  const from = 次 < 今日() ? 今日() : 次;
  $('genFrom').value = from;
  $('genTo').value = ずらす(from, 29);
}

$('genBtn').addEventListener('click', async () => {
  const from = $('genFrom').value, to = $('genTo').value;
  if (!from || !to) return 知らせ('genMsg', 'warning', '始まりと終わりの日を入れてください。');
  if (to < from) return 知らせ('genMsg', 'warning', '終わりの日が始まりの日より前になっています。');
  const 入っている = D.最後の日 && D.最後の日 >= from;
  if (入っている && !confirm(和風(from) + '〜' + 和風(to) + ' を組み直します。この範囲で入れ替えたぶんも組み直しになります。よろしいですか？')) return;
  try {
    D = await call('soujiGenerate', TOKEN, from, to, 見る);
    描く();
    組む欄の既定();
    知らせ('genMsg', 'success', esc(和風(from)) + '〜' + esc(和風(to)) + ' を組みました。');
  } catch (err) {
    知らせ('genMsg', 'error', '組めませんでした：' + エラー文(err));
  }
});
</script>
</body>
</html>
