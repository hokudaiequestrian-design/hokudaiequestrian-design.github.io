<!DOCTYPE html>
<html lang="ja">
<head>
<base target="_top">
<?!= include('style') ?>
<style>
/*
  みんなのカレンダー（2026-09-13）。月ごとに見るだけの画面で、タブが2つ。
    カレンダー … 左に部員の名前、横に日付の表。休み（有給・季節休み・バイト）と大会（出る日）を入れる
                 （2026-09-13 ユーザーの指示で「休みカレンダー」から表の形・名前を変えた）
    当番・手入れ予定 … 当番表とチーフが組んだ手入れ表。**当番と手入れは別の表**で、上のボタンで切り替える（2026-09-23 ユーザーの指示）
      当番の表 … 行が日、列が当番（昼当｜夕当｜投げ草）。手入れの表 … 行が日、列が馬。上に自分のこれから
      **月ごとではなく、きのうから30日ぶん**を出す（2026-09-21 ユーザーの指示）。月をまたぐので、かかる月を全部読んで合わせる。
      カレンダーのタブは今までどおり月ごと
      当番は曜日で回すので、期間に開始日・終了日を入れてある期間だけ、その範囲の日に出る（2026-09-21）
  大会がある日は、どちらのタブでも枠の色を少し変える（2026-09-13 ユーザーの指示）。
*/
.cal-head { display: flex; align-items: center; gap: var(--space-sm); flex-wrap: wrap; margin: var(--space-sm) 0; }
.cal-head h2 { margin: 0; font-size: var(--text-md); min-width: 8em; text-align: center; font-variant-numeric: tabular-nums; }
.cal-head .grow { flex: 1 1 auto; }
.cal-filter { display: flex; gap: var(--space-sm); flex-wrap: wrap; align-items: center; margin: 0 0 var(--space-sm); }
.cal-filter select { width: auto; min-width: 10em; }
.cal-filter label.inline { display: inline-flex; align-items: center; gap: var(--space-2xs); min-height: var(--tap); margin: 0; }

/* 大会がある日の色。休みの札（白地に枠）とぶつからない、うすい緑 */
:root { --meet-soft: var(--care-soft); --meet-rule: var(--care); }

/* ----- カレンダー（部員×日付の表） ----- */
.legend { display: flex; flex-wrap: wrap; gap: var(--space-2xs) var(--space-md); font-size: var(--text-sm); color: var(--muted); margin: 0 0 var(--space-sm); }
.legend .sw { display: inline-block; width: 1.1em; height: 1.1em; vertical-align: -0.15em; border: 1px solid var(--meet-rule); background: var(--meet-soft); border-radius: 3px; margin-right: 4px; }
.grid-wrap { overflow: auto; max-height: 75vh; border: 1px solid var(--rule-strong); border-radius: var(--radius-input); background: var(--paper-2); }
table.grid { border-collapse: separate; border-spacing: 0; font-size: var(--text-sm); }
table.grid th, table.grid td { border-right: 1px solid var(--rule); border-bottom: 1px solid var(--rule); padding: 0; text-align: center; }
table.grid thead th { position: sticky; top: 0; z-index: 2; background: var(--paper-sunken); font-weight: 700; min-width: 2.4em; padding: 2px 0; line-height: 1.25; font-variant-numeric: tabular-nums; }
table.grid thead th .w { display: block; font-size: var(--text-xs); font-weight: 400; }
table.grid thead th.sat { color: var(--accent-dark); }
table.grid thead th.sun { color: var(--danger); }
table.grid th.name { position: sticky; left: 0; z-index: 1; background: var(--paper-2); text-align: left; padding: 0 var(--space-xs); white-space: nowrap; font-weight: 400; min-width: 6em; }
table.grid thead th.name { z-index: 3; background: var(--paper-sunken); }
table.grid td { height: 2.2em; min-width: 2.4em; }
table.grid .meet { background: var(--meet-soft); }
table.grid thead th.meet { background: var(--meet-soft); box-shadow: inset 0 -3px 0 var(--meet-rule); }
table.grid .today { box-shadow: inset 2px 0 0 var(--accent), inset -2px 0 0 var(--accent); }
table.grid tr.me th.name { font-weight: 700; background: var(--warning-soft); }
table.grid tr.me td { background-image: linear-gradient(var(--warning-soft), var(--warning-soft)); }
table.grid tr.me td.meet { background-image: none; }
.tag { display: inline-block; min-width: 1.6em; padding: 0 3px; border: 1px solid var(--rule-strong); border-radius: 4px; background: var(--paper-2); font-weight: 700; line-height: 1.5; }
.tag.off { color: var(--warning); border-color: var(--warning); }
.tag.job { color: var(--danger); border-color: var(--danger); }
.tag.meet { color: var(--care-dark); border-color: var(--care); }
.tag.wait { border-style: dashed; font-weight: 400; }
/* 人員表の仕事（2026-09-20）。色は決まっている組み合わせだけを使う（.pill.no / .pill.yes と同じ） */
.tag.entry  { color: var(--danger); border-color: var(--danger); background: var(--danger-soft); }
.tag.helper { color: var(--care); border-color: var(--care); background: var(--care-soft); }
.tag.work   { color: var(--ink); border-color: var(--rule-strong); }
/* 朝手入れ（2026-09-20）。当番・手入れ予定でだけ使う */
.tag.asa    { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }
/*
  ----- 当番・手入れ予定（2026-09-23 ユーザーの指示で作り直し） -----
  前は1日の行の中に「当番の列」と「手入れの段」を同居させていて、手入れの馬と名前が当番の列の下に並んで見え、
  どれが当番でどれが手入れか読み取りにくかった（ユーザー「見にくい」）。
  作り直しの決まり：
    ・**当番と手入れは別の表**。上の「当番｜手入れ」で切り替える（選んだほうを覚える）
    ・どちらも「行＝日、列＝当番／馬」の表。見出し行と日付の列は貼り付いて、下・横へ送っても残る
    ・自分の名前は黄色の札、今日の行は左に青い線、大会の日はうすい緑（カレンダーと同じ）
    ・週の切れ目（月曜の上）は太い線。日曜は赤、土曜は青
*/
.seg { display: inline-flex; border: 1px solid var(--accent); border-radius: var(--radius-pill); overflow: hidden; }
.seg .seg-btn { min-height: var(--tap); padding: 0 var(--space-lg); border: 0; border-radius: 0; background: var(--paper-2); color: var(--accent-dark); font-weight: 700; }
.seg .seg-btn + .seg-btn { border-left: 1px solid var(--accent); }
.seg .seg-btn.on { background: var(--accent); color: #fff; }
.seg .seg-btn:hover:not(.on) { background: var(--accent-soft); }

/* 広い画面：ページごと送る（見出し行は帯の下に貼り付く）。overflow を付けると貼り付く先が枠になってしまうので付けない */
.sched-wrap { max-width: 100%; }
table.sched { border-collapse: separate; border-spacing: 0; font-size: var(--text-sm); width: 100%; table-layout: auto; }
table.sched th, table.sched td { border-right: 1px solid var(--rule); border-bottom: 1px solid var(--rule); padding: var(--space-2xs) var(--space-xs); text-align: left; vertical-align: top; }
table.sched thead th { position: sticky; top: var(--bar-h, 0px); z-index: 2; background: var(--paper-sunken); font-weight: 700; color: var(--accent-dark); white-space: nowrap; }
table.sched.care thead th { color: var(--care-dark); }
table.sched th.d { position: sticky; left: 0; z-index: 1; background: var(--paper-2); width: 3.4em; min-width: 3.4em; text-align: center; padding: var(--space-2xs) 0; border-left: 3px solid transparent; }
table.sched thead th.d { z-index: 3; background: var(--paper-sunken); }
table.sched th.d .n { display: inline-block; min-width: 1.9em; padding: 0.1em 0; border-radius: var(--radius-pill); font-weight: 700; font-size: 1.125rem; font-variant-numeric: tabular-nums; line-height: 1.2; }
table.sched th.d .w { display: block; font-size: var(--text-xs); color: var(--muted); font-weight: 400; }
table.sched th.d .m { display: block; font-size: var(--text-xs); color: var(--muted); font-weight: 700; }
table.sched tr.sat th.d .n, table.sched tr.sat th.d .w { color: var(--accent-dark); }
table.sched tr.sun th.d .n, table.sched tr.sun th.d .w { color: var(--danger); }
table.sched tr.today th.d { border-left-color: var(--accent); }
table.sched tr.today th.d .n { background: var(--accent); color: #fff; }
table.sched tr.today th.d .w { color: var(--accent-dark); font-weight: 700; }
table.sched tr.today td { box-shadow: inset 0 2px 0 var(--accent), inset 0 -2px 0 var(--accent); }
table.sched tr.wk th, table.sched tr.wk td { border-top: 2px solid var(--rule-strong); }
table.sched tr.meet th.d, table.sched tr.meet td { background: var(--meet-soft); }
table.sched .ev { display: block; font-size: var(--text-xs); color: var(--care-dark); font-weight: 700; white-space: nowrap; }
table.sched td { min-width: 4em; }
table.sched td .nm { display: block; width: fit-content; max-width: 100%; line-height: 1.6; }
table.sched td .none { color: var(--rule-strong); }
table.sched td.mine-cell { background: var(--warning-soft); }
.nm { white-space: nowrap; border-radius: 4px; }
.nm.mine { background: var(--warning-soft); outline: 2px solid var(--warning); padding: 0 var(--space-2xs); font-weight: 700; }
.nm .tag { margin-right: var(--space-3xs); font-size: var(--text-xs); }

/* 自分のこれから */
.my-next { margin: 0 0 var(--space-sm); padding: var(--space-xs) var(--space-sm); border-radius: var(--radius-input); background: var(--warning-soft); max-width: 46rem; }
.my-next h3 { margin: 0 0 var(--space-2xs); font-size: var(--text-sm); }
.my-next p { margin: 0; font-size: var(--text-sm); }
.my-next .list { display: flex; flex-wrap: wrap; gap: var(--space-2xs) var(--space-xs); }
.my-next a { display: inline-flex; align-items: center; gap: var(--space-xs); min-height: 36px; padding: 0 var(--space-sm); border: 1px solid var(--warning); border-radius: var(--radius-pill); background: var(--paper-2); color: var(--ink); text-decoration: none; }
.my-next a:hover { background: var(--paper-3); }
.my-next a b { font-variant-numeric: tabular-nums; }
.my-next a .k.t { color: var(--accent-dark); font-weight: 700; }
.my-next a .k.c { color: var(--care-dark); font-weight: 700; }

@media (max-width: 30rem) {
  .cal-head h2 { min-width: 0; flex: 1 1 auto; }
  .cal-head .grow { display: none; }
  /* 狭い画面：表を枠の中で縦横に送る（枠の中なら見出し行と日付の列の両方が貼り付く）。列は少し詰める */
  .sched-wrap { overflow: auto; max-height: calc(100vh - var(--bar-h, 0px) - 0.5rem); }
  table.sched { width: auto; min-width: 100%; }
  table.sched thead th { top: 0; }
  table.sched th, table.sched td { padding: var(--space-3xs) var(--space-2xs); }
  table.sched td { min-width: 4.5em; }
  .seg .seg-btn { padding: 0 var(--space-md); }
}

.week-wrap { overflow-x: auto; }
table.week { border-collapse: collapse; min-width: 36rem; width: 100%; font-size: var(--text-sm); }
table.week th, table.week td { border: 1px solid var(--rule); padding: var(--space-2xs) var(--space-xs); text-align: left; vertical-align: top; }
table.week th { background: var(--paper-sunken); }
</style>
</head>
<body>
<div id="busy">通信中です…</div>
<header class="appbar"><span>カレンダー</span></header>

<main class="wide">
  <div class="card">
    <div class="tabs" role="tablist" aria-label="見るもの">
      <button type="button" data-tab="cal" class="active" role="tab" aria-selected="true">カレンダー</button>
      <button type="button" data-tab="teire" role="tab" aria-selected="false">当番・手入れ予定</button>
    </div>

    <div class="cal-head">
      <button type="button" class="icon-btn outline" id="prevMonth" aria-label="前の月" title="前の月"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M15 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <h2 id="monthTitle" aria-live="polite"></h2>
      <button type="button" class="icon-btn outline" id="nextMonth" aria-label="次の月" title="次の月"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <span class="grow"></span>
      <button type="button" class="secondary small" id="thisMonth">今月</button>
    </div>

    <div class="cal-filter" id="teireFilter" style="display:none;">
      <!-- 当番と手入れは別の表（2026-09-23 ユーザーの指示） -->
      <div class="seg" role="group" aria-label="当番の表か手入れの表か">
        <button type="button" class="seg-btn on" data-view="duty" aria-pressed="true">当番</button>
        <button type="button" class="seg-btn" data-view="care" aria-pressed="false">手入れ</button>
      </div>
      <span class="chip small selected" role="button" tabindex="0" data-who="all" aria-pressed="true">みんな</span>
      <span class="chip small" role="button" tabindex="0" data-who="me" aria-pressed="false">自分だけ</span>
      <label for="horseSelect" class="inline">馬
        <select id="horseSelect"><option value="">すべての馬</option></select>
      </label>
    </div>
    <p class="legend" id="legend"></p>

    <div id="msg" role="status" aria-live="polite"></div>
    <div id="mine"></div>
    <div id="view"></div>
  </div>

  <div class="card" id="weeklyCard" style="display:none;">
    <h2>毎週決まっている手入れ</h2>
    <p class="hint">曜日で組んだ手入れ表です。日付が無いので、上の手入れ予定には出ません。</p>
    <div id="weekly"></div>
  </div>
</main>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let busyCount = 0;

function busy(on) {
  busyCount += on ? 1 : -1;
  $('busy').className = busyCount > 0 ? 'on' : '';
}

// google.script.run をPromiseで扱えるようにする
function call(fn) {
  const args = Array.prototype.slice.call(arguments, 1);
  busy(true);
  return new Promise((resolve, reject) => {
    google.script.run
      .withSuccessHandler((r) => { busy(false); resolve(r); })
      .withFailureHandler((e) => { busy(false); reject(e); })[fn].apply(null, args);
  });
}

const 曜日名 = ['日', '月', '火', '水', '木', '金', '土'];
// 表のマスは狭いので1文字の札にする（凡例と、マスの title で正式な名前を出す）
const 札 = { 有給休暇: '有', 季節休み: '季', バイト: 'バ' };
const 覚え = {
  取る(k) { try { const s = localStorage.getItem(k); return s ? JSON.parse(s) : null; } catch (e) { return null; } },
  置く(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* いっぱいなら諦める */ } },
};
const 私の名前 = () => { try { return localStorage.getItem('me') || ''; } catch (e) { return ''; } };
function URLの(名) { try { return new URLSearchParams(location.search).get(名) || ''; } catch (e) { return ''; } }

function 今月() { return new Date(Date.now() + 9 * 3600 * 1000).toISOString().slice(0, 7); }
function 月をずらす(月, n) {
  const p = 月.split('-').map(Number);
  return new Date(Date.UTC(p[0], p[1] - 1 + n, 1)).toISOString().slice(0, 7);
}

function 今日の日付() { return new Date(Date.now() + 9 * 3600 * 1000).toISOString().slice(0, 10); }
function 日をずらす(日, n) {
  const p = 日.split('-').map(Number);
  return new Date(Date.UTC(p[0], p[1] - 1, p[2] + n)).toISOString().slice(0, 10);
}

/*
  当番・手入れ予定に出す範囲（2026-09-21 ユーザーの指示）：**きのうから30日ぶん**。
  きのうを入れるのは、きのうの担当をあとから確かめたいことがあるため。
  ＜＞ で30日ずつ前後に送れる。送っていないあいだ（始 が空）は、日付が変われば範囲も付いてくる。
*/
const 出す日数 = 30;
function 出す範囲() {
  const from = 見ている.始 || 日をずらす(今日の日付(), -1);
  return { from: from, to: 日をずらす(from, 出す日数 - 1) };
}
function 範囲にかかる月(範囲) {
  const out = [];
  for (let 月 = 範囲.from.slice(0, 7); 月 <= 範囲.to.slice(0, 7); 月 = 月をずらす(月, 1)) out.push(月);
  return out;
}

/*
  月ごとに読んだ中身を、1つの範囲に合わせる。並ぶものは日付で範囲の中だけを残す。
  毎週（曜日方式）と馬は月によらないので、同じものを1つにまとめる。
*/
function 月を合わせる(月ごと, 範囲) {
  const 中 = (k) => k >= 範囲.from && k <= 範囲.to;
  const 一つに = (xs) => { const 見た = {}; return xs.filter((x) => { const k = JSON.stringify(x); if (見た[k]) return false; 見た[k] = true; return true; }); };
  const 集める = (名) => 一つに([].concat.apply([], 月ごと.map((d) => d[名] || [])));
  const 頭 = 月ごと[0];
  return {
    月: 範囲.from, from: 範囲.from, to: 範囲.to, 今日: 頭.今日,
    部員: 頭.部員, 馬: 集める('馬'),
    当番: 集める('当番').filter((x) => 中(x.date)),
    手入れ: 集める('手入れ').filter((x) => 中(x.date)),
    朝手入れ: 集める('朝手入れ').filter((x) => 中(x.date)),
    毎週: 集める('毎週'),
    休み: 集める('休み'), 休みを読めた: 月ごと.every((d) => d.休みを読めた !== false),
    大会: 集める('大会'), 大会に出る: 集める('大会に出る').filter((x) => 中(x.date)),
    大会を読めた: 月ごと.every((d) => d.大会を読めた !== false),
  };
}

// tab=teire なら手入れ予定。それ以外（cal・前の名前の yasumi）はカレンダー
// 始 … 当番・手入れ予定の範囲の頭（?from=）。空なら「きのう」
let 見ている = {
  tab: URLの('tab') === 'teire' ? 'teire' : 'cal',
  月: /^\d{4}-\d{2}$/.test(URLの('month')) ? URLの('month') : 今月(),
  始: /^\d{4}-\d{2}-\d{2}$/.test(URLの('from')) ? URLの('from') : '',
};
let 中身 = null;
let 読む番 = 0;
// 当番の表か手入れの表か（2026-09-23）。?view=care で手入れ。押したほうを覚える
let 見る表 = URLの('view') === 'care' ? 'care' : (URLの('view') === 'duty' ? 'duty' : '');
if (!見る表) { try { 見る表 = localStorage.getItem('calendar:view') === 'care' ? 'care' : 'duty'; } catch (e) { 見る表 = 'duty'; } }

// from〜to を1日ずつ。月をまたいでもよい（当番・手入れ予定は30日ぶん）
function 日の並び(d) {
  const out = [];
  for (let key = d.from, n = 0; key <= d.to && n < 400; key = 日をずらす(key, 1), n++) {
    const p = key.split('-').map(Number);
    const 曜 = new Date(Date.UTC(p[0], p[1] - 1, p[2])).getUTCDay();
    out.push({ key: key, 月: p[1], 日: p[2], label: p[1] + '/' + p[2] + '（' + 曜日名[曜] + '）', 曜: 曜 });
  }
  return out;
}

// 大会がある日 → その日の大会の名前
// 大会の日はサーバが「期間、無ければ競技と仕事の日付」で数えて 日 に入れて返す（期間の無い大会もあるため）
function 大会の日(d) {
  const 表 = {};
  (d.大会 || []).forEach((ev) => {
    const 日 = ev.日 && ev.日.length ? ev.日 : 日の並び(d).map((day) => day.key).filter((k) => ev.from && k >= ev.from && k <= (ev.to || ev.from));
    日.forEach((k) => { (表[k] = 表[k] || []).push(ev.name); });
  });
  return 表;
}

function タブを描く() {
  document.querySelectorAll('.tabs button').forEach((b) => {
    const on = b.dataset.tab === 見ている.tab;
    b.classList.toggle('active', on);
    b.setAttribute('aria-selected', on ? 'true' : 'false');
  });
  const p = 見ている.月.split('-');
  const 手入れ = 見ている.tab === 'teire';
  const 短く = (日) => Number(日.slice(5, 7)) + '/' + Number(日.slice(8, 10));
  const 範囲 = 出す範囲();
  $('monthTitle').textContent = 手入れ ? 短く(範囲.from) + ' 〜 ' + 短く(範囲.to) : p[0] + '年' + Number(p[1]) + '月';
  [['prevMonth', 手入れ ? '前の30日' : '前の月'], ['nextMonth', 手入れ ? '次の30日' : '次の月']].forEach((x) => {
    $(x[0]).setAttribute('aria-label', x[1]);
    $(x[0]).title = x[1];
  });
  $('thisMonth').textContent = 手入れ ? 'きのうから' : '今月';
  $('teireFilter').style.display = 手入れ ? 'flex' : 'none';
  // バイトは、その月に出てくるバイト先ごとに「1文字目＝名前」を並べる（無い月は「バ」で説明だけ）
  const バイト先 = [];
  ((中身 && 中身.休み) || []).forEach((l) => {
    if (l.kind === 'バイト' && l.label && バイト先.indexOf(l.label) < 0) バイト先.push(l.label);
  });
  const バイトの凡例 = バイト先.length
    ? バイト先.map((n) => '<span><b class="tag job">' + esc(Array.from(n)[0]) + '</b> ' + esc(n) + '</span>').join('')
    : '<span><b class="tag job">バ</b> バイト（バイトの名前の1文字目で出ます）</span>';
  // 仕事は、その月に出てくるものを実際の色で並べる（2026-09-20）。1文字だけでは何の仕事か分からないため
  const 仕事たち = [];
  ((中身 && 中身.大会に出る) || []).forEach((x) => {
    (x.印 || []).forEach((s) => {
      if (s.種 === 'out') return;
      // 下付きは馬ごとに題が違う（「北玖の下付き」）ので、凡例では1つにまとめる
      const 題 = s.種 === 'horse' ? '馬に付く（下付き）' : s.題;
      if (仕事たち.some((y) => y.題 === 題)) return;
      仕事たち.push({ 字: s.字, 種: s.種, 題: 題, 背景: s.背景, 文字: s.文字 });
    });
  });
  const 仕事の凡例 = 仕事たち.length
    ? 仕事たち.map((s) => '<span>' + 仕事の札(s) + ' ' + esc(s.題) + '</span>').join('')
    : '<span><b class="tag work">運</b> 仕事（人員表ができると、仕事名の1文字目で出ます）</span>';
  $('legend').innerHTML = 手入れ
    ? '<span><b class="nm mine">名前</b> 自分のぶん</span>' +
      (見る表 === 'care' ? '<span><b class="tag asa">朝</b> 朝手入れ（朝練が休みの日だけ）</span>' : '') +
      '<span><i class="sw"></i>大会がある日</span><span>太い線は週の切れ目（月曜）</span>'
    : '<span><b class="tag off">有</b> 有給休暇</span><span><b class="tag off">季</b> 季節休み</span>' + バイトの凡例 +
      '<span><b class="tag meet">大</b> 大会に出る（人員表ができる前）</span>' +
      '<span><b class="tag entry">出</b> 出場する選手</span>' + 仕事の凡例 +
      '<span><b class="tag off wait">有</b> 点線は了承待ち</span><span><i class="sw"></i>大会がある日</span>';
}

/*
  大会の日の1文字（2026-09-20 ユーザーの指示）。
  仕事は**人員表と同じ色**で塗る（サーバが選択肢シートの 色・文字色 を付けて返す）。
  色が決まっていない仕事は、今までどおりの白地・黒文字。出場する選手だけは決まった赤。
*/
const 印のクラス = { out: 'entry', horse: 'helper', job: 'work' };
function 仕事の札(s) {
  const 塗り = s.背景 || '';
  const 文字 = s.文字 || (塗り ? '#000000' : '');
  const style = 塗り
    ? ' style="background:' + esc(塗り) + ';color:' + esc(文字) + ';border-color:' + esc(文字) + ';"'
    : '';
  return '<b class="tag ' + (印のクラス[s.種] || 'work') + '"' + style + '>' + esc(s.字) + '</b>';
}

/*
  マスに入れる1文字（2026-09-13 ユーザーの指示）。
  有給休暇・季節休みは決まった字。**バイトは副将が付けたバイトの名前の1文字目**（名前が無いときだけ「バ」）。
  1文字目が同じバイトが2つあると見分けにくいので、マスを押す／ポイントすると名前が出るようにしてある（title）。
*/
function 札の字(l) {
  if (l.kind === 'バイト') return 部品.バイトの印(l.label);   // 競馬場は「競」（2026-09-23）
  return 札[l.kind] || Array.from(l.kind || '？')[0];
}

function 描く() {
  タブを描く();
  const d = 中身;
  if (!d) {
    $('view').innerHTML = '<p class="muted" style="padding:var(--space-sm) 0;">読み込んでいます…</p>';
    $('weeklyCard').style.display = 'none';
    return;
  }
  if (見ている.tab === 'teire') 手入れ予定を描く(d);
  else カレンダーを描く(d);

  const 困った = [];
  if (見ている.tab === 'cal' && d.休みを読めた === false) 困った.push('休みを読めませんでした。');
  if (見ている.tab === 'cal' && d.大会を読めた === false) 困った.push('大会を読めませんでした。');
  $('msg').innerHTML = 困った.length ? '<div class="msg warning">' + esc(困った.join(' ')) + '</div>' : '';
}

/* ---------- カレンダー：左に名前、横に日付 ---------- */
function カレンダーを描く(d) {
  $('weeklyCard').style.display = 'none';
  $('mine').innerHTML = '';
  const 日々 = 日の並び(d);
  const 大会 = 大会の日(d);
  const 私 = 私の名前();

  // 名前ごと・日ごとのマス。休みは期間なので、またぐ日すべてに置く
  const マス = {};
  const 置く = (名前, key, html, 題) => {
    const 行 = (マス[名前] = マス[名前] || {});
    (行[key] = 行[key] || []).push({ html: html, 題: 題 });
  };
  (d.休み || []).forEach((l) => {
    日々.forEach((day) => {
      if (day.key < l.from || day.key > (l.to || l.from)) return;
      const 待ち = l.state === '申請中';
      置く(l.名前, day.key,
        '<b class="tag ' + (l.kind === 'バイト' ? 'job' : 'off') + (待ち ? ' wait' : '') + '">' + esc(札の字(l)) + '</b>',
        (l.label || l.kind) + (待ち ? '（了承待ち）' : ''));   // バイトはバイト先の名前で出す
    });
  });
  /*
    大会の日のマス（2026-09-20 ユーザーの指示）。
    人員表ができていれば「大」ではなく、その人の仕事の1文字を出す。
      出 … 出場する選手（赤）　下 … その馬に付く人　運・箱・在… … 仕事名の1文字目
    人員表をまだ作っていない大会は、今までどおり「大」。
  */
  (d.大会に出る || []).forEach((x) => {
    const 印 = x.印 || [];
    if (!印.length) return void 置く(x.名前, x.date, '<b class="tag meet">大</b>', x.大会 + 'に出る');
    印.forEach((s) => 置く(x.名前, x.date, 仕事の札(s), x.大会 + '：' + (s.題 || s.字)));
  });

  // 行の並び：当番・手入れの名簿の順。名簿に無いが予定がある人（4年生など）は後ろに足す
  const 名前たち = (d.部員 || []).map((m) => m.name);
  Object.keys(マス).forEach((n) => { if (名前たち.indexOf(n) < 0) 名前たち.push(n); });
  // 「予定がある人だけ」の絞り込みは 2026-09-20 にユーザーの指示でやめた（いつも名簿の全員を並べる）
  const 並べる = 名前たち;

  const 列の印 = (day) => (大会[day.key] ? ' meet' : '') + (day.key === d.今日 ? ' today' : '');
  const 見出し = '<tr><th class="name" scope="col">名前</th>' + 日々.map((day) =>
    '<th scope="col" class="' + (day.曜 === 6 ? 'sat' : day.曜 === 0 ? 'sun' : '') + 列の印(day) + '"' +
    (大会[day.key] ? ' title="' + esc(大会[day.key].join('・')) + '"' : '') + '>' +
    day.日 + '<span class="w">' + 曜日名[day.曜] + '</span></th>').join('') + '</tr>';

  const 行 = 並べる.map((名前) => '<tr' + (名前 === 私 ? ' class="me"' : '') + '><th class="name" scope="row">' + esc(名前) + '</th>' +
    日々.map((day) => {
      const 中 = ((マス[名前] || {})[day.key]) || [];
      return '<td class="' + 列の印(day).trim() + '"' +
        (中.length ? ' title="' + esc(名前 + ' ' + day.label + ' ' + 中.map((x) => x.題).join('・')) + '"' : '') + '>' +
        中.map((x) => x.html).join('') + '</td>';
    }).join('') + '</tr>').join('');

  $('view').innerHTML = 並べる.length
    ? '<div class="grid-wrap"><table class="grid"><thead>' + 見出し + '</thead><tbody>' + 行 + '</tbody></table></div>'
    : '<p class="muted" style="padding:var(--space-sm) 0;">この月に予定がある人はいません。</p>';

  // 今日の列が見えるところまで横に送る（月のなかばを開いたとき、1日から探さなくて済むように）
  const 今日の列 = document.querySelector('table.grid thead th.today');
  const 枠 = document.querySelector('.grid-wrap');
  if (今日の列 && 枠) 枠.scrollLeft = Math.max(0, 今日の列.offsetLeft - 枠.clientWidth / 2);
}

/* ---------- 当番・手入れ予定：当番は列、手入れはその下の段（2026-09-21 作り直し） ---------- */
let 自分だけ見る = false;
let 今日へ送った = '';   // 同じ月で何度も送らない（描き直しのたびに画面が動くと読めない）

function 手入れ予定を描く(d) {
  const 大会 = 大会の日(d);
  const 選んだ馬 = $('horseSelect').value;
  const 馬たち = (d.馬 || []).slice();
  (d.手入れ || []).concat(d.毎週 || []).concat(d.朝手入れ || []).forEach((x) => { if (馬たち.indexOf(x.馬) < 0) 馬たち.push(x.馬); });
  $('horseSelect').innerHTML = '<option value="">すべての馬</option>' + 馬たち.map((h) => '<option' + (h === 選んだ馬 ? ' selected' : '') + '>' + esc(h) + '</option>').join('');

  const 私 = 私の名前();
  const 自分だけ = 自分だけ見る && !!私;
  document.querySelectorAll('#teireFilter [data-who]').forEach((b) => {
    const on = (b.dataset.who === 'me') === 自分だけ;
    b.classList.toggle('selected', on);
    b.setAttribute('aria-pressed', on ? 'true' : 'false');
  });
  const 手入れの表を見る = 見る表 === 'care';
  document.querySelectorAll('#teireFilter [data-view]').forEach((b) => {
    const on = b.dataset.view === 見る表;
    b.classList.toggle('on', on);
    b.setAttribute('aria-pressed', on ? 'true' : 'false');
  });
  // 馬の絞り込みは手入れの表だけのもの
  $('horseSelect').parentNode.style.display = 手入れの表を見る ? '' : 'none';
  const 名前の札 = (名前, 朝) => '<span class="nm' + (名前 === 私 ? ' mine' : '') + '">' + (朝 ? '<b class="tag asa" title="朝手入れ">朝</b>' : '') + esc(名前) + '</span>';

  // 当番：日 → 当番名 → [名前]。列は昼当→夕当→投げ草（並び）の順
  const 当番たち = (d.当番 || []).filter((x) => !自分だけ || x.名前 === 私);
  const 列 = [];
  当番たち.slice().sort((a, b) => (a.並び || 0) - (b.並び || 0)).forEach((x) => { if (列.indexOf(x.当番) < 0) 列.push(x.当番); });
  const 当番の表 = {};
  当番たち.forEach((x) => {
    const 日 = (当番の表[x.date] = 当番の表[x.date] || {});
    (日[x.当番] = 日[x.当番] || []).push(x.名前);
  });

  // 手入れ：日 → 馬 → [{名前, 朝}]。朝手入れ（カレンダー式の馬だけ日付を持つ）を先に
  const 手入れの表 = {};
  const 手入れを置く = (x, 朝) => {
    if (選んだ馬 && x.馬 !== 選んだ馬) return;
    if (自分だけ && x.名前 !== 私) return;
    const 日 = (手入れの表[x.date] = 手入れの表[x.date] || {});
    (日[x.馬] = 日[x.馬] || []).push({ 名前: x.名前, 朝: 朝 });
  };
  (d.朝手入れ || []).forEach((x) => 手入れを置く(x, true));
  (d.手入れ || []).forEach((x) => 手入れを置く(x, false));
  const 馬の列 = (選んだ馬 ? [選んだ馬] : 馬たち).filter((h) => !自分だけ || Object.keys(手入れの表).some((k) => 手入れの表[k][h]));

  自分のこれからを描く(d, 私);

  const 帯 = document.querySelector('header.appbar');
  document.documentElement.style.setProperty('--bar-h',
    (帯 && getComputedStyle(帯).position === 'sticky' ? 帯.offsetHeight : 0) + 'px');

  const ある表 = 手入れの表を見る ? 手入れの表 : 当番の表;
  const 日々 = 日の並び(d).filter((day) => !自分だけ || ある表[day.key]);
  if (!Object.keys(ある表).length || !日々.length) {
    $('view').innerHTML = '<p class="muted" style="padding:var(--space-sm) 0;">' +
      (自分だけ ? 'この30日に、' + esc(私) + 'さんの' + (手入れの表を見る ? '手入れ' : '当番') + 'はありません。'
        : 選んだ馬 && 手入れの表を見る ? 'この30日の' + esc(選んだ馬) + 'の手入れ表はまだありません。'
        : 'この30日の' + (手入れの表を見る ? '手入れ表' : '当番表') + 'はまだありません。') +
      '</p>';
  } else {
    const 見出しの列 = 手入れの表を見る ? 馬の列 : 列;
    const 日の見出し = (day, i) => {
      const 今日 = day.key === d.今日;
      const 月を出す = i === 0 || 日々[i - 1].月 !== day.月;
      return '<th class="d" scope="row" aria-label="' + esc(day.label + (今日 ? ' 今日' : '')) + '">' +
        (月を出す ? '<span class="m">' + day.月 + '月</span>' : '') +
        '<span class="n">' + day.日 + '</span><span class="w">' + (今日 ? '今日' : 曜日名[day.曜]) + '</span>' +
        (大会[day.key] ? '<span class="ev">' + esc(大会[day.key].join('・')) + '</span>' : '') +
        '</th>';
    };
    const 行のクラス = (day, i) => 'sched-day' + (day.曜 === 6 ? ' sat' : day.曜 === 0 ? ' sun' : '') +
      (day.曜 === 1 && i > 0 ? ' wk' : '') + (大会[day.key] ? ' meet' : '') + (day.key === d.今日 ? ' today' : '');
    const 行たち = 日々.map((day, i) => {
      const マス = 手入れの表を見る
        ? 馬の列.map((h) => {
            const 人 = ((手入れの表[day.key] || {})[h] || []);
            return '<td' + (人.some((x) => x.名前 === 私) ? ' class="mine-cell"' : '') + '>' + 人.map((x) => 名前の札(x.名前, x.朝)).join('') + '</td>';
          }).join('')
        : 列.map((名) => {
            const 人 = ((当番の表[day.key] || {})[名] || []);
            return '<td' + (人.indexOf(私) >= 0 ? ' class="mine-cell"' : '') + ' data-duty="' + esc(名) + '">' + (人.map((n) => 名前の札(n, false)).join('') || '<span class="none">—</span>') + '</td>';
          }).join('');
      return '<tr class="' + 行のクラス(day, i) + '" id="d-' + day.key + '">' + 日の見出し(day, i) + (見出しの列.length ? マス : '<td></td>') + '</tr>';
    }).join('');
    $('view').innerHTML = '<div class="sched-wrap"><table class="sched ' + (手入れの表を見る ? 'care' : 'duty') + '"><thead><tr>' +
      '<th class="d">日</th>' + 見出しの列.map((名) => '<th>' + esc(名) + '</th>').join('') + '</tr></thead><tbody>' +
      行たち + '</tbody></table></div>';
  }

  // 今月を開いたら、今日の行が見えるところまで送る（1日から探さなくて済むように）。月ごとに1回だけ
  const 今日の行 = document.querySelector('table.sched tr.today');
  if (今日の行 && 今日へ送った !== d.月) {
    今日へ送った = d.月;
    if (今日の行.getBoundingClientRect().bottom > window.innerHeight) 今日の行.scrollIntoView({ block: 'center' });
  }

  // 毎週決まっている手入れは、手入れの表のときだけ
  if (手入れの表を見る) 毎週の手入れを描く(d, 選んだ馬, 自分だけ, 私);
  else $('weeklyCard').style.display = 'none';
}

/*
  自分のこれから（2026-09-21）。表の中から自分の名前を探さなくて済むように、いちばん上に並べる。
  今日が入っている範囲では今日から先だけ、＜＞で送った先ではその30日ぶんを全部。押すとその日の行へ。
*/
function 自分のこれからを描く(d, 私) {
  if (!私) {
    $('mine').innerHTML = '<div class="my-next"><p>左上の「← マイページ」で名前を選ぶと、ここに自分の当番・手入れが並びます。</p></div>';
    return;
  }
  const 件 = [];
  (d.当番 || []).forEach((x) => { if (x.名前 === 私) 件.push({ date: x.date, 順: 0, html: '<span class="k t">' + esc(x.当番) + '</span>' }); });
  (d.朝手入れ || []).forEach((x) => { if (x.名前 === 私) 件.push({ date: x.date, 順: 1, html: '<span class="k c">' + esc(x.馬) + 'の朝手入れ</span>' }); });
  (d.手入れ || []).forEach((x) => { if (x.名前 === 私) 件.push({ date: x.date, 順: 2, html: '<span class="k c">' + esc(x.馬) + 'の手入れ</span>' }); });
  const 今月を見ている = d.今日 >= d.from && d.今日 <= d.to;
  const 先 = 件.filter((x) => !今月を見ている || x.date >= d.今日)
    .sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : a.順 - b.順));
  const 日の名 = {};
  日の並び(d).forEach((day) => { 日の名[day.key] = day.key === d.今日 ? '今日' : day.label; });
  $('mine').innerHTML = '<div class="my-next"><h3>' + esc(私) + 'さんの' + (今月を見ている ? 'これから' : 'この30日') + '</h3>' +
    (先.length
      ? '<div class="list">' + 先.map((x) => '<a href="#d-' + x.date + '" data-go="d-' + x.date + '"><b>' + esc(日の名[x.date] || x.date) + '</b>' + x.html + '</a>').join('') + '</div>'
      : '<p>' + (今月を見ている ? 'この先（' + esc(日の名[d.to] || '') + 'まで）の当番・手入れは入っていません。' : 'この30日の当番・手入れは入っていません。') + '</p>') + '</div>';
}

// 毎週決まっている手入れ（曜日方式）。期間の名前ごとに、馬×曜日の表にする
function 毎週の手入れを描く(d, 選んだ馬, 自分だけ, 私) {
  const 毎週 = (d.毎週 || []).filter((x) => (!選んだ馬 || x.馬 === 選んだ馬) && (!自分だけ || x.名前 === 私));
  $('weeklyCard').style.display = 毎週.length ? 'block' : 'none';
  if (!毎週.length) return;
  const 週の曜日 = ['月', '火', '水', '木', '金', '土', '日'];
  const 期間たち = [];
  毎週.forEach((x) => { if (期間たち.indexOf(x.期間) < 0) 期間たち.push(x.期間); });
  $('weekly').innerHTML = 期間たち.map((期間) => {
    const 行 = 毎週.filter((x) => x.期間 === 期間);
    const 馬ごと = [];
    行.forEach((x) => { if (馬ごと.indexOf(x.馬) < 0) 馬ごと.push(x.馬); });
    return '<h3>' + esc(期間 || '期間の名前なし') + '</h3><div class="week-wrap"><table class="week"><thead><tr><th>馬</th>' +
      週の曜日.map((w) => '<th>' + w + '</th>').join('') + '</tr></thead><tbody>' +
      馬ごと.map((h) => '<tr><th>' + esc(h) + '</th>' + 週の曜日.map((w) => '<td>' +
        行.filter((x) => x.馬 === h && x.曜日 === w).map((x) => '<span class="nm' + (x.名前 === 私 ? ' mine' : '') + '">' + esc(x.名前) + '</span>').join('<br>') +
        '</td>').join('') + '</tr>').join('') +
      '</tbody></table></div>';
  }).join('');
}

/*
  前に見た月の中身を先に出し、届いたら差し替える。
  カレンダーは月1つ。当番・手入れ予定は、範囲にかかる月（ふつう2つ）を並べて読み、1つに合わせる。
  どちらも月ごとに覚えるので、タブを行き来しても同じ月は読み直しの前にすぐ出る。
*/
async function 読む() {
  const 番 = ++読む番;
  const 手入れ = 見ている.tab === 'teire';
  const 範囲 = 出す範囲();
  const 月たち = 手入れ ? 範囲にかかる月(範囲) : [見ている.月];
  const まとめる = (月ごと) => (手入れ ? 月を合わせる(月ごと, 範囲) : 月ごと[0]);
  const 覚えていた = 月たち.map((月) => 覚え.取る('calendar:' + 月));
  中身 = 覚えていた.every(Boolean) ? まとめる(覚えていた) : null;
  描く();
  try {
    const 月ごと = await Promise.all(月たち.map((月) => call('getCalendarData', 月)));
    if (番 !== 読む番) return;
    月ごと.forEach((d, i) => 覚え.置く('calendar:' + 月たち[i], d));
    中身 = まとめる(月ごと);
    描く();
  } catch (e) {
    if (番 !== 読む番) return;
    $('msg').innerHTML = '<div class="msg error">' + esc('読み込めませんでした：' + ((e && e.message) || e)) +
      (中身 ? '（前に読んだ内容を出しています）' : '') + '</div>';
  }
}

function URLを合わせる() {
  const 手入れ = 見ている.tab === 'teire';
  try {
    history.replaceState(null, '', '?tab=' + 見ている.tab + (手入れ ? (見ている.始 ? '&from=' + 見ている.始 : '') + '&view=' + 見る表 : '&month=' + 見ている.月));
  } catch (e) { /* GAS の枠の中では変えられない */ }
}
function 月を変える(月) { 見ている.月 = 月; URLを合わせる(); 読む(); }
// 当番・手入れ予定は30日ずつ送る。n = 0 で「きのうから」に戻す
function 範囲を送る(n) {
  見ている.始 = n ? 日をずらす(出す範囲().from, n * 出す日数) : '';
  今日へ送った = '';
  URLを合わせる();
  読む();
}

document.querySelector('.tabs').addEventListener('click', (e) => {
  const b = e.target.closest ? e.target.closest('[data-tab]') : null;
  if (!b) return;
  見ている.tab = b.dataset.tab;
  URLを合わせる();
  読む();   // カレンダーは月、当番・手入れ予定は30日。出す範囲が違うので読み直す（覚えていればすぐ出る）
});
const 手入れを見ている = () => 見ている.tab === 'teire';
$('prevMonth').addEventListener('click', () => (手入れを見ている() ? 範囲を送る(-1) : 月を変える(月をずらす(見ている.月, -1))));
$('nextMonth').addEventListener('click', () => (手入れを見ている() ? 範囲を送る(1) : 月を変える(月をずらす(見ている.月, 1))));
$('thisMonth').addEventListener('click', () => (手入れを見ている() ? 範囲を送る(0) : 月を変える(今月())));
$('horseSelect').addEventListener('change', 描く);
// みんな／自分だけ。札は button ではない（button は全部青い決まりなので）ので、Enter・スペースも拾う
function だれのぶんを切り替える(b) {
  if (b.dataset.who === 'me' && !私の名前()) {
    $('msg').innerHTML = '<div class="msg warning">自分のぶんを出すには、左上の「← マイページ」で名前を選んでください。</div>';
    return;
  }
  自分だけ見る = b.dataset.who === 'me';
  描く();
}
$('teireFilter').addEventListener('click', (e) => {
  const v = e.target.closest ? e.target.closest('[data-view]') : null;
  if (v) {
    見る表 = v.dataset.view === 'care' ? 'care' : 'duty';
    try { localStorage.setItem('calendar:view', 見る表); } catch (err) { /* 覚えられなくても動く */ }
    URLを合わせる();
    描く();
    return;
  }
  const b = e.target.closest ? e.target.closest('[data-who]') : null;
  if (b) だれのぶんを切り替える(b);
});
$('teireFilter').addEventListener('keydown', (e) => {
  const b = e.target.closest ? e.target.closest('[data-who]') : null;
  if (!b || (e.key !== 'Enter' && e.key !== ' ')) return;
  e.preventDefault();
  だれのぶんを切り替える(b);
});
// 自分のこれから → その日の行へ。URL に # を足さない（月や見ているタブの覚えを壊さないため）
$('mine').addEventListener('click', (e) => {
  const a = e.target.closest ? e.target.closest('[data-go]') : null;
  if (!a) return;
  e.preventDefault();
  const 行 = document.getElementById(a.dataset.go);
  if (!行) return;
  行.scrollIntoView({ block: 'center' });
  部品.光らせる([行]);
});

読む();
</script>
</body>
</html>
