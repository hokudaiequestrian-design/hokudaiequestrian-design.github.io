<!DOCTYPE html>
<html lang="ja">
<head>
<base target="_top">
<?!= include('style') ?>
<style>
/*
  サブをまとめて直す（2026-09-13）。
  行＝部員、列＝選んだ期間がある馬。1マス＝「この人をこの馬のサブにするか」。
  チーフ画面は1頭ずつ開くので、期の変わり目に全部の馬を入れ替えると頭数ぶん往復していた。
*/
.subs-wrap { max-height: 72vh; overflow: auto; }   /* 枠の中で縦にも動かして、見出しを上に貼り付ける */
table.subs-grid { border-collapse: separate; border-spacing: 0; width: auto; min-width: 100%; }
table.subs-grid th, table.subs-grid td {
  border: 1px solid var(--rule-strong); border-width: 0 1px 1px 0;
  padding: 0; text-align: center; vertical-align: middle;
}
table.subs-grid thead th {
  position: sticky; top: 0; z-index: var(--z-raised); background: var(--paper-3);
  padding: var(--space-xs); min-width: 112px; vertical-align: bottom; line-height: 1.4;
}
table.subs-grid .sub { display: block; font-size: var(--text-xs); font-weight: 400; color: var(--muted); }
table.subs-grid .sub.ng { color: var(--danger); font-weight: 700; }
table.subs-grid th.rowhead {
  position: sticky; left: 0; z-index: calc(var(--z-raised) + 1); background: var(--paper-3);
  text-align: left; padding: var(--space-xs) var(--space-sm); white-space: nowrap;
}
table.subs-grid thead th.rowhead { z-index: calc(var(--z-raised) + 2); }
table.subs-grid td label {
  display: flex; align-items: center; justify-content: center; gap: var(--space-2xs);
  margin: 0; min-height: var(--tap); padding: var(--space-2xs) var(--space-xs); cursor: pointer; font-weight: 400;
}
table.subs-grid td label:hover { background: var(--accent-soft); }
table.subs-grid td.on { background: var(--care-soft); }
/* 保存していないマス。色だけでなく太い内枠でも分かる */
table.subs-grid td.changed { box-shadow: inset 0 0 0 3px var(--warning); }
table.subs-grid .tag { font-size: var(--text-xs); font-weight: 700; color: var(--care); }
</style>
</head>
<body>
<div id="busy">通信中です…</div>
<header class="appbar chief"><span>手入れのサブ（まとめて直す）</span></header>

<main class="wide">
  <!-- ログイン -->
  <div class="card" id="loginCard" style="display:none;">
    <h2>チーフパスワード</h2>
    <input type="password" id="pw" placeholder="パスワード" aria-label="チーフパスワード">
    <div style="margin-top:12px;"><button id="loginBtn">開く</button></div>
    <div id="loginMsg" role="status" aria-live="polite"></div>
  </div>

  <div id="app" style="display:none;">
    <div class="card">
      <h2>1. 期間を選ぶ</h2>
      <p class="hint">
        サブは期間ごとに決まっています。選んだ期間がある馬を横に並べます。<br>
        期間を作る・1頭ずつ手入れ表を作るのは <a href="teire-chief.html">手入れをまとめる</a> の画面です。
      </p>
      <label for="termSelect">期間</label>
      <select id="termSelect"></select>
      <div id="termNote"></div>
    </div>

    <div class="card" id="gridCard" style="display:none;">
      <h2>2. サブにする人にチェック</h2>
      <p class="hint">
        縦が部員、横が馬です。<b>チーフ本人もサブに入れてください</b>（入れないと「チーフ2：ほかのサブ1」が効きません）。<br>
        サブから外した人の、その馬の◎○×と手入れ表に入っているぶんは、保存したときに消えます。
      </p>
      <div class="grid-wrap subs-wrap" id="gridBox"></div>
      <div id="dirtyText" role="status" aria-live="polite"></div>
      <div class="row tight" style="margin-top:16px;">
        <button id="saveBtn">サブをまとめて保存</button>
        <button id="discardBtn" class="secondary">直したのを取り消す</button>
      </div>
      <div id="saveMsg" role="status" aria-live="polite"></div>
    </div>
  </div>
</main>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const msgIn = (id, cls, text) => { $(id).innerHTML = text ? '<div class="msg ' + cls + '">' + esc(text) + '</div>' : ''; };

let TOKEN = '';
let BASE = null;       // chiefLoadAll の返り（subs 付き）
let 期間 = '';         // いま開いている期間名
let 今 = {};           // 計画ID → { 部員ID: true }。画面で直しているぶん
let busyCount = 0;

function busy(on) {
  busyCount += on ? 1 : -1;
  $('busy').className = busyCount > 0 ? 'on' : '';
}
function call(fn) {
  const args = Array.prototype.slice.call(arguments, 1);
  busy(true);
  return new Promise((resolve, reject) => {
    google.script.run
      .withSuccessHandler((r) => { busy(false); resolve(r); })
      .withFailureHandler((e) => { busy(false); reject(e); })[fn].apply(null, args);
  });
}

// チーフ画面と行き来するたびにパスワードを聞かないよう、同じタブのあいだだけ覚えておく
const トークンの鍵 = 'teire:chiefToken';
const 覚える = (t) => { try { sessionStorage.setItem(トークンの鍵, t); } catch (e) { /* 覚えられなくても入り直せば使える */ } };
const 思い出す = () => { try { return sessionStorage.getItem(トークンの鍵) || ''; } catch (e) { return ''; } };

const 名 = (id) => { const m = BASE.members.filter((x) => x.id === id)[0]; return m ? m.name : '（消えた人）'; };
const 保存ずみ = (planId) => (BASE.subs || {})[planId] || [];

// いまの期間がある馬だけを、馬の並びのまま列にする
const 列 = () => BASE.horses.filter((h) => h.active)
  .map((h) => ({ horse: h, plan: BASE.plans.filter((p) => p.horseId === h.id && p.term === 期間)[0] }))
  .filter((c) => c.plan);

// ===================== ログイン =====================

(async () => {
  try {
    const meta = await call('chiefMeta');
    if (!meta.要パスワード) {
      const 入った = await call('loginChiefAndLoad', '');
      TOKEN = 入った.token;
      覚える(TOKEN);
      return void 始める(入った.base);
    }
    const t = 思い出す();
    if (t) {
      try {
        const base = await call('chiefLoadAll', t);
        TOKEN = t;
        return void 始める(base);
      } catch (e) { /* 期限が切れていたら、パスワードを入れ直してもらう */ }
    }
    $('loginCard').style.display = 'block';
  } catch (e) {
    $('loginCard').style.display = 'block';
    msgIn('loginMsg', 'error', (e && e.message) || e);
  }
})();

$('loginBtn').addEventListener('click', async () => {
  try {
    const 入った = await call('loginChiefAndLoad', $('pw').value);
    TOKEN = 入った.token;
    覚える(TOKEN);
    始める(入った.base);
  } catch (e) { msgIn('loginMsg', 'error', (e && e.message) || e); }
});
$('pw').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('loginBtn').click(); });

function 始める(base) {
  BASE = base;
  $('loginCard').style.display = 'none';
  $('app').style.display = 'block';
  const 名前たち = BASE.期間名 || [];
  if (!名前たち.length) {
    $('termSelect').innerHTML = '<option value="">（期間がまだありません）</option>';
    msgIn('termNote', 'warning', 'まだ期間が1つもありません。先に「手入れをまとめる」の画面で期間を作ってください。');
    return;
  }
  $('termSelect').innerHTML = 名前たち.map((t) => '<option value="' + esc(t) + '">' + esc(t) + '</option>').join('');
  // チーフ画面から来たときはその期間。なければ計画シートでいちばん後ろに出てくる期間（たいてい最新）
  const 指定 = new URLSearchParams(location.search).get('term');
  $('termSelect').value = 名前たち.indexOf(指定) >= 0 ? 指定 : 名前たち[名前たち.length - 1];
  期間を開く();
}

// ===================== 1. 期間 =====================

function 期間を開く() {
  期間 = $('termSelect').value;
  今 = {};
  列().forEach((c) => {
    今[c.plan.id] = {};
    保存ずみ(c.plan.id).forEach((id) => { 今[c.plan.id][id] = true; });
  });

  const 無い馬 = BASE.horses.filter((h) => h.active &&
    !BASE.plans.some((p) => p.horseId === h.id && p.term === 期間));
  $('termNote').innerHTML = 無い馬.length
    ? '<p class="hint">「' + esc(期間) + '」が無い馬：<b>' + esc(無い馬.map((h) => h.name).join('、')) + '</b>。' +
      'この表には出ません。入れるときは先に「手入れをまとめる」で期間を作ってください。</p>'
    : '';
  msgIn('saveMsg', '', '');
  描く();
}

$('termSelect').addEventListener('change', () => {
  if (変わった計画().length && !confirm('保存していない直しがあります。ほかの期間を開くと消えます。よろしいですか？')) {
    $('termSelect').value = 期間;
    return;
  }
  期間を開く();
});

// ===================== 2. 表 =====================

function 描く() {
  const cols = 列();
  if (!cols.length) {
    $('gridCard').style.display = 'none';
    if (期間) msgIn('termNote', 'warning', '「' + 期間 + '」がある馬がいません（使っていない馬だけのようです）。');
    return;
  }
  $('gridCard').style.display = 'block';

  // 出し直しても、見ていた場所から動かさない
  const 前の位置 = { x: $('gridBox').scrollLeft, y: $('gridBox').scrollTop };

  const 頭 = '<thead><tr><th class="rowhead" scope="col">部員<span class="sub">担当する馬の数</span></th>' +
    cols.map((c) => '<th scope="col">' + esc(c.horse.name) +
      '<span class="sub" data-colinfo="' + esc(c.plan.id) + '"></span></th>').join('') +
    '</tr></thead>';

  const 体 = BASE.members.map((m) => '<tr>' +
    '<th class="rowhead" scope="row">' + esc(m.name) +
    (m.grade ? ' <span class="muted">' + m.grade + '年</span>' : '') +
    '<span class="sub" data-rowinfo="' + esc(m.id) + '"></span></th>' +
    cols.map((c) => {
      const on = !!今[c.plan.id][m.id];
      const チーフ = !!c.horse.chief && c.horse.chief === m.name;
      return '<td data-cell="' + esc(c.plan.id + '|' + m.id) + '"><label>' +
        '<input type="checkbox" data-plan="' + esc(c.plan.id) + '" data-member="' + esc(m.id) + '"' +
        (on ? ' checked' : '') +
        ' aria-label="' + esc(m.name + ' を ' + c.horse.name + ' のサブにする' + (チーフ ? '（チーフ）' : '')) + '">' +
        (チーフ ? '<span class="tag" aria-hidden="true">チーフ</span>' : '') +
        '</label></td>';
    }).join('') + '</tr>').join('');

  $('gridBox').innerHTML = '<table class="subs-grid">' + 頭 + '<tbody>' + 体 + '</tbody></table>';
  $('gridBox').scrollLeft = 前の位置.x;
  $('gridBox').scrollTop = 前の位置.y;
  数を出し直す();
}

// 表を描き直さずに、数・印・知らせだけ合わせる（描き直すとキーボードの位置が飛ぶため）
function 数を出し直す() {
  const cols = 列();
  const 列で引く = {};
  cols.forEach((c) => { 列で引く[c.plan.id] = c; });

  document.querySelectorAll('[data-colinfo]').forEach((el) => {
    const c = 列で引く[el.dataset.colinfo];
    const ids = Object.keys(今[c.plan.id]);
    const 文 = [ids.length + '人'];
    let だめ = ids.length === 0;
    const チーフ名 = c.horse.chief;
    if (!チーフ名) {
      文.push('チーフ未定');
    } else {
      const チーフ = BASE.members.filter((m) => m.name === チーフ名)[0];
      if (!チーフ) { 文.push('チーフ「' + チーフ名 + '」が名簿にない'); だめ = true; }
      else if (!今[c.plan.id][チーフ.id]) { 文.push('チーフが入っていない'); だめ = true; }
    }
    el.textContent = 文.join('・');
    el.className = 'sub' + (だめ ? ' ng' : '');
  });

  document.querySelectorAll('[data-rowinfo]').forEach((el) => {
    const id = el.dataset.rowinfo;
    el.textContent = cols.filter((c) => 今[c.plan.id][id]).length + '頭';
  });

  document.querySelectorAll('[data-cell]').forEach((td) => {
    const p = td.dataset.cell.split('|');
    const on = !!今[p[0]][p[1]];
    const 前 = 保存ずみ(p[0]).indexOf(p[1]) >= 0;
    td.className = (on ? 'on' : '') + (on !== 前 ? ' changed' : '');
  });

  const 変わった = 変わった計画();
  msgIn('dirtyText', 変わった.length ? 'warning' : '', 変わった.length
    ? 'まだ保存していない馬：' + 変わった.map((c) => c.horse.name).join('、') + '（' + 変わった.length + '頭）'
    : '');
}

function 変わった計画() {
  if (!BASE) return [];
  return 列().filter((c) => {
    const 前 = 保存ずみ(c.plan.id);
    const 後 = Object.keys(今[c.plan.id] || {});
    return 前.length !== 後.length || 前.some((id) => !今[c.plan.id][id]);
  });
}

$('gridBox').addEventListener('change', (e) => {
  const c = e.target.closest('input[data-plan]');
  if (!c) return;
  if (c.checked) 今[c.dataset.plan][c.dataset.member] = true;
  else delete 今[c.dataset.plan][c.dataset.member];
  msgIn('saveMsg', '', '');
  数を出し直す();
});

// ===================== 保存 =====================

$('saveBtn').addEventListener('click', async () => {
  const 変わった = 変わった計画();
  if (!変わった.length) {
    return void msgIn('saveMsg', 'warning', '変えたところがありません。チェックを付けたり外したりしてから押してください。');
  }
  const 外れる = 変わった.map((c) => {
    const 人 = 保存ずみ(c.plan.id).filter((id) => !今[c.plan.id][id]);
    return 人.length ? c.horse.name + '：' + 人.map(名).join('、') : '';
  }).filter((x) => x);
  if (外れる.length && !confirm('次の人をサブから外します。\n' + 外れる.join('\n') +
    '\n\nこの人たちの、その馬の◎○×と手入れ表に入っているぶんも消えます。よろしいですか？')) return;

  const 送る = {};
  変わった.forEach((c) => { 送る[c.plan.id] = Object.keys(今[c.plan.id]); });
  try {
    const r = await call('chiefSaveSubsBulk', TOKEN, 送る);
    BASE.subs = r.subs || {};
    期間を開く();
    msgIn('saveMsg', 'success', 変わった.length + '頭ぶんのサブを保存しました（' +
      変わった.map((c) => c.horse.name).join('、') + '）。' +
      (r.外れた ? '外した' + r.外れた + '人ぶんの◎○×と手入れ表も消しました。' : ''));
  } catch (e) {
    msgIn('saveMsg', 'error', '保存できませんでした：' + ((e && e.message) || e));
  }
});

$('discardBtn').addEventListener('click', () => {
  if (!変わった計画().length) return void msgIn('saveMsg', 'warning', '取り消す直しはありません。');
  if (!confirm('直したのを取り消して、保存されているサブに戻します。よろしいですか？')) return;
  期間を開く();
});

window.addEventListener('beforeunload', (e) => {
  if (!変わった計画().length) return;
  e.preventDefault();
  e.returnValue = '';
});
</script>
</body>
</html>
